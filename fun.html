  <div class="head">
    <h1>惠城今晚去哪、周末去哪</h1>
    <p class="sub">不是旅游攻略。是城市人下班后、周末的日常：发呆、逛街、带娃、动起来。</p>
  </div>

  <div class="tabs" id="tabs">
    <button class="on" data-c="all">全部</button>
    <button data-c="cafe">☕ 发呆咖啡</button>
    <button data-c="shop">🛍️ 逛街约会</button>
    <button data-c="night">🍻 晚上去哪</button>
    <button data-c="kid">👨‍👩‍👧 带娃</button>
    <button data-c="sport">🏃 动起来</button>
    <button data-c="food">🍜 觅食</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="disc">
    内容来自惠州市/惠城区公开文旅资源与本地口碑。江北服务业占全区近半——晚上水东街亮不亮、华贸周末排不排队，就是这台风洞最关心的"人层活力"。具体营业与门票以现场为准。
  </div>

  <div class="next"><a href="network.html">下一步：看惠城怎么长出来 →</a></div>
</div>

<script>
const SPOTS=[
  {n:"野岛文化生活社区",c:"cafe",tag:"发呆",d:"旧工厂改的文创园，咖啡、书店、展览、小馆子，惠城年轻人的据点",why:"下午坐一下午，比逛商场舒服"},
  {n:"桥东江边",c:"cafe",tag:"咖啡",d:"江边老巷，一排咖啡馆小酒馆，傍晚坐外面吹风",why:"惠城的小鼓浪屿"},
  {n:"江北华贸天地",c:"shop",tag:"逛街",d:"惠城最顶的商场，餐厅、影院、超市，周末约会标配",why:"周末不知道去哪，去华贸准没错"},
  {n:"佳兆业中心",c:"shop",tag:"逛街",d:"江北商圈，品牌餐饮+商场，下班顺路逛",why:"白领下班的第二站"},
  {n:"隆生广场/丽日",c:"shop",tag:"老商圈",d:"老城熟客常去，本地生活气重",why:"本地人真逛的商场"},
  {n:"水东街",c:"night",tag:"夜生活",d:"骑楼老街晚上亮灯，清吧、小吃、夜市，年轻人聚集地",why:"要热闹，来水东街"},
  {n:"东江夜游/江边",c:"night",tag:"散步",d:"晚饭后滨江路走一圈，吹江风",why:"不用花钱，最舒服的晚上"},
  {n:"市博物馆/科技馆",c:"kid",tag:"带娃",d:"免费，孩子能看一天，下雨天首选",why:"遛娃不费妈"},
  {n:"市民乐园/江北体育馆",c:"kid",tag:"遛娃",d:"大草坪放风筝、跑步、打球",why:"周末放电"},
  {n:"红花湖骑行",c:"sport",tag:"运动",d:"18公里环湖绿道，租车一圈，周末出汗",why:"比健身房爽"},
  {n:"滨江绿道跑步",c:"sport",tag:"运动",d:"东江边夜跑/晨跑，看江北天际线",why:"城市人最日常的运动"},
  {n:"客家老味道",c:"food",tag:"觅食",d:"盐焗鸡、梅菜扣肉、酿豆腐、艾粄，南坛下埔老街小馆",why:"带朋友来就吃这个"}
];

function render(cat){
  const tabs={all:"全部",cafe:"☕ 发呆咖啡",shop:"🛍️ 逛街约会",night:"🍻 晚上去哪",kid:"👨‍👩‍👧 带娃",sport:"🏃 动起来",food:"🍜 觅食"};
  const list=cat==="all"?SPOTS:SPOTS.filter(x=>x.c===cat);
  document.getElementById("grid").innerHTML=list.map(x=>`
    <div class="card">
      <span class="n">${x.n}</span><span class="tag">${x.tag}</span>
      <div class="d">${x.d}</div>
      <div class="why">→ ${x.why}</div>
    </div>`).join("");
}
render("all");
document.querySelectorAll("#tabs button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    render(b.dataset.c);
  };
});
</script>
