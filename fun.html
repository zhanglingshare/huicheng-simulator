<div class="wrap">
  <div class="head">
    <h1>惠城今晚去哪、周末去哪</h1>
    <p class="sub">市中心的吃喝玩乐，不用跑远。夜景、公园、老街、商圈——点下面看分类。</p>
  </div>

  <div class="tabs" id="tabs">
    <button class="on" data-c="all">全部</button>
    <button data-c="night">🌆 夜景夜生活</button>
    <button data-c="park">🌳 遛弯带娃</button>
    <button data-c="food">🍜 觅食</button>
    <button data-c="shop">🛍️ 逛街</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="disc">
    内容来自惠州市/惠城区公开文旅资源与本地口碑。江北服务业占全区近半——晚上水东街亮不亮、华贸周末排不排队，就是这台风洞最关心的"人层活力"。具体营业与门票以现场为准。
  </div>

  <div class="next"><a href="network.html">下一步：看惠城怎么长出来 →</a></div>
</div>

<script>
const SPOTS=[
  {n:"水东街",c:"night",tag:"夜景",d:"千年商埠骑楼，晚上灯光亮起，酒吧、小吃、江边散步，年轻人聚集地",why:"老街区新活力，晚上最热闹"},
  {n:"合江楼·东江夜游",c:"night",tag:"夜景",d:"西枝江汇入东江处，灯光游船，看两江四岸",why:"坐着船看惠州夜景"},
  {n:"桥东老街",c:"night",tag:"文艺",d:"江边老巷，咖啡馆、小馆、夜市，慢逛",why:"惠城的小厦门"},
  {n:"惠州西湖",c:"park",tag:"5A景区",d:"就在市中心，苏堤、泗洲塔、百花洲，免费，划船散步",why:"市中心的湖，周末人最多"},
  {n:"红花湖绿道",c:"park",tag:"骑行",d:"18公里环湖绿道，租车骑行，高榜山下，亲子首选",why:"骑行一圈，出一身汗"},
  {n:"高榜山·挂榜阁",c:"park",tag:"登高",d:"登高看全城，挂榜阁夜景也好看",why:"爬上去，惠城全景在脚下"},
  {n:"东江湾公园",c:"park",tag:"江景",d:"东江边，散步放风筝，看江北天际线",why:"免费的江景客厅"},
  {n:"江北华贸/佳兆业",c:"food",tag:"商圈",d:"惠城最旺的商圈，餐厅排队，周末带娃逛街",why:"商圈活，服务业才活"},
  {n:"南坛·下埔老街",c:"food",tag:"老味道",d:"老城小吃、客家菜、宵夜摊，本地人的饭堂",why:"要吃地道的，来老城"},
  {n:"客家老味道",c:"food",tag:"必吃",d:"盐焗鸡、梅菜扣肉、东江酿豆腐、艾粄、阿嬷叫",why:"东江菜系，来都要试"},
  {n:"江北CBD",c:"shop",tag:"商圈",d:"金融商业中心，写字楼+商场+酒店，惠城最现代一面",why:"下班和周末的人潮"},
  {n:"下埔滨江",c:"shop",tag:"沿江",d:"沿江路，散步、咖啡、小店",why:"傍晚沿着江走"}
];

function render(cat){
  const list=cat==="all"?SPOTS:SPOTS.filter(x=>x.c===cat);
  document.getElementById("grid").innerHTML=list.map(x=>`
    <div class="card">
      <span class="n">${x.n}</span><span class="tag">${x.tag}</span>
      <div class="d">${x.d}</div>
      <div class="why">→ ${x.why}</div>
    </div>`).join("");
}
render("all");
document.querySelectorAll("#tabs button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    render(b.dataset.c);
  };
});
</script>
</body></html>
