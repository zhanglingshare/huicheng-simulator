<script>
const SPOTS=[
  {n:"野岛文化生活社区",c:"cafe",tag:"发呆",d:"旧工厂改的文创园，咖啡、书店、展览、小馆子，惠城年轻人的据点",why:"下午坐一下午，比逛商场舒服",watch:"年轻人愿不愿意留下来"},
  {n:"桥东江边",c:"cafe",tag:"咖啡",d:"江边老巷，一排咖啡馆小酒馆，傍晚坐外面吹风",why:"惠城的小鼓浪屿",watch:"老城有没有活过来"},
  {n:"江北华贸天地",c:"shop",tag:"逛街",d:"惠城最顶的商场，餐厅、影院、超市，周末约会标配",why:"周末不知道去哪，去华贸准没错",watch:"江北服务业客流旺不旺"},
  {n:"佳兆业中心",c:"shop",tag:"逛街",d:"江北商圈，品牌餐饮+商场，下班顺路逛",why:"白领下班的第二站",watch:"CBD下班有没有留得住人"},
  {n:"隆生广场/丽日",c:"shop",tag:"老商圈",d:"老城熟客常去，本地生活气重",why:"本地人真逛的商场",watch:"老城商业有没有空心化"},
  {n:"水东街",c:"night",tag:"夜生活",d:"骑楼老街晚上亮灯，清吧、小吃、夜市，年轻人聚集地",why:"要热闹，来水东街",watch:"夜经济和年轻人流"},
  {n:"东江夜游/江边",c:"night",tag:"散步",d:"晚饭后滨江路走一圈，吹江风",why:"不用花钱，最舒服的晚上",watch:"免费公共空间的人气"},
  {n:"市博物馆/科技馆",c:"kid",tag:"带娃",d:"免费，孩子能看一天，下雨天首选",why:"遛娃不费妈",watch:"家庭留存的公共配套"},
  {n:"市民乐园/江北体育馆",c:"kid",tag:"遛娃",d:"大草坪放风筝、跑步、打球",why:"周末放电",watch:"学龄家庭周末活跃度"},
  {n:"惠州文化艺术中心",c:"show",tag:"演出",d:"音乐会、话剧、小型演出，江北",why:"周末看一场，比吃饭洋气",watch:"中产文化消费浓度"},
  {n:"野岛文创展",c:"show",tag:"看展",d:"旧工厂文创园轮换展览，咖啡+看展半天",why:"免费的文化生活",watch:"年轻人口袋愿不愿为文化买单"},
  {n:"红花湖骑行",c:"sport",tag:"运动",d:"18公里环湖绿道，租车一圈，周末出汗",why:"比健身房爽",watch:"城市周末活力和生态承载力"},
  {n:"滨江绿道跑步",c:"sport",tag:"运动",d:"东江边夜跑/晨跑，看江北天际线",why:"城市人最日常的运动",watch:"通勤之外的居住吸引力"},
  {n:"客家老味道",c:"food",tag:"觅食",d:"盐焗鸡、梅菜扣肉、酿豆腐、艾粄，南坛下埔老街小馆",why:"带朋友来就吃这个",watch:"本地消费是不是在本地循环"}
];

let picks=[];
const LOCAL_KW=["惠州","惠城","西湖","水东街","华贸","桥东","江北","滨江","红花湖","罗浮山","东莞","深圳"];
const TREND_KW=["电影","票房","AI","人工智能","大模型","芯片","手机","新能源汽车","书","小说","诺贝尔","演唱会","展览","话剧","音乐会","世界杯","奥运","科技"];

function render(cat){
  const list=cat==="all"?SPOTS:SPOTS.filter(x=>x.c===cat);
  const grads={cafe:"linear-gradient(135deg,#7c2d12,#1a0f0f)",shop:"linear-gradient(135deg,#1e3a8a,#0f1a2e)",night:"linear-gradient(135deg,#78350f,#1a1206)",kid:"linear-gradient(135deg,#065f46,#022c22)",sport:"linear-gradient(135deg,#155e75,#082f3a)",show:"linear-gradient(135deg,#6b21a8,#1e1033)",food:"linear-gradient(135deg,#7f1d1d,#1a0f0f)"};
  const emos={cafe:"☕",shop:"🛍️",night:"🍻",kid:"👨‍👩‍👧",sport:"🏃",show:"🎭",food:"🍜"};
  document.getElementById("grid").style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px";
  document.getElementById("grid").innerHTML=list.map(x=>{
    const likes=(localStorage.getItem("like_spot_"+x.n)||Math.floor(Math.random()*800+100));
    return `<div style="background:${grads[x.c]};border-radius:12px;padding:14px;cursor:pointer" onclick="this.querySelector('.d').style.display=this.querySelector('.d').style.display==='none'?'block':'none'">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div style="font-size:22px">${emos[x.c]||"📍"}</div>
        <span onclick="event.stopPropagation();likeSpot(this,'${x.n}')" style="font-size:12px;color:#fff;opacity:.8">👍 <b>${likes}</b></span>
      </div>
      <div style="font-size:15px;font-weight:800;color:#fff;margin:6px 0 4px">${x.n}</div>
      <div style="font-size:11px;color:#94a3b8">${x.tag}</div>
      <div class="d" style="font-size:11.5px;color:#cbd5e1;margin-top:8px;display:none">${x.d}<br><span style="color:#fbbf24">→ ${x.why}</span><br><span style="color:#60a5fa">📊 风洞看：${x.watch}</span></div>
    </div>`;
  }).join("");
}
function likeSpot(el,t){
  let n=parseInt(el.querySelector("b").textContent)+1;
  el.querySelector("b").textContent=n;
  localStorage.setItem("like_spot_"+t,n);
  el.style.transform="scale(1.2)";setTimeout(()=>el.style.transform="",200);
}
render("all");
document.querySelectorAll("#tabs button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    render(b.dataset.c);
  };
});

async function fetchLive(){
  const local=[];
  const apis=[
    {url:"https://api.vvhan.com/api/hotlist/wbHot",name:"微博"},
    {url:"https://api.vvhan.com/api/hotlist/baiduRD",name:"百度"},
    {url:"https://api.vvhan.com/api/hotlist/zhihuHot",name:"知乎"},
    {url:"https://api.vvhan.com/api/hotlist/douyinHot",name:"抖音"},
    {url:"https://api.vvhan.com/api/hotlist/toutiao",name:"头条"},
    {url:"https://api.vvhan.com/api/hotlist/bili",name:"B站"},
    {url:"https://api.vvhan.com/api/hotlist/weixin",name:"微信"},
    {url:"https://api.vvhan.com/api/hotlist/thepaper",name:"澎湃"},
    {url:"https://api.vvhan.com/api/hotlist/people",name:"人民"},
    {url:"https://api.vvhan.com/api/hotlist/wangyi",name:"网易"},
    {url:"https://api.vvhan.com/api/hotlist/sina",name:"新浪"},
    {url:"https://api.vvhan.com/api/hotlist/huanqiu",name:"环球"}
  ];
  for(const api of apis){
    try{
      const r=await fetch(api.url);const j=await r.json();
      if(j.data&&Array.isArray(j.data)){
        j.data.forEach((it)=>{
          const title=it.title||it.word||"";
          if(LOCAL_KW.some(k=>title.includes(k))&&local.length<6){
            local.push(`<b>${api.name}</b>·${title}`);
          }
        });
      }
    }catch(e){}
  }
  // 三个专门榜
  async function grab(url,limit){
    try{
      const r=await fetch(url);const j=await r.json();
      if(j.data&&Array.isArray(j.data))return j.data.slice(0,limit).map(x=>x.title||x.word||"");
    }catch(e){}
    return [];
  }
  let movie=await grab("https://api.vvhan.com/api/hotlist/doubanMovie",6);
  let book=await grab("https://api.vvhan.com/api/hotlist/doubanBook",6);
  let tech=await grab("https://api.vvhan.com/api/hotlist/ithome",6);
  if(!movie.length)movie=["《南京照相馆》","《长安的荔枝》","《罗小黑战记2》","《乘风破浪》新片","《雄狮少年》续","周末新片速递"];
  if(!tech.length)tech=["AI大模型又更新","国产芯片新进展","新手机发布","新能源车降价","鸿蒙新功能","自动驾驶新政策"];
  return {local,movie,book,tech};
}

async function refresh(){
  document.getElementById("btnScan").textContent="⏳ 扫描中…";
  document.getElementById("scanline").style.animation="spin .8s linear infinite";
  const {local,movie,book,tech}=await fetchLive();
  const arr=[...SPOTS];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  picks=arr.slice(0,3).map(t=>t.n);
  render(document.querySelector("#tabs button.on").dataset.c);
  document.getElementById("btnScan").textContent="🔄 换一换";
  document.getElementById("scanline").style.animation="";
  const now=new Date();
  document.getElementById("scanInfo").textContent=`上次扫描：${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} · 本地${local.length}条`;
  const bar=document.getElementById("livebar");
  bar.innerHTML=local.length
    ?"📡 全网12源此刻在聊惠城："+local.join("　｜　")
    :"📡 全网12源暂时没刷到本地词条——但惠城的周末，不用上热搜也值得去。";
  const paint=(id,arr,miss,c1)=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.innerHTML=arr.length
      ? arr.map((t,i)=>`<div style="flex:none;width:130px;background:${c1};border-radius:10px;padding:12px;font-size:12.5px;color:#fff;line-height:1.5">
          <div style="font-size:10px;opacity:.7;margin-bottom:4px">No.${i+1}</div>${t}
        </div>`).join("")
      : `<div style="color:#5b6b82;font-size:12px;padding:8px">${miss}</div>`;
  };
  paint("movieList",movie,"正在拉热映…","linear-gradient(135deg,#9d174d,#4c0519)");
  paint("techList",tech,"正在拉科技…","linear-gradient(135deg,#065f46,#022c22)");
}
function lucky(){
  const x=SPOTS[Math.floor(Math.random()*SPOTS.length)];
  const emos={cafe:"☕",shop:"🛍️",night:"🍻",kid:"👨‍👩‍👧",sport:"🏃",show:"🎭",food:"🍜"};
  document.getElementById("luckyResult").innerHTML=`<div style="font-size:28px">${emos[x.c]||"📍"}</div><b style="color:#fdba74">${x.n}</b><div style="font-size:12.5px;color:#cbd5e1;margin-top:6px">${x.why}</div>`;
}
refresh();
document.getElementById("btnScan").onclick=refresh;
</script>
