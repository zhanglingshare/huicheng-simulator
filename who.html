<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='slateblue'/><circle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2.5'/><circle cx='16' cy='16' r='2' fill='white'/></svg>">
<title>惠城产业风洞 · 城市体检</title>
<style>
:root{
  --sky1:#0b1026; --sky2:#1e1b4b; --sky3:#141a35;
  --glass:rgba(255,255,255,.07); --glass-b:rgba(255,255,255,.14);
  --ink:#f1f5f9; --ink2:#cbd5e1; --muted:#94a3b8;
  --neon:#38bdf8; --warm:#fbbf24; --ok:#34d399; --bad:#fb7185; --pink:#f472b6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--sky1);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;position:relative}

/* ===== 背景：黄昏城市生命体 ===== */
.scene{position:fixed;inset:0;z-index:0}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#070b1c 0%,#14103a 32%,#3b1d6e 52%,#6d28d9 68%,#9a3412 82%,#c2410c 92%,#f59e0b 100%);opacity:.95}
.sun{position:absolute;left:57%;top:3%;width:185px;height:185px;border-radius:50%;background:radial-gradient(circle,#fde68a,#f59e0b 55%,transparent 70%);filter:blur(16px);opacity:.62}
.stars{position:absolute;inset:0 0 42% 0}
.stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.mt{position:absolute;left:0;right:0;bottom:18%;height:100px;background:linear-gradient(180deg,transparent,#191a4d);clip-path:polygon(0 100%,8% 50%,18% 74%,28% 36%,40% 68%,52% 28%,64% 62%,76% 40%,88% 66%,100% 46%,100% 100%)}
.skyline{position:absolute;left:0;right:0;bottom:14%;height:150px;display:flex;align-items:flex-end;gap:3px;padding:0 18px}
.skyline .b{flex:1;background:linear-gradient(180deg,#26214f,#101024);border-radius:2px 2px 0 0;position:relative}
.skyline .b::after{content:"";position:absolute;inset:6px 3px 3px;background-image:radial-gradient(circle,#f59e0b 1px,transparent 1.5px);background-size:9px 12px;opacity:.55}
.road{position:absolute;left:0;right:0;bottom:0;height:14%;background:linear-gradient(180deg,#141039,#050510);border-top:1px solid rgba(255,255,255,.07)}
.road::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,#f59e0b 0 30px,transparent 30px 62px);opacity:.4}
.car{position:absolute;top:40%;width:9px;height:4px;border-radius:2px;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:drive 7s linear infinite}
.car.r{background:var(--pink);box-shadow:0 0 8px var(--pink);animation-duration:9s;animation-delay:-3s;top:58%}
.car.g{background:var(--ok);box-shadow:0 0 8px var(--ok);animation-duration:6s;animation-delay:-5s;top:30%}
@keyframes drive{from{left:-5%}to{left:105%}}
/* 压暗遮罩，保证前景可读 */
.veil{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(7,10,24,.1) 0%,rgba(7,10,24,.34) 42%,rgba(7,10,24,.62) 100%);pointer-events:none}

/* ===== HUD ===== */
.hud{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;padding:10px 12px}
.top{display:flex;align-items:center;gap:10px;flex:none}
.round{width:36px;height:36px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-b);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);text-decoration:none;font-size:18px;flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px}
.ttl span{font-size:11px;color:var(--muted);display:block;line-height:1.3}
.lab-btn{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink2);
  padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;flex:none;white-space:nowrap}
.lab-btn:hover{background:var(--glass-b);color:#fff}

/* ===== 主区域（可滚动） ===== */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;margin-top:9px;overflow-y:auto;padding-right:2px}
.main::-webkit-scrollbar{width:4px}.main::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:2px}

/* 生命体征总览：心脏 + 心电图 + 结论 */
.vitals{display:flex;gap:11px;flex:none}
.heart-box{flex:none;width:128px;border:1px solid var(--glass-b);border-radius:14px;
  background:radial-gradient(circle at 50% 45%,rgba(251,113,133,.18),rgba(8,12,28,.32));
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.heart{width:64px;height:64px;color:#fb7185;filter:drop-shadow(0 0 14px rgba(251,113,133,.6));
  transform-origin:center;animation:beat 1.25s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(1)}42%{transform:scale(1.08)}70%{transform:scale(1)}}
.heart-box .hb{font-size:10.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.heart-box .hb b{color:#fb7185;font-size:13px}
.ecg-box{flex:1;min-width:0;border:1px solid var(--glass-b);border-radius:14px;
  background:rgba(8,12,28,.32);padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.ecg-box .et{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px}
.ecg-box .et b{color:var(--neon)}
.ecg{width:100%;height:52px}
.ecg path{fill:none;stroke:var(--neon);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 5px rgba(56,189,248,.7))}
.ecg .glow{fill:none;stroke:var(--neon);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 5px rgba(56,189,248,.7));
  stroke-dasharray:72 720;animation:ecg 2.8s linear infinite}
@keyframes ecg{to{stroke-dashoffset:-792}}
.ecg .grid{stroke:rgba(148,163,184,.12);stroke-width:1}
.ecg .base{fill:none;stroke:rgba(56,189,248,.32);stroke-width:1.6}

/* 体检结论 */
.verdict{flex:none;border:1px solid var(--glass-b);border-radius:13px;padding:10px 14px;
  background:linear-gradient(135deg,rgba(251,191,36,.09),rgba(8,12,28,.4));font-size:12.5px;line-height:1.7;color:var(--ink2)}
.verdict b{color:var(--warm)}
.verdict .bad{color:var(--bad);font-weight:700}

/* ===== 器官系统卡片 ===== */
.organs{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:9px;flex:1;min-height:290px}
.organ{border:1px solid var(--glass-b);border-radius:13px;background:var(--glass);
  padding:11px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;
  display:flex;flex-direction:column}
.organ:hover{background:var(--glass-b)}
.organ .otop{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.organ .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.organ .ico svg{width:18px;height:18px}
.organ .nm{font-size:12px;font-weight:700;color:var(--ink2);line-height:1.2}
.organ .sys{font-size:9.5px;color:var(--muted)}
.organ .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.organ .tg{font-size:9.5px;color:var(--muted);margin-top:2px}
.bar-wrap{height:5px;background:rgba(148,163,184,.15);border-radius:3px;margin-top:auto;margin-bottom:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.stat{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%}
.stat.green{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.stat.yellow{background:var(--warm);box-shadow:0 0 8px var(--warm);animation:breathe 2s ease-in-out infinite}
.stat.red{background:var(--bad);box-shadow:0 0 9px var(--bad);animation:alarm 1s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes alarm{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.organ.focus{border-color:var(--neon);box-shadow:0 0 16px rgba(56,189,248,.35);background:rgba(56,189,248,.1)}

/* ===== 器官详情浮层 ===== */
.detail{position:fixed;left:8px;right:8px;bottom:0;z-index:44;max-height:62vh;
  background:linear-gradient(180deg,#141a38,#0b1026);border:1px solid var(--glass-b);border-bottom:0;
  border-radius:18px 18px 0 0;transform:translateY(104%);transition:transform .32s cubic-bezier(.2,.8,.3,1);
  padding:13px 16px 20px;overflow-y:auto}
.detail.open{transform:translateY(0)}
.dmask{position:fixed;inset:0;background:rgba(2,6,16,.5);z-index:43;opacity:0;pointer-events:none;transition:.3s}
.dmask.open{opacity:1;pointer-events:auto}
.detail h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.detail .dx{margin-left:auto;background:var(--glass);border:1px solid var(--glass-b);color:var(--ink2);
  width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px}
.drow{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(148,163,184,.1);font-size:12.5px}
.drow .k{color:var(--muted)}
.drow .z{font-weight:700;font-variant-numeric:tabular-nums}
.dnote{font-size:11.5px;color:var(--ink2);line-height:1.8;margin-top:10px}

/* ===== 底部步骤 ===== */
.stepnav{display:flex;gap:8px;flex:none;margin-top:2px}
.stepnav a{flex:1;text-align:center;padding:9px;border-radius:10px;text-decoration:none;font-size:12px;font-weight:600;
  background:var(--glass);border:1px solid var(--glass-b);color:var(--ink2)}
.stepnav a.primary{background:linear-gradient(135deg,#38bdf8,#6366f1);border-color:transparent;color:#fff}

/* ===== 实验室抽屉 ===== */
.mask{position:fixed;inset:0;background:rgba(2,6,16,.62);z-index:40;opacity:0;pointer-events:none;transition:.3s}
.mask.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:8px;right:8px;bottom:0;z-index:41;
  background:linear-gradient(180deg,#141a38,#0b1026);border:1px solid var(--glass-b);border-bottom:0;
  border-radius:18px 18px 0 0;max-height:84vh;transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.3,1);
  padding:14px 16px 22px;overflow-y:auto}
.drawer.open{transform:translateY(0)}
.drag-bar{width:40px;height:4px;border-radius:2px;background:var(--glass-b);margin:0 auto 12px}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dh b{font-size:15px;font-weight:800}
.dh .dx{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink2);width:30px;height:30px;
  border-radius:8px;cursor:pointer;font-size:15px}
.dsec{background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:12px;margin-bottom:11px}
.dsec h3{margin:0 0 9px;font-size:12.5px;color:var(--muted);font-weight:700}
.growth{width:100%;height:auto}
.growth .bar{rx:3}
.dtip{font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:8px}

/* ===== 响应式 ===== */
@media(max-width:600px){
  .hud{padding:8px 10px}
  .ttl h1{font-size:15px}.ttl span{font-size:10.5px}
  .lab-btn{padding:7px 11px;font-size:11.5px}
  .heart-box{width:104px}
  .heart{width:52px;height:52px}
  .organs{grid-template-columns:repeat(2,1fr);min-height:250px}
  .organ .v{font-size:17px}
}
@media(min-width:601px) and (max-width:767px){
  .heart-box{width:140px}
  .heart{width:68px;height:68px}
  .organ{padding:13px}
  .organ .v{font-size:20px}
}
@media(min-width:768px){
  .main{flex-direction:row;gap:13px}
  .left-col{flex:none;width:33%;display:flex;flex-direction:column;gap:10px;min-width:0}
  .vitals{flex:1;flex-direction:column;min-height:0}
  .heart-box{width:100%;flex:1}
  .heart{width:70px;height:70px}
  .ecg-box{flex:1.3;min-height:0}
  .ecg{flex:1;height:auto;min-height:64px}
  .organs{flex:1;grid-template-columns:repeat(2,1fr);min-height:0}
  .organ{padding:13px}
  .organ .v{font-size:20px}
  .organ .ico{width:32px;height:32px}
  .organ .ico svg{width:20px;height:20px}
  .organ .nm{font-size:12.5px}
}
@media(max-width:380px){.organs{grid-template-columns:1fr}}
@media(max-height:640px){.ttl span{display:none}}
</style></head>
<body>

<div class="scene">
  <div class="sky"></div>
  <div class="stars" id="stars"></div>
  <div class="sun"></div>
  <div class="mt"></div>
  <div class="skyline" id="skyline"></div>
  <div class="road"><div class="car"></div><div class="car r"></div><div class="car g"></div></div>
</div>
<div class="veil"></div>

<div class="hud">
  <div class="top">
    <a class="round" href="index.html" aria-label="返回沙盘">←</a>
    <div class="ttl">
      <h1>城市体检</h1>
      <span>给惠城做一次全身检查，看哪里健康、哪里要注意</span>
    </div>
    <button class="lab-btn" onclick="openLab()">实验室</button>
  </div>

  <div class="main">
    <div class="left-col">
      <!-- 生命体征总览 -->
      <div class="vitals">
        <div class="heart-box">
          <svg class="heart" viewBox="0 0 32 32" fill="currentColor">
            <path d="M16 28.5C5.5 20.5 2 15 4.5 9.5 6.5 5 11.5 5 16 10.5 20.5 5 25.5 5 27.5 9.5 30 15 26.5 20.5 16 28.5Z"/>
          </svg>
          <div class="hb">产业心脏 <b id="hbBpm">72</b> 次/分</div>
        </div>
        <div class="ecg-box">
          <div class="et"><span>城市生命体征 · 实时</span><b>窦性节律</b></div>
          <svg class="ecg" viewBox="0 0 300 52" preserveAspectRatio="none">
            <line class="grid" x1="0" y1="13" x2="300" y2="13"/>
            <line class="grid" x1="0" y1="39" x2="300" y2="39"/>
            <path class="base" d="M0 26 L20 26 L24 10 L32 42 L38 18 L44 26 L70 26 L74 10 L82 42 L88 18 L94 26 L120 26 L124 10 L132 42 L138 18 L144 26 L170 26 L174 10 L182 42 L188 18 L194 26 L220 26 L224 10 L232 42 L238 18 L244 26 L270 26 L274 10 L282 42 L288 18 L294 26 L300 26"/>
            <path class="glow" d="M0 26 L20 26 L24 10 L32 42 L38 18 L44 26 L70 26 L74 10 L82 42 L88 18 L94 26 L120 26 L124 10 L132 42 L138 18 L144 26 L170 26 L174 10 L182 42 L188 18 L194 26 L220 26 L224 10 L232 42 L238 18 L244 26 L270 26 L274 10 L282 42 L288 18 L294 26 L300 26"/>
          </svg>
        </div>
      </div>

      <!-- 体检结论 -->
      <div class="verdict" id="verdict"></div>
    </div>

    <!-- 器官系统 -->
    <div class="organs" id="organs"></div>
  </div>

  <div class="stepnav">
    <a href="network.html">← 建构世界</a>
    <a class="primary" href="choices.html">下一步：有哪些选择 →</a>
  </div>
</div>

<!-- 器官详情 -->
<div class="dmask" id="dmask" onclick="closeDetail()"></div>
<div class="detail" id="detail"></div>

<!-- 实验室抽屉 -->
<div class="mask" id="mask" onclick="closeLab()"></div>
<aside class="drawer" id="drawer">
  <div class="drag-bar"></div>
  <div class="dh"><b>实验室</b><button class="dx" onclick="closeLab()">×</button></div>

  <div class="dsec">
    <h3>园区工业产值 · 生长曲线</h3>
    <svg class="growth" viewBox="0 0 700 180" id="growth"></svg>
    <div class="dtip">高新区园区口径；2026 及以后为规划目标值，非统计定数。</div>
  </div>

  <div class="dsec">
    <h3>数据来源与口径</h3>
    <div class="dtip" style="line-height:1.9">
      数据来源：惠城区2025年国民经济和社会发展统计公报、2025年计划执行情况与2026年计划草案报告。<br>
      GDP、增加值、增速等为初步核算（快报）数，2026年统计公报发布后部分数字可能微调。<br>
      本页为「2025年实际」对照「2026年目标」。
    </div>
  </div>
</aside>

<script>
// ===== 生成黄昏城市：星星与天际线 =====
(function(){
  var st=document.getElementById("stars");
  for(var i=0;i<42;i++){var s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=(Math.random()*3)+"s";st.appendChild(s)}
  var sk=document.getElementById("skyline"),hs=[70,110,88,140,100,155,85,125,145,92,130,110,150,88,120,140,100,150,120,85];
  hs.forEach(function(h){var b=document.createElement("div");b.className="b";b.style.height=h+"px";sk.appendChild(b)});
})();
// ===== 器官图标（stroke 风格） =====
var ICONS={
  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  lungs:'<path d="M12 2v10"/><path d="M12 12c0-3-2-5-5-5S3 9 3 13s2 6 4 6 4-1 4-3"/><path d="M12 12c0-3 2-5 5-5s4 2 4 6-2 6-4 6-4-1-4-3"/>',
  droplet:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7Z"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  thermometer:'<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>'
};
function iconSvg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>';}

// ===== 器官系统（2025 实际 vs 2026 目标） =====
var ORGANS=[
  {id:"ind",name:"产业心脏",sub:"工业生产",ico:"heart",ic:"#fb7185",v:"+10.8%",tg:"2026目标 +9%",status:"green",ratio:1,
    rows:[["规上工业增加值","+10.8%"],["规上工业总产值","937.92亿"],["规上工业企业","563家"],["利润总额","42.51亿 (+49.7%)"],["先进制造业占比","50.3%"]],
    note:"产业心脏跳得有力，工业增加值、利润都在涨，是这座城目前最强的引擎。"},
  {id:"consume",name:"消费与人口",sub:"市场呼吸",ico:"lungs",ic:"#38bdf8",v:"+3.7%",tg:"2026目标 +6%",status:"yellow",ratio:.62,
    rows:[["社消零增速","+3.7%"],["社消零总量","805.68亿"],["常住人口","159.78万"],["城镇化率","85.74%"],["人均可支配收入","63776元 (+4.5%)"]],
    note:"消费在稳步呼吸，但增速低于目标，还有提升空间。"},
  {id:"invest",name:"投资血管",sub:"固定资产投资",ico:"droplet",ic:"#fb7185",v:"-37.1%",tg:"2026目标 +1%",status:"red",ratio:.08,
    rows:[["固定资产投资","-37.1%"],["工业投资","-34.4%"],["基础设施投资","-20.0%"],["房地产开发投资","-47.3%"],["重点项目完成投资","162.2亿 (115.4%)"]],
    note:"投资血管收缩明显，是体检中最需要关注的一项；好在重点项目投资超额完成。"},

// ===== 渲染器官 =====
var organsEl=document.getElementById("organs");
function renderOrgans(){
  var h="";
  ORGANS.forEach(function(o){
    h+='<div class="organ" data-id="'+o.id+'"><span class="stat '+o.status+'"></span>'
      +'<div class="otop"><span class="ico" style="background:'+o.ic+'22;color:'+o.ic+'">'+iconSvg(o.ico)+'</span>'
      +'<div><div class="nm">'+o.name+'</div><div class="sys">'+o.sub+'</div></div></div>'
      +'<div class="bar-wrap"><div class="bar-fill" style="width:'+Math.round(o.ratio*100)+'%;background:'+o.ic+'"></div></div>'
      +'<div class="v" style="color:'+o.ic+'">'+o.v+'</div><div class="tg">'+o.tg+'</div></div>';
  });
  organsEl.innerHTML=h;
  organsEl.querySelectorAll(".organ").forEach(function(el){
    el.onclick=function(){openDetail(el.getAttribute("data-id"));};
  });
}
renderOrgans();

// ===== 器官详情 =====
var detailEl=document.getElementById("detail"),dmaskEl=document.getElementById("dmask");
function openDetail(id){
  var o=ORGANS.find(function(x){return x.id===id;});
  var rows=o.rows.map(function(r){return '<div class="drow"><span class="k">'+r[0]+'</span><span class="z">'+r[1]+'</span></div>';}).join("");
  detailEl.innerHTML='<h2><span style="background:'+o.ic+'22;color:'+o.ic+';width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center">'+iconSvg(o.ico)+'</span>'
    +o.name+'<button class="dx" onclick="closeDetail()">×</button></h2>'+rows+'<div class="dnote">'+o.note+'</div>';
  detailEl.classList.add("open");dmaskEl.classList.add("open");
}
function closeDetail(){detailEl.classList.remove("open");dmaskEl.classList.remove("open");}

// ===== 园区产值生长曲线 =====
function renderGrowth(){
  var data=[{y:632.7,l:"2025",c:"#3b82f6"},{y:820,l:"2026目标",c:"#38bdf8"},{y:1000,l:"2027",c:"#fbbf24"},{y:1500,l:"2030目标",c:"#fb7185"}];
  var max=1500,base=140,xs=[120,280,440,600],h0='<line x1="80" y1="140" x2="650" y2="140" stroke="rgba(148,163,184,.2)" stroke-width="2"/>';
  data.forEach(function(d,i){
    var h=d.y/max*120;
    h0+='<rect x="'+(xs[i]-25)+'" y="'+(base-h)+'" width="50" height="'+h+'" fill="'+d.c+'" opacity=".85" rx="3"/>'
      +'<text x="'+xs[i]+'" y="'+(base-h-8)+'" text-anchor="middle" font-size="12" font-weight="700" fill="'+d.c+'">'+d.y+'亿</text>'
      +'<text x="'+xs[i]+'" y="158" text-anchor="middle" font-size="10" fill="#94a3b8">'+d.l+'</text>';
  });
  document.getElementById("growth").innerHTML=h0;
}
renderGrowth();

// ===== 实验室抽屉 =====
var drawerEl=document.getElementById("drawer"),maskEl=document.getElementById("mask");
function openLab(){drawerEl.classList.add("open");maskEl.classList.add("open");}
function closeLab(){drawerEl.classList.remove("open");maskEl.classList.remove("open");}

// ESC 关闭
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeDetail();closeLab();}});
