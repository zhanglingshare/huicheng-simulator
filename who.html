<div class="wrap">
  <h1>2025年成绩单：哪些完成了，哪些没完成</h1>
  <p class="sub">年初定了目标，年底对账。只摆数。</p>

  <!-- 大数字 -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px">
    <div class="card" style="text-align:center;margin:0">
      <div class="bignum">1203亿</div>
      <div class="label">GDP（+4.3%）</div>
    </div>
    <div class="card" style="text-align:center;margin:0">
      <div class="bignum">973.9亿</div>
      <div class="label">规上工业总产值（+9.6%）</div>
    </div>
    <div class="card" style="text-align:center;margin:0">
      <div class="bignum">159.78万</div>
      <div class="label">常住人口</div>
    </div>
  </div>

  <!-- 目标完成度 -->
  <div class="card">
    <h2>2025年目标完成情况</h2>
    <svg viewBox="0 0 700 280">
      <!-- GDP增速 -->
      <text x="0" y="25" font-size="11" fill="#cbd5e1">GDP增速</text>
      <rect x="120" y="15" width="120" height="16" fill="#3b82f6" rx="2" opacity="0.3"/>
      <rect x="120" y="15" width="86" height="16" fill="#3b82f6" rx="2"/>
      <text x="250" y="27" font-size="11" fill="#fbbf24">目标6% → 实际4.3%（差1.7pt）</text>

      <!-- 规上工业增加值 -->
      <text x="0" y="60" font-size="11" fill="#cbd5e1">规上工业增加值</text>
      <rect x="120" y="50" width="120" height="16" fill="#34d399" rx="2" opacity="0.3"/>
      <rect x="120" y="50" width="144" height="16" fill="#34d399" rx="2"/>
      <text x="270" y="62" font-size="11" fill="#34d399">目标9% → 实际10.8%（超了）</text>

      <!-- 固定资产投资 -->
      <text x="0" y="95" font-size="11" fill="#f87171">固定资产投资</text>
      <rect x="120" y="85" width="120" height="16" fill="#f87171" rx="2" opacity="0.3"/>
      <rect x="120" y="85" width="0" height="16" fill="#f87171" rx="2"/>
      <text x="270" y="97" font-size="11" fill="#f87171">目标+1% → 实际-37.1%（严重未完成）</text>

      <!-- 社消零 -->
      <text x="0" y="130" font-size="11" fill="#cbd5e1">社消零</text>
      <rect x="120" y="120" width="120" height="16" fill="#fbbf24" rx="2" opacity="0.3"/>
      <rect x="120" y="120" width="74" height="16" fill="#fbbf24" rx="2"/>
      <text x="250" y="132" font-size="11" fill="#fbbf24">目标6% → 实际3.7%（差2.3pt）</text>

      <!-- 一般公共预算收入 -->
      <text x="0" y="165" font-size="11" fill="#cbd5e1">一般公共预算收入</text>
      <rect x="120" y="155" width="60" height="16" fill="#34d399" rx="2" opacity="0.3"/>
      <rect x="120" y="155" width="210" height="16" fill="#34d399" rx="2"/>
      <text x="340" y="167" font-size="11" fill="#34d399">目标1% → 实际3.5%（64.6亿，超了）</text>

      <!-- 外贸进出口 -->
      <text x="0" y="200" font-size="11" fill="#cbd5e1">外贸进出口</text>
      <rect x="120" y="190" width="60" height="16" fill="#fbbf24" rx="2" opacity="0.3"/>
      <rect x="120" y="190" width="142" height="16" fill="#fbbf24" rx="2"/>
      <text x="270" y="202" font-size="11" fill="#fbbf24">目标3% → 实际7.1%（383.6亿，出口+17.6%）</text>

      <!-- 城镇新增就业 -->
      <text x="0" y="235" font-size="11" fill="#cbd5e1">城镇新增就业</text>
      <rect x="120" y="225" width="150" height="16" fill="#34d399" rx="2" opacity="0.3"/>
      <rect x="120" y="225" width="162" height="16" fill="#34d399" rx="2"/>
      <text x="290" y="237" font-size="11" fill="#34d399">目标1.5万 → 实际16221人（完成）</text>

      <text x="0" y="265" font-size="10" fill="#5b6b82">数据来源：惠城区2025统计公报、2026计划执行报告</text>
    </svg>
  </div>

  <!-- 高新区爬坡 -->
  <div class="card">
    <h2>高新区产值爬坡</h2>
    <svg viewBox="0 0 700 180">
      <line x1="80" y1="140" x2="650" y2="140" stroke="#1c2739" stroke-width="2"/>
      <circle cx="120" cy="140" r="5" fill="#3b82f6"/>
      <rect x="95" y="80" width="50" height="60" fill="#3b82f6" opacity="0.7" rx="3"/>
      <text x="120" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#3b82f6">632.7亿</text>
      <text x="120" y="158" text-anchor="middle" font-size="10" fill="#8fa3bf">2025</text>

      <circle cx="280" cy="140" r="5" fill="#3b82f6"/>
      <rect x="255" y="55" width="50" height="85" fill="#3b82f6" opacity="0.7" rx="3"/>
      <text x="280" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="#3b82f6">820亿</text>
      <text x="280" y="158" text-anchor="middle" font-size="10" fill="#8fa3bf">2026目标</text>

      <circle cx="440" cy="140" r="5" fill="#fbbf24"/>
      <rect x="415" y="35" width="50" height="105" fill="#fbbf24" opacity="0.5" rx="3"/>
      <text x="440" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">1000亿</text>

      <circle cx="600" cy="140" r="5" fill="#f87171"/>
      <rect x="575" y="5" width="50" height="135" fill="#f87171" opacity="0.4" rx="3"/>
      <text x="600" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#f87171">1500亿</text>
      <text x="600" y="158" text-anchor="middle" font-size="10" fill="#8fa3bf">2030目标</text>
    </svg>
  </div>

  <!-- 创新与企业 -->
  <div class="card">
    <h2>企业与创新</h2>
    <svg viewBox="0 0 700 160">
      <text x="0" y="25" font-size="11" fill="#cbd5e1">规上工业企业</text>
      <rect x="130" y="15" width="180" height="16" fill="#3b82f6" rx="2"/>

      <rect x="130" y="45" width="200" height="16" fill="#3b82f6" rx="2"/>
      <text x="340" y="57" font-size="11" fill="#fbbf24">584家（全区2024），2025预计619家</text>

      <rect x="130" y="75" width="60" height="16" fill="#3b82f6" rx="2"/>
      <text x="200" y="87" font-size="11" fill="#fbbf24">175家省级 + 8家小巨人</text>

      <rect x="130" y="105" width="86" height="16" fill="#f97316" rx="2"/>
      <text x="220" y="117" font-size="11" fill="#fbbf24">4.33%</text>

      <text x="0" y="145" font-size="11" fill="#cbd5e1">人均可支配收入</text>
      <rect x="130" y="135" width="120" height="16" fill="#6b7280" rx="2"/>
      <text x="260" y="147" font-size="11" fill="#8fa3bf">63776元</text>
    </svg>
  </div>

  <!-- 横向对比 -->
  <div class="card">
    <h2>惠城 vs 广东 vs 全国（2025）</h2>
    <svg viewBox="0 0 700 240">
      <!-- 人均GDP -->
      <text x="0" y="25" font-size="11" fill="#cbd5e1">人均GDP（万元）</text>
      <rect x="120" y="15" width="150" height="14" fill="#3b82f6" rx="2"/><text x="275" y="26" font-size="11" fill="#3b82f6">惠城 7.5</text>
      <rect x="120" y="35" width="227" height="14" fill="#6b7280" rx="2"/><text x="352" y="46" font-size="11" fill="#8fa3bf">广东 11.4</text>
      <rect x="120" y="55" width="199" height="14" fill="#6b7280" rx="2"/><text x="324" y="66" font-size="11" fill="#8fa3bf">全国 10.0</text>

      <!-- 三产占比 -->
      <text x="0" y="100" font-size="11" fill="#cbd5e1">二产占GDP</text>
      <rect x="120" y="90" width="83" height="14" fill="#3b82f6" rx="2"/><text x="208" y="101" font-size="11" fill="#3b82f6">惠城 27.6%</text>
      <rect x="120" y="110" width="113" height="14" fill="#6b7280" rx="2"/><text x="238" y="121" font-size="11" fill="#8fa3bf">广东 37.7%</text>

      <text x="0" y="145" font-size="11" fill="#cbd5e1">三产占GDP</text>
      <rect x="120" y="135" width="207" height="14" fill="#f97316" rx="2"/><text x="332" y="146" font-size="11" fill="#f97316">惠城 69.0%</text>
      <rect x="120" y="155" width="175" height="14" fill="#6b7280" rx="2"/><text x="300" y="166" font-size="11" fill="#8fa3bf">广东 58.3%</text>

      <!-- 几个比率 -->
      <text x="0" y="200" font-size="11" fill="#cbd5e1">税收/GDP</text>
      <rect x="120" y="190" width="24" height="14" fill="#f87171" rx="2"/><text x="150" y="201" font-size="11" fill="#f87171">3.0%（区县级，上缴后留存）</text>

      <text x="0" y="225" font-size="11" fill="#cbd5e1">非税占财政</text>
      <rect x="120" y="215" width="87" height="14" fill="#fbbf24" rx="2"/><text x="212" y="226" font-size="11" fill="#fbbf24">43.5%</text>

      <text x="400" y="200" font-size="11" fill="#cbd5e1">人均可支配收入</text>
      <text x="400" y="215" font-size="11" fill="#fbbf24">63776元</text>
      <text x="400" y="230" font-size="10" fill="#5b6b82">占人均GDP 84.7%</text>
    </svg>
  </div>
