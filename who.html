<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b82f6'/><circle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2.5'/></svg>">
<title>惠城产业风洞 · 基本面</title>
<style>
:root{
  --bg:#0a0a0e;
  --card:#16161e;
  --card2:#1d1d26;
  --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);
  --ink:#f5f5f7;
  --ink2:#a1a1ab;
  --muted:#6b6b76;
  --green:#34d399;
  --red:#fb7185;
  --gold:#e5c06a;
  --blue:#3b82f6;
  --cit:#f59e0b;
  --ind:#60a5fa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(59,130,246,.05),transparent 60%)}

/* ===== 布局 ===== */
.hud{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;padding:14px 18px;max-width:100vw;overflow-x:hidden}
.top{display:flex;align-items:center;gap:12px;flex:none}
.round{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);text-decoration:none;font-size:18px;flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.3px}
.ttl span{font-size:12px;color:var(--muted);display:block;line-height:1.4;margin-top:2px}
.lab-btn{background:var(--card);border:1px solid var(--line);color:var(--ink2);
  padding:9px 16px;border-radius:12px;font-size:12.5px;font-weight:600;cursor:pointer;flex:none}
.lab-btn:hover{background:var(--card2);color:#fff}

.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin-top:18px}
.main::-webkit-scrollbar{width:4px}.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* ===== 两本账切换 ===== */
.seg{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:4px;margin-bottom:20px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
  padding:9px 18px;border-radius:11px;cursor:pointer;transition:.2s;white-space:nowrap}
.seg button.on{background:var(--card2);color:#fff}

.qgroup-label{display:flex;align-items:center;gap:8px;margin:2px 2px 14px;font-size:12px;font-weight:600;color:var(--muted)}
.qgroup-label i{width:6px;height:6px;border-radius:50%}
.qgroup-label .who{font-weight:400}

/* ===== 问题卡 ===== */
.qlist{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.qcard{position:relative;width:100%;box-sizing:border-box;text-align:left;border:1px solid var(--line);
  background:var(--card);padding:16px 18px;cursor:pointer;transition:.2s;color:var(--ink);
  display:flex;align-items:center;gap:14px;font-family:inherit;border-radius:20px}
.qcard:hover{background:var(--card2)}
.qcard .qico{position:relative;flex:none;width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04)}
.qcard .qico svg{width:20px;height:20px}
.qcard .qbody{flex:1;min-width:0;overflow:hidden}
.qcard .qtxt{font-size:16px;font-weight:700;line-height:1.35}
.qcard .qhint{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.qcard .qarrow{flex:none;color:var(--muted);font-size:18px}
.qcard.done{opacity:.75}
.qcard .done-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;
  background:var(--green);border:2px solid var(--bg)}
.qcard .mystance{font-size:10.5px;font-weight:600;margin-left:6px}
.qcard .mystance.up{color:var(--green)}
.qcard .mystance.down{color:var(--red)}

.scroll-note{margin-top:18px;padding:16px;border:1px dashed var(--line2);border-radius:16px;
  font-size:12px;color:var(--muted);line-height:1.8;text-align:center}
.scroll-note b{color:var(--ink2);font-weight:600}

/* ===== 玩牌浮层 ===== */
.play{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
  background:var(--bg);padding:14px 18px;transform:translateY(102%);transition:transform .4s cubic-bezier(.2,.85,.3,1);
  max-width:100vw;overflow:hidden}
.play.open{transform:translateY(0)}
.play-head{flex:none;display:flex;align-items:center;gap:12px}
.play-head .pback{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  color:var(--ink2);font-size:18px;cursor:pointer;flex:none}
.play-head .ptag{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;flex:none;
  background:var(--card);color:var(--ink2);border:1px solid var(--line)}
.play-head .ptitle{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.4;color:var(--muted)}
.play-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px 0 10px}
.play-body::-webkit-scrollbar{width:4px}.play-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}

/* 上次判断回顾 */
.recall{display:none;margin-bottom:18px;padding:12px 16px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.recall.show{display:block}
.recall b{color:var(--ink)}

/* 押注 */
.bet-step{padding:10px 0 20px}
.bet-step .qbig{font-size:30px;font-weight:800;line-height:1.25;letter-spacing:-.3px;margin-bottom:8px}
.bet-step .lead{font-size:13px;color:var(--muted);margin-bottom:24px}
.bet-opts{display:flex;gap:12px}
.bet-btn{flex:1;border:1px solid var(--line2);background:var(--card);border-radius:18px;
  padding:20px 12px;cursor:pointer;color:var(--ink);font-family:inherit;transition:.2s;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.bet-btn .lb{font-size:18px;font-weight:800}
.bet-btn .ds{font-size:11px;color:var(--muted)}
.bet-btn:hover{background:var(--card2);transform:translateY(-1px)}
.bet-btn.b-up:hover{border-color:var(--green)}
.bet-btn.b-down:hover{border-color:var(--red)}

/* 天平（线稿） */
.scale-wrap{margin:6px 0 24px}
.scale-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.scale-meta .l{color:var(--green);font-weight:600}
.scale-meta .r{color:var(--red);font-weight:600}
.scale-meta .mid{color:var(--ink2)}
.scale-svg{display:block;margin:0 auto;width:180px;height:110px;overflow:visible}
.scale-svg .beam{transform-origin:90px 30px;transition:transform .9s cubic-bezier(.34,1.56,.64,1)}

/* 现实牌（深灰大圆角，超大白字） */
.cards-grid{display:flex;flex-direction:column;gap:14px}
.fcard{perspective:1200px;cursor:pointer}
.fcard .f-inner{position:relative;width:100%;min-height:100px;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.4,.9,.3,1.2)}
.fcard.open .f-inner{transform:rotateY(180deg)}
.f-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:22px;border:1px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;justify-content:center;padding:18px 22px}
.f-back{align-items:center;justify-content:center;color:var(--muted);
  animation:breathe 2.4s ease-in-out infinite}
.f-back .qmark{font-size:26px;color:var(--muted);font-weight:300}
@keyframes breathe{
  0%,100%{transform:translateY(0);box-shadow:0 0 0 rgba(255,255,255,0)}
  50%{transform:translateY(-3px);box-shadow:0 6px 20px rgba(255,255,255,.04)}
}
.f-front{transform:rotateY(180deg)}
.f-front .fk{font-size:11.5px;color:var(--muted);margin-bottom:8px;letter-spacing:.5px}
.f-front .fv{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.f-front .fd{position:absolute;right:22px;bottom:18px;font-size:13px;font-weight:600}
.f-front.g .fd{color:var(--green)}
.f-front.b .fd{color:var(--red)}
.f-front.n .fv{color:var(--ink)}
.f-front.g .fv{color:var(--ink)}
.f-front.b .fv{color:var(--red)}
/* 红牌翻出时震动 */
.fcard.open.shake .f-inner{animation:shake .5s}
@keyframes shake{
  0%,100%{transform:rotateY(180deg)}
  25%{transform:rotateY(180deg) translateX(-4px)}
  50%{transform:rotateY(180deg) translateX(4px)}
  75%{transform:rotateY(180deg) translateX(-2px)}
}
/* 绿牌翻出时数字发光 */
.fcard.open.pop .f-inner{animation:pop .5s}
@keyframes pop{
  0%{transform:rotateY(180deg) scale(1)}
  50%{transform:rotateY(180deg) scale(1.04)}
  100%{transform:rotateY(180deg) scale(1)}
}

/* 蓝图牌（深灰底 + 细金边） */
.bp-wrap{margin-top:14px;display:none}
.bp-wrap.show{display:block;animation:fade .5s}
.bp-divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;
  font-size:11.5px;color:var(--gold)}
.bp-divider::before,.bp-divider::after{content:"";flex:1;height:1px;background:rgba(229,192,106,.25)}
.bp-card{cursor:pointer}
.bp-card .f-face{border-color:rgba(229,192,106,.45)}
.bp-card .f-back .qmark{color:var(--gold)}
.bp-front{background:var(--card)}
.bp-front .fk{color:var(--gold)}
.bp-front .fv{color:var(--gold);font-size:24px;font-weight:700;line-height:1.4}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 结果区 */
.result{margin-top:16px;border:1px solid var(--line);border-radius:20px;padding:18px 20px;
  background:var(--card);display:none}
.result.show{display:block;animation:fade .5s}
.result .rline{display:flex;gap:10px;font-size:13.5px;line-height:1.65;margin-bottom:10px}
.result .rline:last-child{margin-bottom:0}
.result .rdot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:8px}
.result .ask{color:var(--ink);font-weight:600}
.result .actions{display:flex;gap:10px;margin-top:16px}
.result .actions button{flex:1;border-radius:14px;padding:14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.btn-primary{background:var(--blue);border:1px solid var(--blue);color:#fff}
.btn-primary:hover{background:#2563eb}

/* 底部步骤 */
.stepnav{display:flex;gap:10px;flex:none;margin-top:14px}
.stepnav a{flex:1;text-align:center;padding:13px;border-radius:14px;text-decoration:none;
  font-size:13.5px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.stepnav a.primary{background:var(--blue);border-color:var(--blue);color:#fff}

/* ===== 实验室抽屉 ===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:.3s}
.mask.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:12px;right:12px;bottom:0;z-index:51;
  background:var(--card);border:1px solid var(--line);border-bottom:0;
  border-radius:20px 20px 0 0;max-height:84vh;transform:translateY(102%);transition:transform .35s;
  padding:16px 20px 28px;overflow-y:auto}
.drawer.open{transform:translateY(0)}
.drag-bar{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dh b{font-size:15px;font-weight:800}
.dh .dx{background:var(--card2);border:1px solid var(--line);color:var(--ink2);width:32px;height:32px;
  border-radius:10px;cursor:pointer;font-size:16px}
.dsec{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.dsec h3{margin:0 0 10px;font-size:13px;color:var(--ink2);font-weight:600}
.growth{width:100%;height:auto}
.dtip{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:10px}

/* ===== 响应式 ===== */
@media(min-width:768px){
  .hud{padding:20px 28px}
  .main{max-width:820px;width:100%;margin:24px auto 0}
  .qlist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .play-body{max-width:600px;width:100%;margin:0 auto}
  .bet-step .qbig{font-size:36px}
  .f-front .fv{font-size:40px}
}
@media(max-width:600px){
  .hud{padding:12px 14px}
  .ttl h1{font-size:17px}
  .lab-btn{padding:8px 12px;font-size:11.5px}
  .bet-step .qbig{font-size:26px}
  .f-front .fv{font-size:30px}
}
</style></head>
<body>

<div class="hud">
  <div class="top">
    <a class="round" href="network.html">←</a>
    <div class="ttl">
      <h1>基本面</h1>
      <span>你心里的问题，账本里有答案吗</span>
    </div>
    <button class="lab-btn" onclick="openLab()">实验室</button>
  </div>

  <div class="main">
    <div class="seg">
      <button id="segCit" onclick="switchTab('cit')">市民账</button>
      <button id="segInd" onclick="switchTab('ind')">产业人账</button>
    </div>

    <div class="qgroup-label">
      <i id="grpDot"></i>
      <span id="grpTitle"></span>
      <span class="who" id="grpWho"></span>
    </div>
    <div class="qlist" id="qlist"></div>

    <div class="scroll-note">
      先押一句你的直觉，再把事实一张张翻开。<br>
      <b>账本只摆事实——最后坚持还是改主意，是你自己的事。</b>
    </div>
  </div>

  <div class="stepnav">
    <a href="network.html">← 建构世界</a>
    <a class="primary" href="choices.html">五条路 →</a>
  </div>
</div>

<!-- ===== 玩牌浮层 ===== -->
<div class="play" id="play">
  <div class="play-head">
    <button class="pback" onclick="closePlay()">‹</button>
    <span class="ptag" id="ptag"></span>
    <div class="ptitle" id="ptitle"></div>
  </div>
  <div class="play-body" id="playBody"></div>
</div>

<!-- ===== 实验室抽屉 ===== -->
<div class="mask" id="mask" onclick="closeLab()"></div>
<aside class="drawer" id="drawer">
  <div class="drag-bar"></div>
  <div class="dh"><b>实验室</b><button class="dx" onclick="closeLab()">×</button></div>
  <div class="dsec">
    <h3>高新区园区工业产值 · 生长曲线</h3>
    <svg class="growth" viewBox="0 0 700 180" id="growth"></svg>
    <div class="dtip">高新区园区口径；2026 及以后为规划目标值，非统计定数。</div>
  </div>
  <div class="dsec">
    <h3>数据来源</h3>
    <div class="dtip" style="line-height:1.9">
      惠城区2025年统计公报、2026年政府工作报告、2026上半年经济运行简况、高新区十五五节点（均为政府官网公开数据）。<br>
      本页只摆事实与目标，不替你下结论。
    </div>
  </div>
</aside>

<script>
// ========== 图标 ==========
var ICONS={
  job:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  wage:'<path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  shop:'<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9v11h18V9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/>',
  home:'<path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/>',
  factory:'<path d="M2 20h20"/><path d="M4 20V9l5 3V9l5 3V9l5 3v8"/><path d="M8 20v-3M12 20v-3M16 20v-3"/>',
  invest:'<path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  park:'<path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>'
};
function iconSvg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>';}

// ========== 账本（c: g=利好 b=偏弱 n=中性；fd=涨跌小字） ==========
var QUESTIONS={
  cit:[
    {id:"c1",ico:"job",q:"在惠城找工作，悬不悬？",
      facts:[
        {k:"2025 新增就业",v:"1.7万+",c:"g",fd:"超预期"},

      ask:"岗位还在招。但「有岗位」和「有你看得上的岗位」，是两回事——你还坚持吗？"},
    {id:"c2",ico:"wage",q:"在惠城的工资，涨得动吗？",

        {k:"全体人均可支配收入",v:"63776",c:"g",fd:"+4.5%"},
        {k:"与GDP增速",v:"同步",c:"n",fd:"基本同步"}
      ],
      bp:{k:"十五五蓝图",v:"居民收入与经济增长同步"},

        {k:"年底单月",v:"+8.8%",c:"g",fd:"回暖"}

    {id:"c4",ico:"home",q:"买房、上学，往哪个片区走？",
      facts:[
        {k:"常住人口",v:"159.78",c:"n",fd:"万"},
        {k:"城镇化率",v:"85.7%",c:"n",fd:""},
        {k:"年轻人去向",v:"高新区·东江湾",c:"g",fd:""}
      ],

  ind:[
    {id:"i1",ico:"chart",q:"这盘经济，今年悬不悬？",

        {k:"上半年第二产业",v:"-4.1%",c:"b",fd:""}
      ],
      bp:{k:"十五五蓝图",v:"为惠州迈向万亿GDP 挑大梁作支撑"},
      ask:"上半年只跑了 0.2%，五年要撑万亿的一角。后半程追得上，还是真悬？"},
    {id:"i2",ico:"factory",q:"工业，还能冲吗？",
      facts:[
        {k:"2025 规上工业产值",v:"973.9亿",c:"g",fd:"+9.6%"},
        {k:"2026上半年工业增加值",v:"+0.2%",c:"b",fd:""},

// ========== 列表 ==========

}
function switchTab(t){curTab=t;renderList();}

// ========== 天平 SVG ==========

    +'<line x1="150" y1="30" x2="150" y2="55" stroke="rgba(255,255,255,.35)" stroke-width="1"/>'
    +'<path d="M138 55 Q150 65 162 55 Z" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>'
    +'</g>'

// ========== 打开问题 ==========
function openQ(id){
  cur=QUESTIONS[curTab].find(function(x){return x.id===id;});
  opened=0;net=0;bet=null;
  var r=ROLE[curTab];
  document.getElementById("ptag").textContent=r.tag;
  document.getElementById("ptitle").textContent=r.who;

  var key=curTab+"_"+cur.id;
  var st=stances[key];
  var recallHtml="";
  if(st){
    recallHtml='<div class="recall show">你上次押了「'+(st.bet==="up"?"靠谱":"悬")+'」，'
      +(st.final==="flip"?"最后<b>改了主意</b>":"最后<b>坚持了</b>")+'。这次再翻一次账。</div>';
  }

  document.getElementById("playBody").innerHTML=recallHtml
    +'<div class="bet-step">'
    +'<div class="qbig">'+cur.q+'</div>'
    +'<div class="lead">先表个态——别想数据，凭直觉</div>'
    +'<div class="bet-opts">'
    +'<button class="bet-btn b-up" onclick="placeBet(\'up\')"><span class="lb">靠谱</span><span class="ds">我觉得行</span></button>'
    +'<button class="bet-btn b-down" onclick="placeBet(\'down\')"><span class="lb">悬</span><span class="ds">有点担心</span></button>'
    +'</div></div>';
  document.getElementById("play").classList.add("open");
  document.getElementById("playBody").scrollTop=0;
}
function closePlay(){document.getElementById("play").classList.remove("open");}

function placeBet(b){
  bet=b;
  var cardsHtml=cur.facts.map(function(f,i){
    return '<div class="fcard" id="fc'+i+'" onclick="flip('+i+')"><div class="f-inner">'
      +'<div class="f-face f-back"><span class="qmark">?</span></div>'
      +'<div class="f-face f-front '+f.c+'"><div class="fk">'+f.k+'</div><div class="fv">'+f.v+'</div>'
      +(f.fd?'<span class="fd">'+f.fd+'</span>':'')+'</div>'
      +'</div></div>';
  }).join("");
  document.getElementById("playBody").innerHTML=
    '<div class="scale-wrap">'
    +'<div class="scale-meta"><span class="l">靠谱</span><span class="mid" id="progress">已翻 0 / '+cur.facts.length+' 张</span><span class="r">悬</span></div>'
    +scaleSVG()+'</div>'
    +'<div class="cards-grid">'+cardsHtml+'</div>'
    +'<div class="bp-wrap" id="bpWrap">'
    +'<div class="bp-divider">现实看完了，再对一张蓝图</div>'
    +'<div class="fcard bp-card" id="bpCard" onclick="flipBP()"><div class="f-inner">'
    +'<div class="f-face f-back"><span class="qmark">✦</span></div>'
    +'<div class="f-face f-front"><div class="fk">'+cur.bp.k+'</div><div class="fv">'+cur.bp.v+'</div></div>'
    +'</div></div></div>'
    +'<div class="result" id="result"></div>';
  updateBeam();
}

function flip(i){
  var card=document.getElementById("fc"+i);
  if(card.classList.contains("open"))return;
  card.classList.add("open");
  var f=cur.facts[i];
  if(f.c==="g")net++; else if(f.c==="b")net--;
  opened++;
  // 红牌震动、绿牌弹出
  if(f.c==="b")card.classList.add("shake");
  if(f.c==="g")card.classList.add("pop");
  // 进度
  var pg=document.getElementById("progress");
  if(pg)pg.textContent="已翻 "+opened+" / "+cur.facts.length+" 张";
  // 数字滚动
  animateCountUp(card.querySelector(".fv"), f.v);
  setTimeout(updateBeam,260);
  if(opened===cur.facts.length){
    setTimeout(function(){
      var bw=document.getElementById("bpWrap");
      bw.classList.add("show");
      bw.scrollIntoView({behavior:"smooth",block:"center"});
    },650);
  }
}
// 数字从0滚动到目标值
function animateCountUp(el, raw){
  if(!el)return;
  // 解析数字和后缀
  var m=String(raw).match(/^([+\-]?[\d.]+)(.*)$/);
  if(!m){el.textContent=raw;return;}
  var target=parseFloat(m[1]), suffix=m[2]||"";
  var isInt=Number.isInteger(target);
  var start=0, dur=700, t0=null;
  function step(ts){
    if(!t0)t0=ts;
    var p=Math.min(1,(ts-t0)/dur);
    var eased=1-Math.pow(1-p,3); // easeOutCubic
    var val=start+(target-start)*eased;
    el.textContent=(isInt?Math.round(val):val.toFixed(1))+suffix;
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function updateBeam(){
  var deg=Math.max(-14,Math.min(14,net*6));
  var beam=document.getElementById("beamG");
  if(beam)beam.style.transform="rotate("+deg+"deg)";
}
function flipBP(){
  var card=document.getElementById("bpCard");
  if(card.classList.contains("open"))return;
  card.classList.add("open");
  setTimeout(showResult,700);
}

// ========== 结果 ==========
function leanWord(){
  if(net>0)return "账面上的事实，整体偏「靠谱」";
  if(net<0)return "账面上的事实，整体偏「悬」";
  return "账面上的事实，好坏各半";
}
function showResult(){
  var r=document.getElementById("result");
  var betWord=bet==="up"?"靠谱":"悬";
  r.innerHTML='<div class="rline"><span class="rdot" style="background:var(--green)"></span><span>'+leanWord()+'（你押的「'+betWord+'」）</span></div>'
    +'<div class="rline"><span class="rdot" style="background:var(--gold)"></span><span>'+cur.bp.k+'：<b style="color:var(--gold)">'+cur.bp.v+'</b></span></div>'
    +'<div class="rline"><span class="rdot" style="background:var(--red)"></span><span class="ask">'+cur.ask+'</span></div>'
    +'<div class="rline" style="margin-top:4px"><span class="ask" style="font-size:15px">看完现实和蓝图，你还坚持吗？</span></div>'
    +'<div class="actions">'
    +'<button class="btn-ghost" onclick="commit(\'hold\')">坚持原来的</button>'
    +'<button class="btn-primary" onclick="commit(\'flip\')">改主意了</button></div>';
  r.classList.add("show");
  document.getElementById("playBody").scrollTop=99999;
}
function commit(final){
  var key=curTab+"_"+cur.id;
  stances[key]={bet:bet,final:final,date:new Date().toISOString().slice(5,10)};
  localStorage.setItem("hcStances",JSON.stringify(stances));
  // 心流连续：自动滑到下一个问题，不回列表
  var list=QUESTIONS[curTab];
  var idx=list.findIndex(function(x){return x.id===cur.id;});
  var next=list[idx+1];
  if(next){
    // 简短反馈后自动开下一个
    var r=document.getElementById("result");
    r.innerHTML='<div class="rline"><span class="rdot" style="background:var(--blue)"></span><span>已记下你「'+(final==="flip"?"改了主意":"坚持")+'」的判断。</span></div>'
      +'<div class="rline"><span class="ask">下一个问题来了——</span></div>';
    setTimeout(function(){openQ(next.id);},900);
  }else{
    closePlay();
    setTimeout(renderList,420);
  }
}

renderList();
