<div class="wrap">
  <h1>惠城现在长什么样</h1>
  <p class="sub">只摆数据，不做判断。和自己比，和目标比。</p>

  <!-- 大数字 -->
  <div class="row">
    <div class="card" style="text-align:center">
      <div class="bignum">1203亿</div>
      <div class="label">地区生产总值（GDP）</div>
    </div>
    <div class="card" style="text-align:center">
      <div class="bignum">159.78万</div>
      <div class="label">常住人口</div>
    </div>
  </div>

  <!-- 三产结构 -->
  <div class="card">
    <h2>三产结构</h2>
    <svg viewBox="0 0 400 180">
      <!-- 饼图三段：3.4 / 27.6 / 69.0 -->
      <!-- 第一产业3.4% -->
      <path d="M200,90 L200,10 A80,80 0 0,1 216.7,12.3 Z" fill="#34d399"/>
      <!-- 第二产业27.6% -->
      <path d="M200,90 L216.7,12.3 A80,80 0 0,1 263.8,158.9 Z" fill="#3b82f6"/>
      <!-- 第三产业69.0% -->
      <path d="M200,90 L263.8,158.9 A80,80 0 1,1 200,10 Z" fill="#f97316"/>
      <text x="200" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">69%</text>

      <rect x="310" y="40" width="10" height="10" fill="#34d399"/><text x="325" y="49" font-size="11" fill="#cbd5e1">第一产业 3.4%</text>
      <rect x="310" y="65" width="10" height="10" fill="#3b82f6"/><text x="325" y="74" font-size="11" fill="#cbd5e1">第二产业 27.6%</text>
      <rect x="310" y="90" width="10" height="10" fill="#f97316"/><text x="325" y="99" font-size="11" fill="#cbd5e1">第三产业 69.0%</text>
    </svg>
  </div>

  <!-- 工业内部 -->
  <div class="card">
    <h2>工业产值都在哪</h2>
    <svg viewBox="0 0 600 160">
      <text x="0" y="25" font-size="11" fill="#cbd5e1">高新区</text>
      <rect x="90" y="15" width="380" height="16" fill="#3b82f6" rx="2"/>
      <text x="480" y="27" font-size="11" fill="#fbbf24">632.7亿（占67.4%）</text>

      <text x="0" y="55" font-size="11" fill="#cbd5e1">其他工业</text>
      <rect x="90" y="45" width="180" height="16" fill="#475569" rx="2"/>
      <text x="280" y="57" font-size="11" fill="#8fa3bf">约306亿（占32.6%）</text>

      <text x="0" y="85" font-size="11" fill="#cbd5e1">江北生产性服务业</text>
      <rect x="90" y="75" width="84" height="16" fill="#f97316" rx="2"/>
      <text x="180" y="87" font-size="11" fill="#8fa3bf">139.5亿</text>

      <text x="0" y="120" font-size="10" fill="#5b6b82">数据来源：惠城区2025统计公报、高新区管委会公开数据</text>
    </svg>
  </div>

  <!-- 就业分布（五经普） -->
  <div class="card">
    <h2>就业岗位分布（五经普2023年末）</h2>
    <svg viewBox="0 0 600 180">
      <text x="0" y="25" font-size="11" fill="#cbd5e1">江北</text>
      <rect x="100" y="15" width="220" height="16" fill="#f97316" rx="2"/>
      <text x="325" y="27" font-size="11" fill="#fbbf24">10.96万人（16.5%）</text>

      <text x="0" y="55" font-size="11" fill="#cbd5e1">水口</text>
      <rect x="100" y="45" width="216" height="16" fill="#3b82f6" rx="2"/>
      <text x="321" y="57" font-size="11" fill="#fbbf24">10.78万人（16.2%）</text>

      <text x="0" y="85" font-size="11" fill="#cbd5e1">河南岸</text>
      <rect x="100" y="75" width="200" height="16" fill="#6b7280" rx="2"/>
      <text x="305" y="87" font-size="11" fill="#8fa3bf">9.99万人（15.1%）</text>

      <text x="0" y="115" font-size="11" fill="#cbd5e1">桥西</text>
      <rect x="100" y="105" width="140" height="16" fill="#6b7280" rx="2"/>
      <text x="245" y="117" font-size="11" fill="#8fa3bf">—（排第四）</text>

      <text x="0" y="150" font-size="10" fill="#5b6b82">江北服务业就业 ≈ 水口工业就业。两个数字几乎一样。</text>
    </svg>
  </div>

  <!-- 公共服务 -->
  <div class="row">
    <div class="card" style="text-align:center">
      <div class="bignum" style="font-size:22px">3782张</div>
      <div class="label">医院床位</div>
      <div style="font-size:11px;color:#6b7280;margin-top:4px">千人口床位约2.37张</div>
    </div>
    <div class="card" style="text-align:center">
      <div class="bignum" style="font-size:22px">8000个</div>
      <div class="label">2026新增学位</div>
      <div style="font-size:11px;color:#6b7280;margin-top:4px">文昌1740 + 明达2520等</div>
    </div>
  </div>
