<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='slateblue'/><circle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2.5'/><circle cx='16' cy='16' r='2' fill='white'/></svg>">
<title>惠城产业风洞 · 建构世界</title>
<style>
:root{
  --sky1:#0b1026; --sky2:#1e1b4b; --sky3:#141a35;
  --glass:rgba(255,255,255,.07); --glass-b:rgba(255,255,255,.14);
  --ink:#f1f5f9; --ink2:#cbd5e1; --muted:#94a3b8;
  --neon:#38bdf8; --warm:#fbbf24; --ok:#34d399; --bad:#fb7185; --pink:#f472b6;
  --ind:#3b82f6; --spa:#9aa6b8; --hum:#f97316;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--sky1);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;position:relative}

/* ===== 背景：俯瞰城市地基（蓝图网格） ===== */
.scene{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse at 50% 28%, #1a2148 0%, #0d1330 55%, #070a18 100%);}
.scene::before{content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(148,163,184,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(148,163,184,.055) 1px,transparent 1px);
  background-size:38px 38px;
  mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 85%);}
.scene::after{content:"";position:absolute;left:50%;top:42%;width:520px;height:520px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(56,189,248,.10),transparent 65%);pointer-events:none}

/* ===== HUD ===== */
.hud{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;padding:10px 12px;
  width:100%;max-width:100vw;overflow-x:hidden}
.top{display:flex;align-items:center;gap:10px;flex:none}
.round{width:36px;height:36px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-b);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);text-decoration:none;font-size:18px;flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px}
.ttl span{font-size:11px;color:var(--muted);display:block;line-height:1.3}
.lab-btn{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink2);
  padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;flex:none;white-space:nowrap}
.lab-btn:hover{background:var(--glass-b);color:#fff}

/* ===== 主区域 ===== */
.main{flex:1;min-height:0;min-width:0;width:100%;max-width:100vw;overflow:hidden;display:flex;flex-direction:column;gap:8px;margin-top:9px}
.filters{display:flex;gap:6px;flex:none;justify-content:center;flex-wrap:wrap}
.f{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink2);
  padding:6px 13px;border-radius:18px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.f:hover{color:#fff}
.f.on{background:linear-gradient(135deg,#38bdf8,#6366f1);border-color:transparent;color:#fff;
  box-shadow:0 0 14px rgba(56,189,248,.4)}
.stage{flex:1;min-height:0;position:relative;border:1px solid var(--glass-b);border-radius:16px;
  overflow:hidden;display:flex;
  background:radial-gradient(ellipse at 50% 40%,rgba(20,28,60,.7),rgba(8,12,28,.55));
  box-shadow:inset 0 0 60px rgba(2,6,16,.7)}
.stage svg{width:100%;height:100%;display:block}
.cap{position:absolute;left:50%;top:10px;transform:translateX(-50%);
  background:rgba(8,12,28,.72);border:1px solid var(--glass-b);backdrop-filter:blur(8px);
  padding:5px 16px;border-radius:20px;font-size:12px;font-weight:600;color:var(--ink2);
  white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.legend{position:absolute;left:10px;bottom:8px;display:flex;gap:11px;font-size:10px;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}

/* ===== 解读卡：事实→现状→抛问题（不下定论） ===== */
.readcard{flex:none;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--glass-b);
  border-radius:12px;padding:8px 11px;display:flex;flex-direction:column;gap:4px;margin-top:8px;
  width:100%;max-width:100%;overflow:hidden;box-sizing:border-box}
.rc-row{font-size:11.5px;line-height:1.5;color:var(--ink2);margin-bottom:3px;overflow-wrap:anywhere;word-break:break-word}
.rc-row:last-child{margin-bottom:0}
.rc-tag{display:inline-block;font-style:normal;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:5px;letter-spacing:.5px;white-space:nowrap;margin-right:6px;vertical-align:1px}
.rc-row.rc-q{color:var(--ink)}
.rc-row.rc-q .rc-qtext{color:#fde68a;font-weight:600}

/* ===== 底部时间轴控制 ===== */
.controls{flex:none;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--glass-b);
  border-radius:14px;padding:10px 12px;margin-top:9px}
.timeline{display:flex;align-items:center;gap:10px}
.cbtn{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;flex:none;
  background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px rgba(56,189,248,.4)}
.cbtn:active{transform:scale(.92)}
.seek-wrap{flex:1;min-width:0}
.seek{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--neon) 0%,var(--neon) var(--p,0%),rgba(148,163,184,.2) var(--p,0%));
  outline:none;cursor:pointer}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 0 10px var(--neon);cursor:pointer;border:2px solid var(--neon)}
.seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--neon)}
.ticks{display:flex;justify-content:space-between;margin-top:5px;font-size:9px;color:var(--muted);padding:0 2px}
.spd{width:46px;height:38px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-b);
  color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;flex:none}
.spd:hover{color:#fff}
.stepnav{display:flex;gap:8px;margin-top:8px}
.stepnav a{flex:1;text-align:center;padding:8px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:600;
  background:var(--glass);border:1px solid var(--glass-b);color:var(--ink2)}
.stepnav a.primary{background:linear-gradient(135deg,#38bdf8,#6366f1);border-color:transparent;color:#fff}

/* ===== 节点与边 ===== */
.gnode{opacity:0;transform-box:fill-box;transform-origin:center;cursor:pointer}
.gnode.show{opacity:1;animation:grow .6s cubic-bezier(.2,1.2,.4,1)}
@keyframes grow{0%{opacity:0;transform:scale(0)}60%{transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
.gnode .core{transition:opacity .4s,r .4s}
.gnode .lbl{pointer-events:none;user-select:none}
.eline{opacity:0;transition:opacity .5s}
.eline.show{opacity:1}
.eline.hot{stroke-dasharray:7 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.gnode .ring{opacity:0;transform-box:fill-box;transform-origin:center}
.gnode.pulse .ring{opacity:1;animation:ringp 1.6s ease-out infinite}
@keyframes ringp{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.5);opacity:0}}

/* ===== 抽屉（实验室） ===== */
.mask{position:fixed;inset:0;background:rgba(2,6,16,.62);z-index:40;opacity:0;pointer-events:none;transition:.3s}
.mask.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:8px;right:8px;bottom:0;z-index:41;
  background:linear-gradient(180deg,#141a38,#0b1026);border:1px solid var(--glass-b);border-bottom:0;
  border-radius:18px 18px 0 0;max-height:82vh;transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.3,1);
  padding:14px 16px 22px;overflow-y:auto}
.drawer.open{transform:translateY(0)}
.drag-bar{width:40px;height:4px;border-radius:2px;background:var(--glass-b);margin:0 auto 12px}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dh b{font-size:15px;font-weight:800}
.dx{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink2);width:30px;height:30px;
  border-radius:8px;cursor:pointer;font-size:15px}
.dsec{background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:12px;margin-bottom:11px}
.dsec h3{margin:0 0 9px;font-size:12.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.dtabs{display:flex;gap:6px;margin-bottom:10px}
.dtab{flex:1;background:var(--glass);border:1px solid var(--glass-b);color:var(--ink2);padding:6px;border-radius:8px;
  font-size:11px;font-weight:600;cursor:pointer}
.dtab.on{background:linear-gradient(135deg,#38bdf8,#6366f1);border-color:transparent;color:#fff}
.rank-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11.5px}
.rank-row .nm{width:78px;flex:none;color:var(--ink2);text-align:right;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .bg{flex:1;height:12px;background:rgba(2,6,16,.5);border-radius:3px;overflow:hidden}
.rank-row .bar{height:100%;border-radius:3px}
.rank-row .vl{width:52px;flex:none;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.blood-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;margin-right:5px}
.blood-A{background:#14532d;color:#86efac}.blood-B{background:#1e3a5f;color:#93c5fd}
.blood-C{background:#4a3a12;color:#fcd34d}.blood-D{background:#4a1a1a;color:#fca5a5}
.dbtn{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink2);padding:8px 12px;
  border-radius:9px;font-size:11.5px;font-weight:600;cursor:pointer;flex:1}
.dbtn:hover{color:#fff}
.dbtn-row{display:flex;gap:8px}
.note-plain{font-size:12px;line-height:1.85;color:var(--ink2);margin:0}
.note-plain b{color:var(--warm)}
.dtip{font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:6px}

/* ===== 响应式 ===== */
@media(max-width:600px){
  .hud{padding:8px 10px}
  .ttl h1{font-size:15px}
  .ttl span{font-size:10.5px}
  .lab-btn{padding:7px 11px;font-size:11.5px}
  .f{padding:5px 10px;font-size:11px}
  .legend{display:none}
  .stepnav a{font-size:11px;padding:7px}
  .readcard{padding:6px 9px;gap:3px;margin-top:6px}
  .rc-row{font-size:10.5px;line-height:1.4}
  .rc-tag{font-size:9px}
}
@media(max-height:620px){
  .ttl span{display:none}
  .filters{margin-top:0}
}
</style></head>
<body>

<div class="scene"></div>

<div class="hud">
  <!-- 顶部 -->
  <div class="top">
    <a class="round" href="index.html" aria-label="返回沙盘">←</a>
    <div class="ttl">
      <h1>建构世界</h1>
      <span>拖动时间轴，看惠城怎么一点点长起来</span>
    </div>
    <button class="lab-btn" onclick="openLab()">实验室</button>
  </div>

  <!-- 主区域 -->
  <div class="main">
    <div class="filters">
      <button class="f on" data-layer="city">城市</button>
      <button class="f" data-layer="degree">谁连得最多</button>
      <button class="f" data-layer="between">必经之路</button>
      <button class="f" data-layer="close">城市中心</button>
    </div>
    <div class="stage">
      <svg id="net" viewBox="0 0 860 600" preserveAspectRatio="xMidYMid meet">
        <g id="edges"></g>
        <g id="nodes"></g>
      </svg>
      <div class="cap" id="cap">点播放，看城市长出来</div>
      <div class="legend">
        <span><i class="dot" style="background:var(--ind)"></i>产业</span>
        <span><i class="dot" style="background:var(--spa)"></i>空间</span>
        <span><i class="dot" style="background:var(--hum)"></i>人</span>
        <span style="color:var(--hum)">— 通勤走廊</span>
      </div>
    </div>
  </div>
  <div class="readcard" id="readCard">
    <div class="rc-row"><i class="rc-tag" style="background:rgba(249,115,22,.22);color:#fbbf24">跟你</i><span id="rcYou"></span></div>
    <div class="rc-row"><i class="rc-tag" style="background:rgba(56,189,248,.18);color:#38bdf8">现状</i><span id="rcNow"></span></div>
    <div class="rc-row rc-q"><i class="rc-tag" style="background:rgba(251,113,133,.18);color:#fb7185">抛给你</i><span class="rc-qtext" id="rcQ"></span></div>
  </div>

  <!-- 底部时间轴 -->
  <div class="controls">
    <div class="timeline">
      <button class="cbtn" id="playBtn" aria-label="播放">▶</button>
      <div class="seek-wrap">
        <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="生长进度">
        <div class="ticks">
          <span>地基</span><span>产业</span><span>空间</span><span>人</span><span>现在</span>
        </div>
      </div>
      <button class="spd" id="spdBtn">1x</button>
    </div>
    <div class="stepnav">
      <a href="index.html">返回沙盘</a>
      <a class="primary" href="who.html">下一步：城市体检 →</a>
    </div>
  </div>
</div>

<!-- 实验室抽屉 -->
<div class="mask" id="mask" onclick="closeLab()"></div>
<aside class="drawer" id="drawer" aria-label="实验室">
  <div class="drag-bar"></div>
  <div class="dh"><b>实验室</b><button class="dx" onclick="closeLab()">×</button></div>

  <div class="dsec">
    <h3>三把尺子 · 谁最重要</h3>
    <div class="dtabs">
      <button class="dtab on" data-rank="degree">连接数</button>
      <button class="dtab" data-rank="between">必经之路</button>
      <button class="dtab" data-rank="close">到哪都近</button>
    </div>
    <div id="rankList"></div>
    <div class="dtip" id="rankTip"></div>
  </div>

  <div class="dsec">
    <h3>关系的数据血统</h3>
    <div class="note-plain" style="line-height:2">
      <span class="blood-tag blood-A">A</span>公开资料直接给出<br>
      <span class="blood-tag blood-B">B</span>据公开主体与产业逻辑可推断<br>
      <span class="blood-tag blood-C">C</span>合理推断但缺直接证据<br>
      <span class="blood-tag blood-D">D</span>无公开数据，属模型假设
    </div>
    <div class="dtip" id="bloodStat"></div>
  </div>

  <div class="dsec">
    <h3>导出数据</h3>
    <div class="dbtn-row">
      <button class="dbtn" id="exEdges">导出关系 edges.csv</button>
      <button class="dbtn" id="exNodes">导出节点 nodes.csv</button>
    </div>
  </div>

  <div class="dsec">
    <h3>这张图想说什么</h3>
    <p class="note-plain">26个主体，理论上最多能有325对关系，实际只连了37条可佐证主边，密度约<b>11.4%</b>。我们总盯着谁最大、谁最有名，却容易忽略：真正让整座城转起来的，可能是那些不起眼、却卡在咽喉上的连接。<b>节点大不大，不决定命门；它卡在什么位置，才决定。</b></p>
  </div>
</aside>

<script>
// ===== 26节点：产业12 / 空间8 / 人6；t=生长时刻（0-1） =====
const NODES=[
  // 地基（老城）
  {n:"江北CBD",x:180,y:250,r:21,c:"#9aa6b8",layer:"空间",t:0.05},

  {n:"跨城通勤",x:475,y:60,r:10,c:"#f97316",layer:"人",t:0.80},
  {n:"学龄家庭",x:115,y:475,r:11,c:"#f97316",layer:"人",t:0.83}
];
const byName={};NODES.forEach(n=>byName[n.n]=n);

// ===== 37条边：type=link/commute；weight；blood=血统 =====
const EDGES=[
  {from:"利元亨",to:"智能装备",type:"link",weight:1.0,blood:"B"},
  {from:"雷士光电",to:"智能家电",type:"link",weight:1.0,blood:"B"},
  {from:"先进科技",to:"电子信息",type:"link",weight:1.0,blood:"B"},
  {from:"天宝创能",to:"新能源新材料",type:"link",weight:1.0,blood:"B"},
  {from:"智能装备",to:"高新区",type:"link",weight:1.2,blood:"B"},
  {from:"电子信息",to:"高新区",type:"link",weight:1.2,blood:"B"},
  {from:"新能源新材料",to:"高新区",type:"link",weight:1.2,blood:"B"},
  {from:"智能家电",to:"高新区",type:"link",weight:1.0,blood:"B"},
  {from:"AI机器人",to:"高新区",type:"link",weight:0.8,blood:"C"},
  {from:"利元亨",to:"东江湾",type:"link",weight:1.0,blood:"B"},
  {from:"电子信息",to:"东江湾",type:"link",weight:1.0,blood:"B"},
  {from:"智能装备",to:"东江湾",type:"link",weight:1.0,blood:"B"},
  {from:"新能源新材料",to:"东江湾",type:"link",weight:1.0,blood:"B"},

// ===== 中心性计算 =====
function buildAdj(){
  const adj={};
  NODES.forEach(n=>adj[n.n]=[]);
  EDGES.forEach(e=>{
    adj[e.from].push(e.to);adj[e.to].push(e.from);
  });
  return adj;
}
function calcDegree(){
  const d={};NODES.forEach(n=>d[n.n]=0);
  EDGES.forEach(e=>{d[e.from]++;d[e.to]++;});
  return d;
}
function calcBetweenness(){
  const adj=buildAdj();const cb={};
  NODES.forEach(n=>cb[n.n]=0);
  NODES.forEach(s=>{
    const S=[];const P={};const sigma={};const dist={};
    NODES.forEach(n=>{P[n.n]=[];sigma[n.n]=0;dist[n.n]=-1;});
    sigma[s.n]=1;dist[s.n]=0;const Q=[s.n];
    while(Q.length){
      const v=Q.shift();S.push(v);
      adj[v].forEach(w=>{
        if(dist[w]<0){dist[w]=dist[v]+1;Q.push(w);}
        if(dist[w]===dist[v]+1){sigma[w]+=sigma[v];P[w].push(v);}
      });
    }
    const delta={};NODES.forEach(n=>delta[n.n]=0);
    while(S.length){
      const w=S.pop();
      P[w].forEach(v=>{delta[v]+=(sigma[v]/sigma[w])*(1+delta[w]);});
      if(w!==s.n)cb[w]+=delta[w];
    }
  });
  NODES.forEach(n=>cb[n.n]/=2);
  return cb;
}
function calcCloseness(){
  const adj=buildAdj();const cc={};
  NODES.forEach(s=>{
    const dist={};NODES.forEach(n=>dist[n.n]=-1);
    dist[s.n]=0;const Q=[s.n];
    while(Q.length){
      const v=Q.shift();
      adj[v].forEach(w=>{if(dist[w]<0){dist[w]=dist[v]+1;Q.push(w);}});
    }
    let sum=0,count=0;
    NODES.forEach(n=>{if(dist[n.n]>0){sum+=dist[n.n];count++;}});
    cc[s.n]=(count>0&&sum>0)?(count/sum):0;
  });
  return cc;
}
const degVals=calcDegree(), betVals=calcBetweenness(), cloVals=calcCloseness();

function updateRead(p){

function setProgress(p){
  progress=p;
  NODES.forEach((nd,i)=>{
    nodeEls[i].classList.toggle("show",nd.t<=p);
  });
  EDGES.forEach((e,i)=>{
    edgeEls[i].classList.toggle("show",e.t<=p);
  });
  seek.value=Math.round(p*1000);
  seek.style.setProperty("--p",(p*100)+"%");
  updateCap(p);
  updateRead(p);
}
function tick(ts){
  if(!playing)return;
  if(!lastT)lastT=ts;
  const dt=(ts-lastT)/1000;lastT=ts;
  let p=progress+dt*0.12*speed;
  if(p>=1){setProgress(1);pause();setPlayIcon();}
  else setProgress(p);
  if(playing)raf=requestAnimationFrame(tick);
}
function play(){
  playing=true;lastT=0;
  raf=requestAnimationFrame(tick);
  document.getElementById("playBtn").textContent="❚❚";
}
function pause(){
  playing=false;
  if(raf)cancelAnimationFrame(raf);
  document.getElementById("playBtn").textContent="▶";
}
function setPlayIcon(){document.getElementById("playBtn").textContent="▶";}
document.getElementById("playBtn").onclick=function(){
  if(playing){pause();}
  else{
    if(progress>=1)setProgress(0);
    play();
  }
};

});

// ===== 信息图层滤镜 =====
let currentLayer="city", focusName=null;
function setFocus(name){
  focusName=(focusName===name)?null:name;
  renderFocus();
}
function renderFocus(){
  if(!focusName){applyLayer(currentLayer);updateCap(progress);return;}
  const neighbors=new Set([focusName]);
  EDGES.forEach(function(e){
    if(e.from===focusName)neighbors.add(e.to);
    if(e.to===focusName)neighbors.add(e.from);
  });
  NODES.forEach(function(nd,i){
    const core=nodeEls[i].querySelector(".core");
    const lbl=nodeEls[i].querySelector(".lbl");
    const on=neighbors.has(nd.n);
    core.setAttribute("opacity",on?1:0.08);
    lbl.style.opacity=on?1:0.1;
  });
  EDGES.forEach(function(e,i){
    const touch=(e.from===focusName||e.to===focusName);
    edgeEls[i].style.opacity=touch?0.95:0.05;
  });
  cap.textContent=focusName+" · 直接连着 "+degVals[focusName]+" 个主体";
}
function normOne(vals,name){
  const arr=NODES.map(n=>vals[n.n]);
  const max=Math.max.apply(null,arr), min=Math.min.apply(null,arr);
  if(max===min)return 0.5;
  return (vals[name]-min)/(max-min);
}
function applyLayer(layer){
  currentLayer=layer;focusName=null;
  NODES.forEach((nd,i)=>{
    const g=nodeEls[i];
    const core=g.querySelector(".core");
    const lbl=g.querySelector(".lbl");
    g.classList.remove("pulse");
    if(layer==="city"){
      core.setAttribute("r",nd.r);
      core.setAttribute("opacity",0.92);
      core.setAttribute("fill",nd.c);
      lbl.style.opacity=1;
    }else{
      const vals=layer==="degree"?degVals:(layer==="between"?betVals:cloVals);
      const n=normOne(vals,nd.n);
      if(layer==="degree"){
        core.setAttribute("r",Math.max(6,nd.r*0.55+n*nd.r*0.9));
      }else{
        core.setAttribute("r",nd.r);
      }
      core.setAttribute("opacity",0.2+n*0.8);
      lbl.style.opacity=n>0.5?1:0.2;
      if(n>0.78)g.classList.add("pulse");
    }
  });
  EDGES.forEach((e,i)=>{
    const el=edgeEls[i];
    if(layer==="city"){
      const def=el.getAttribute("data-def")==="1";
      el.style.opacity=def?0.95:(e.type==="commute"?0.7:0.4);
    }else{
      el.style.opacity=0.12;
    }
  });
}

});

function renderRank(mode){
  const vals=mode==="degree"?degVals:(mode==="between"?betVals:cloVals);
  const sorted=NODES.slice().sort(function(a,b){return vals[b.n]-vals[a.n];});
  const max=vals[sorted[0].n]||1;
  const col={产业:"#3b82f6",空间:"#9aa6b8",人:"#f97316"};
  let html="";
  sorted.slice(0,10).forEach(function(n){
    const v=vals[n.n];
    const pct=max>0?(v/max*100):0;
    const disp=mode==="degree"?v+"条":v.toFixed(3);
    html+='<div class="rank-row"><span class="nm">'+n.n+'</span>'+
      '<div class="bg"><div class="bar" style="width:'+pct+'%;background:'+col[n.layer]+'"></div></div>'+
      '<span class="vl">'+disp+'</span></div>';
  });
  document.getElementById("rankList").innerHTML=html;
  const tips={
    degree:"连接数：直接连了多少条边，回答“谁现在最热闹”。",
    between:"必经之路：多少条最短路径必须经过它，回答“谁是咽喉”。它一断，网络会裂成几块。",
    close:"到哪都近：到其他主体的平均距离的倒数，回答“谁的位置最居中”。近不等于必经。"
  };
  document.getElementById("rankTip").textContent=tips[mode];
}

function downloadCSV(filename,rows){
  const csv=rows.map(function(r){
    return r.map(function(c){
      const s=String(c);
      return (s.indexOf(",")>=0||s.indexOf('"')>=0||s.indexOf("\n")>=0)?'"'+s.replace(/"/g,'""')+'"':s;
    }).join(",");
  }).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}
