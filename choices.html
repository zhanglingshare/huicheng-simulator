<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>惠城产业风洞 · 五条路</title>
<script src="model.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#0a1830 0%,#14294d 45%,#0c1e38 100%);
  color:#f0f4fa;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(800px 400px at 50% 0%,rgba(59,130,246,.18),transparent 60%),
             radial-gradient(600px 300px at 50% 100%,rgba(240,199,94,.06),transparent 60%)}

.hud{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;padding:16px 18px;max-width:640px;margin:0 auto}

.top{display:flex;align-items:center;gap:12px;flex:none}
.back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;
  color:#b8c5d9;text-decoration:none;font-size:18px;flex:none;backdrop-filter:blur(10px)}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px}
.ttl span{font-size:12.5px;color:#7a8ba3;display:block;line-height:1.4;margin-top:2px}

/* 塔身区 */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;justify-content:center;margin:20px 0}
.tower-wrap{position:relative;display:flex;align-items:flex-end;gap:20px;height:100%}
.tower{display:flex;flex-direction:column-reverse;gap:6px;align-items:center;justify-content:flex-end}
.block{width:180px;max-width:40vw;padding:14px 12px;border-radius:14px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  text-align:center;cursor:pointer;transition:all .4s cubic-bezier(.34,1.56,.64,1);
  position:relative}
.block .b-name{font-size:13px;font-weight:700;color:#f0f4fa;line-height:1.3}
.block .b-val{font-size:11px;color:#7dd3fc;margin-top:3px;font-variant-numeric:tabular-nums}
.block.placed{background:rgba(125,211,252,.15);border-color:rgba(125,211,252,.4)}
.block:hover{transform:translateY(-3px)}
.block.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 刻度线 */
.scale{position:relative;width:2px;height:100%;background:rgba(255,255,255,.1);flex:none}
.scale .mark{position:absolute;left:8px;transform:translateY(-50%);font-size:11px;color:#7a8ba3;white-space:nowrap}
.scale .mark.target{color:#f0c75e;font-weight:700}
.scale .mark.base{color:#b8c5d9}
.scale .target-line{position:absolute;left:-6px;right:-6px;height:1px;background:rgba(240,199,94,.5);border-top:1px dashed rgba(240,199,94,.6)}
.scale .cur-line{position:absolute;left:-10px;right:-10px;height:2px;background:#7dd3fc;box-shadow:0 0 8px rgba(125,211,252,.6);transition:top .6s cubic-bezier(.34,1.56,.64,1)}

/* 底部未放积木 */
.pool{flex:none;padding:10px 0 16px}
.pool-label{font-size:11.5px;color:#7a8ba3;text-align:center;margin-bottom:10px}
.pool-blocks{display:flex;gap:8px;overflow-x:auto;padding:4px;scrollbar-width:none}
.pool-blocks::-webkit-scrollbar{display:none}
.pool-block{flex:none;width:110px;padding:10px;border-radius:12px;
  background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.15);
  text-align:center;cursor:pointer;transition:.25s}
.pool-block:hover{background:rgba(255,255,255,.1);border-color:rgba(125,211,252,.4)}
.pool-block .pb-name{font-size:11.5px;font-weight:600;color:#e2e8f0;line-height:1.3}
.pool-block .pb-val{font-size:10px;color:#7dd3fc;margin-top:2px}

/* 底部结果 */
.result-bar{flex:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:18px;padding:14px 18px;backdrop-filter:blur(12px);margin-bottom:12px}
.result-bar .r-top{display:flex;justify-content:space-between;align-items:baseline}
.result-bar .r-label{font-size:12px;color:#7a8ba3}
.result-bar .r-val{font-size:26px;font-weight:800;color:#f0f4fa;font-variant-numeric:tabular-nums}
.result-bar .r-val small{font-size:14px;color:#7a8ba3;font-weight:400}
.result-bar .r-gap{font-size:12.5px;margin-top:6px;color:#f0c75e;font-weight:600}
.result-bar .r-gap.over{color:#34d399}

.next-btn{flex:none;width:100%;padding:15px;border:none;border-radius:16px;
  background:linear-gradient(135deg,#f0c75e,#d4a843);color:#1a1a2e;
  font-size:15px;font-weight:800;cursor:pointer;transition:.2s;font-family:inherit}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(240,199,94,.3)}
.next-btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
</style></head><body>

<div class="hud">
  <div class="top">
    <a class="back" href="network.html">←</a>
    <div class="ttl">
      <h1>搭你的惠城 2030</h1>
      <span>6 块积木，搭到 1500 亿</span>
    </div>
  </div>

  <div class="stage">
    <div class="tower-wrap">
      <div class="tower" id="tower"></div>
      <div class="scale" id="scale">
        <div class="target-line" style="top:0"></div>
        <div class="mark target" style="top:0">1500亿 目标</div>
        <div class="mark base" style="bottom:0">632.7亿 现在</div>
        <div class="cur-line" id="curLine" style="bottom:0"></div>
      </div>
    </div>
  </div>

  <div class="pool">
    <div class="pool-label">点一块积木放到塔上 · 点塔上的积木拿掉</div>
    <div class="pool-blocks" id="pool"></div>
  </div>

  <div class="result-bar">
    <div class="r-top">
      <span class="r-label">你的塔高</span>
      <span class="r-val"><span id="curVal">632.7</span><small> 亿</small></span>
    </div>
    <div class="r-gap" id="gap">离 1500 亿还差 867.3 亿</div>
  </div>

  <button class="next-btn" id="nextBtn" onclick="goNext()">就这么着，跑模型 →</button>
</div>

<script>
// 6块积木：来自 model.js DEFAULT_PATHS，但用真实路名
var BLOCKS=[
  {mu:500,name:'新投产项目',desc:'15宗开工/18宗投产'},
  {mu:200,name:'三大集群',desc:'电子/装备/新能源'},
  {mu:100,name:'AI机器人',desc:'新赛道'},
  {mu:100,name:'生产性服务业',desc:'双轮驱动'},
  {mu:50, name:'融深融湾',desc:'外部变量'}
];
// 第6块：跨江通道（新增，mu=30）
BLOCKS.push({mu:30,name:'跨江深惠',desc:'半小时通勤圈'});

var BASE=632.7, TARGET=1500;
var placed=[]; // 已放的索引

function total(){return BASE + placed.reduce(function(s,i){return s+BLOCKS[i].mu;},0);}

function render(){
  // 塔
  var tw=document.getElementById('tower');
  tw.innerHTML='';
  // 从下到上：已放的按放入顺序
  placed.forEach(function(idx){
    var b=BLOCKS[idx];
    var d=document.createElement('div');
    d.className='block placed';
    d.innerHTML='<div class="b-name">'+b.name+'</div><div class="b-val">+'+b.mu+'亿</div>';
    d.onclick=function(){removeBlock(idx);};
    tw.appendChild(d);
  });
  // 底部地基
  var base=document.createElement('div');
  base.style.cssText='width:200px;max-width:50vw;height:12px;border-radius:6px;background:rgba(255,255,255,.15)';
  tw.appendChild(base);

  // 池
  var pool=document.getElementById('pool');
  pool.innerHTML='';
  BLOCKS.forEach(function(b,i){
    if(placed.indexOf(i)>=0)return;
    var d=document.createElement('div');
    d.className='pool-block';
    d.innerHTML='<div class="pb-name">'+b.name+'</div><div class="pb-val">+'+b.mu+'亿 · '+b.desc+'</div>';
    d.onclick=function(){placeBlock(i);};
    pool.appendChild(d);
  });

  // 数字
  var t=total();
  animateVal(t);

  // 刻度线位置：塔高对应在 0~100%（target在0%，base在100%）
  var pct=Math.max(0,Math.min(100,(t-TARGET)/(BASE-TARGET)*100));
  document.getElementById('curLine').style.bottom=pct+'%';

  // gap
  var gapEl=document.getElementById('gap');
  var diff=TARGET-t;
  if(diff>0){
    gapEl.textContent='离 1500 亿还差 '+diff.toFixed(0)+' 亿';
    gapEl.className='r-gap';
  }else{
    gapEl.textContent='已过 1500 亿 '+( -diff).toFixed(0)+' 亿';
    gapEl.className='r-gap over';
  }
}

function placeBlock(i){
  if(placed.indexOf(i)>=0)return;
  placed.push(i);
  render();
}
function removeBlock(i){
  placed=placed.filter(function(x){return x!==i;});
  render();
}

// 数字滚动
function animateVal(target){
  var el=document.getElementById('curVal');
  var start=parseFloat(el.textContent)||BASE;
  var dur=600,t0=null;
  function step(ts){
    if(!t0)t0=ts;
    var p=Math.min(1,(ts-t0)/dur);
    var e=1-Math.pow(1-p,3);
    el.textContent=(start+(target-start)*e).toFixed(1);
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function goNext(){
  // 把选择存下来，传给 future.html
  var active=placed.map(function(i){return i;});
  localStorage.setItem('hcChoices',JSON.stringify(active));
  location.href='future.html?from=choices';
}

render();
</script>
</body></html>
