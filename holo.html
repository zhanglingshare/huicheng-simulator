<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看见惠城 · 全息版</title>
<meta name="description" content="在同一全息空间内，沿高新产业、城市消费、服务、文旅、人居与交通，发现惠城这座中心城区的关系与流动；真实数据、研究推断、假设实验分层呈现。">
<style>
  :root{
    --ink:#1e2b3a; --sub:#64748b; --line:#e2e8f0;
    --blue:#2563eb; --orange:#ea580c; --teal:#0d9488;
    --red:#dc2626; --purple:#7c3aed; --green:#16a34a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
    color:var(--ink); overflow:hidden;
    background:
      radial-gradient(1200px 700px at 50% 38%, #fbf7f0 0%, #f6f1e9 45%, #efe9df 100%);
  }
  #app{position:relative;width:100%;height:100%}

  /* ===== 顶部 ===== */
  header{position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;padding:0 22px;z-index:30;gap:10px}
  .burger{display:none;align-items:center;justify-content:center;width:38px;height:38px;border:none;background:rgba(255,255,255,.7);border-radius:10px;cursor:pointer;flex-shrink:0}
  .overlay{display:none;position:fixed;inset:0;background:rgba(30,43,58,.38);z-index:65}
  .overlay.show{display:block}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand .logo{width:36px;height:36px}
  .brand h1{font-size:18px;font-weight:800;letter-spacing:1px}
  .brand .tag{font-size:10px;color:var(--sub);letter-spacing:2px}
  nav.top{display:flex;gap:2px;margin-left:14px}
  nav.top button{
    border:none;background:transparent;cursor:pointer;font:inherit;
    display:flex;align-items:center;gap:5px;color:#475569;font-size:13.5px;font-weight:600;
    padding:8px 12px;border-radius:20px;transition:.18s;
  }
  nav.top button:hover{background:rgba(255,255,255,.7)}
  nav.top button.active{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(30,43,58,.25)}
  .search{margin-left:auto;display:flex;align-items:center;width:250px;height:36px;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:20px;padding:0 14px;gap:8px;flex-shrink:0}
  .search input{border:none;background:transparent;outline:none;font:inherit;font-size:13px;color:var(--ink);width:100%}

  /* ===== 指标卡 ===== */
  #metrics{position:absolute;top:66px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:25}
  .metric{
    width:158px;height:62px;background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.95);
    border-radius:13px;box-shadow:0 8px 20px rgba(100,116,139,.13);padding:9px 13px;
  }
  .metric .k{font-size:11px;color:var(--sub);white-space:nowrap}
  .metric .v{font-size:20px;font-weight:800;line-height:1.1;margin-top:2px}
  .metric .v small{font-size:11px;font-weight:700;margin-left:2px}
  .up{color:#16a34a}.warm{color:#d97706}

  /* ===== 沙盘舞台 ===== */
  #stageWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5}
  #stage{position:relative;width:min(96vw, calc((100vh - 200px) * 1.5));aspect-ratio:3/2;transition:filter .4s, opacity .4s}
  #stage .base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
    border-radius:18px;
    transition:transform .3s ease-out;will-change:transform}
  .plate{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:10;background:none;border:none;padding:0}
  .plate .chip{
    display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.95);border:1px solid var(--line);
    border-radius:11px;box-shadow:0 8px 18px rgba(100,116,139,.18);padding:6px 8px 6px 10px;white-space:nowrap;
  }
  .plate .ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .plate .tt{font-size:12.5px;font-weight:800;line-height:1.1}
  .plate .ss{font-size:9.5px;color:var(--sub);margin-top:1px}
  .plate .badge{border-radius:9px;padding:2px 6px;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
  .plate .core{background:rgba(30,43,58,.93);color:#fff;border-radius:11px;padding:7px 16px;text-align:center;box-shadow:0 8px 20px rgba(30,43,58,.3)}
  .plate .core .tt{font-size:14px;font-weight:800}.plate .core .ss{font-size:10px;color:#c3d2e2}
  .plate:hover .chip{transform:translateY(-2px);transition:.18s}
  .plate .chip,.plate .core{transition:.18s}
  #stage.dim .plate{opacity:.28;filter:grayscale(.5)}
  #stage .plate.focus{opacity:1;z-index:20}
  #stage .plate.focus .chip{transform:scale(1.08)}
  #stage .plate.focus .core{transform:scale(1.08)}

  /* ===== 侧栏 ===== */
  .side{position:absolute;top:148px;width:150px;z-index:24}
  .side.left{left:18px}
  .side.right{right:18px}
  .card{background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.95);border-radius:13px;box-shadow:0 8px 20px rgba(100,116,139,.14);padding:11px}
  .card + .card{margin-top:10px}
  .allhc{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;cursor:pointer}
  .menu button{width:100%;border:none;background:none;cursor:pointer;font:inherit;display:flex;align-items:center;gap:9px;color:#475569;font-size:12.5px;font-weight:600;padding:7px 5px;border-radius:8px;text-align:left}
  .menu button:hover{background:rgba(255,255,255,.7)}
  .menu button.active{color:var(--ink);background:rgba(255,255,255,.8);font-weight:800}
  .card h3{font-size:12.5px;font-weight:800;margin-bottom:7px}
  .scen button{width:100%;border:none;background:none;cursor:pointer;font:inherit;display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12px;color:#64748b;font-weight:600;text-align:left}
  .radio{width:14px;height:14px;border-radius:50%;border:2px solid #cbd5e1;flex-shrink:0}
  .scen button.active{color:var(--ink);font-weight:700}.scen button.active .radio{border-color:var(--ink);background:radial-gradient(circle,var(--ink) 40%,transparent 45%)}
  .legend .row{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:11.5px;color:#475569;font-weight:600}
  .legend .ln{width:26px;height:0}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:#475569;font-weight:600;margin-top:9px}
  .switch{width:34px;height:19px;border-radius:10px;background:var(--ink);position:relative;cursor:pointer}
  .switch i{position:absolute;right:2px;top:2px;width:15px;height:15px;background:#fff;border-radius:50%}
  .switch.off{background:#cbd5e1}.switch.off i{right:auto;left:2px}

  /* ===== 底部 ===== */
  footer{position:absolute;left:0;right:0;bottom:0;height:104px;z-index:30;display:flex;align-items:center;gap:14px;padding:0 18px}
  .go{display:flex;align-items:center;gap:13px;background:var(--ink);border-radius:15px;padding:16px 22px;color:#fff;box-shadow:0 12px 26px rgba(30,43,58,.3);cursor:pointer;border:none;font:inherit}
  .go .play{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
  .go .t{font-size:15px;font-weight:800}.go .s{font-size:10.5px;color:#aebfd0;margin-top:2px}
  .ops{display:flex;gap:8px}
  .ops button{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:11px 15px;box-shadow:0 6px 15px rgba(100,116,139,.13);font:inherit;font-size:12.5px;font-weight:700;color:#334155;cursor:pointer}
  .scenes{margin-left:auto;background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.95);border-radius:15px;padding:9px 15px;box-shadow:0 8px 20px rgba(100,116,139,.13)}
  .scenes .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12.5px;font-weight:800}
  .scenes .hd span{font-size:10.5px;color:#94a3b8;font-weight:600}
  .scenes .grid{display:flex;gap:9px}
  .scenes .it{text-align:center;cursor:pointer}
  .scenes .thumb{width:70px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .scenes .lb{font-size:10px;color:#475569;font-weight:600;margin-top:4px}

  /* ===== 详情浮卡 ===== */
  #detailMask{position:fixed;inset:0;z-index:75;background:rgba(30,43,58,.34);opacity:0;pointer-events:none;transition:.22s}
  #detailMask.show{opacity:1;pointer-events:auto}
  #detail{position:fixed;z-index:80;left:50%;top:50%;width:340px;max-width:92vw;max-height:86vh;overflow-y:auto;background:rgba(255,255,255,.98);border:1px solid #fff;border-radius:16px;box-shadow:0 18px 44px rgba(30,43,58,.3);padding:18px;opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.97);transition:.22s}
  #detail.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #detail .dh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  #detail .dh .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  #detail .dh .t{font-size:16px;font-weight:800}
  #detail .dh .s{font-size:11px;color:var(--sub)}
  #detail .close{margin-left:auto;border:none;background:#f1f5f9;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;color:#64748b}
  #detail p{font-size:12.5px;line-height:1.7;color:#334155}
  #detail .facts{margin:11px 0;display:flex;flex-direction:column;gap:7px}
  #detail .fact{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border-radius:10px;padding:8px 12px;font-size:12px}
  #detail .fact b{font-size:13px;font-weight:800}
  #detail .ev{font-size:10.5px;color:#94a3b8;line-height:1.6;border-top:1px dashed #e2e8f0;padding-top:9px}
  #detail .ev b{color:#64748b}

  /* ===== 手机 ===== */
  @media (max-width:900px){
    nav.top,.side.right{display:none}
    .burger{display:flex}
    .brand .tag{display:none}
    .brand h1{font-size:16px}
    .search{width:118px}
    #metrics{top:58px;gap:7px;left:8px;right:8px;transform:none;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
    #metrics::-webkit-scrollbar{display:none}
    .metric{width:140px;flex-shrink:0;height:56px}
    .metric .v{font-size:17px}
    #stage{width:100vw}
    .side.left{
      top:0;left:0;height:100%;width:238px;z-index:70;
      background:linear-gradient(165deg,#fbf7f0,#f0e9df);
      padding:70px 14px 18px;overflow-y:auto;
      transform:translateX(-100%);transition:transform .26s;
      box-shadow:0 0 44px rgba(30,43,58,.25);
    }
    .side.left.open{transform:translateX(0)}
    .side.left .card.scen{display:block}
    .plate .chip{padding:5px 6px 5px 8px;gap:5px}
    .plate .ic{width:20px;height:20px}
    .plate .tt{font-size:11px}
    .plate .ss{display:none}
    .plate .badge{font-size:9px;padding:1px 5px}
    .plate .core{padding:5px 12px}.plate .core .tt{font-size:12px}.plate .core .ss{font-size:9px}
    footer{height:auto;flex-wrap:wrap;gap:8px;padding:8px 10px}
    .go{padding:11px 15px;gap:10px}.go .play{width:32px;height:32px}.go .t{font-size:13px}.go .s{display:none}
    .ops{order:3}
    .ops button{padding:8px 11px;font-size:11px}
    .scenes{margin-left:0;order:2;width:100%}
    .scenes .thumb{width:56px;height:36px}
    #detail{width:calc(100vw - 24px)}
  }
</style>
</head>
<body>
<div id="app">
  <div class="overlay" id="overlay"></div>

  <!-- 顶部 -->
  <header>
    <button class="burger" id="burger" aria-label="菜单"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e2b3a" stroke-width="2.2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#1e2b3a"/><circle cx="20" cy="20" r="18" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity=".7"/><circle cx="20" cy="11" r="3" fill="#38bdf8"/><circle cx="12" cy="25" r="2.4" fill="#7dd3fc"/><circle cx="28" cy="25" r="2.4" fill="#7dd3fc"/><line x1="20" y1="11" x2="12" y2="25" stroke="#bae6fd" stroke-width="1"/><line x1="20" y1="11" x2="28" y2="25" stroke="#bae6fd" stroke-width="1"/><line x1="12" y1="25" x2="28" y2="25" stroke="#bae6fd" stroke-width="1"/></svg>
      <div><h1>惠城 · 全息版</h1><div class="tag">看见城市 · 理解服务 · 预见未来</div></div>
    </div>
    <nav class="top" id="topnav">
      <button data-id="all" class="active">全景</button>
      <button data-id="tech">产业</button>
      <button data-id="consume">消费</button>
      <button data-id="service">服务</button>
      <button data-id="culture">文旅</button>
      <button data-id="living">人居</button>
      <button data-id="transit">交通</button>
    </nav>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input placeholder="搜索企业、去处或事件…">
    </div>
  </header>

  <!-- 指标卡 -->
  <div id="metrics">
    <div class="metric"><div class="k">GDP（亿元）</div><div class="v">1203.33 <small class="up">+4.3%</small></div></div>
    <div class="metric"><div class="k">规上工业总产值（亿元）</div><div class="v">937.92 <small class="up">+9.6%</small></div></div>
    <div class="metric"><div class="k">社消零（亿元）</div><div class="v">805.68 <small class="up">+3.7%</small></div></div>
    <div class="metric"><div class="k">外贸进出口（亿元）</div><div class="v">383.60 <small class="up">+7.1%</small></div></div>
    <div class="metric"><div class="k">人均可支配（元）</div><div class="v">63776 <small class="up">+4.5%</small></div></div>
  </div>

  <!-- 沙盘 -->
  <div id="stageWrap">
    <div id="stage">
      <img class="base" id="baseimg" alt="惠城全息关系沙盘" src="https://aka.doubaocdn.com/s/XA3U7fpeoj">

      <button class="plate" data-id="tech" style="left:18%;top:30%">
        <span class="chip"><span class="ic" style="background:#2563eb"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg></span>
        <span><span class="tt">高新产业</span><span class="ss">电子信息·装备</span></span><span class="badge" style="background:#2563eb">0.82</span></span>
      </button>

      <button class="plate" data-id="consume" style="left:50%;top:17%">
        <span class="chip"><span class="ic" style="background:#ea580c"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M3 9l2-4h14l2 4M4 9v10h16V9M9 13h6"/></svg></span>
        <span><span class="tt">城市消费</span><span class="ss">商圈·夜市</span></span><span class="badge" style="background:#ea580c">0.78</span></span>
      </button>

      <button class="plate" data-id="service" style="left:82%;top:30%">
        <span class="chip"><span class="ic" style="background:#0d9488"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M3 21h18M5 21V8l5-3v16M14 21V11l5 3v7"/></svg></span>
        <span><span class="tt">城市服务</span><span class="ss">金融·公服</span></span><span class="badge" style="background:#0d9488">0.75</span></span>
      </button>

      <button class="plate" data-id="transit" style="left:82%;top:70%">
        <span class="chip"><span class="ic" style="background:#dc2626"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M2 7h3l2.5 7.5h9L20 10h2"/></svg></span>
        <span><span class="tt">交通枢纽</span><span class="ss">高铁·桥梁</span></span><span class="badge" style="background:#dc2626">0.70</span></span>
      </button>

      <button class="plate" data-id="culture" style="left:50%;top:83%">
        <span class="chip"><span class="ic" style="background:#7c3aed"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M3 20l5-8 4 5 3-4 6 7z"/><circle cx="17" cy="6" r="2"/></svg></span>
        <span><span class="tt">文旅生态</span><span class="ss">西湖·山水</span></span><span class="badge" style="background:#7c3aed">0.66</span></span>
      </button>

      <button class="plate" data-id="living" style="left:18%;top:70%">
        <span class="chip"><span class="ic" style="background:#16a34a"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg></span>
        <span><span class="tt">城市人居</span><span class="ss">居住·社区</span></span><span class="badge" style="background:#16a34a">0.63</span></span>
      </button>

      <button class="plate" data-id="all" style="left:50%;top:48%">
        <span class="core"><span class="tt">惠城</span><span class="ss">城市运行核心</span></span>
      </button>
    </div>
  </div>

  <!-- 左栏 -->
  <div class="side left">
    <div class="card allhc" id="allhc">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1e2b3a" stroke-width="2"><circle cx="7" cy="7" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="17" r="2.5"/><path d="M9 8l2 7M16 8l-2.5 7M9 7h6.5"/></svg>
      整个惠城
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1e2b3a" stroke-width="2.5" style="margin-left:auto"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="card menu" id="leftmenu">
      <button data-id="tech"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg>高新产业</button>
      <button data-id="consume"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l2-4h14l2 4M4 9v10h16V9M9 13h6"/></svg>城市消费</button>
      <button data-id="service"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l5-3v16M14 21V11l5 3v7"/></svg>城市服务</button>
      <button data-id="culture"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l5-8 4 5 3-4 6 7z"/></svg>文旅生态</button>
      <button data-id="living"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>城市人居</button>
      <button data-id="transit"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M2 7h3l2.5 7.5h9L20 10h2"/></svg>交通外联</button>
    </div>
    <div class="card scen" id="scen">
      <h3>情景模式</h3>
      <button class="active" data-s="base"><span class="radio"></span>基准情景</button>
      <button data-s="delay"><span class="radio"></span>重大项目延期</button>
      <button data-s="commute"><span class="radio"></span>通勤承载压力</button>
      <button data-s="weak"><span class="radio"></span>城市消费走弱</button>
      <button data-s="both"><span class="radio"></span>多重冲击组合</button>
    </div>
  </div>

  <!-- 右栏 -->
  <div class="side right">
    <div class="card legend">
      <h3>关系强度</h3>
      <div class="row"><span class="ln" style="border-top:3px solid #2563eb"></span>很强</div>
      <div class="row"><span class="ln" style="border-top:3px solid #f59e0b"></span>较强</div>
      <div class="row"><span class="ln" style="border-top:2px solid #cbd5e1"></span>一般</div>
      <div class="row"><span class="ln" style="border-top:2px dashed #94a3b8"></span>较弱</div>
      <div class="toggle-row"><span>显示标签</span><span class="switch" id="swLabel"><i></i></span></div>
      <div class="toggle-row"><span>聚焦模式</span><span class="switch off" id="swFocus"><i></i></span></div>
    </div>
  </div>

  <!-- 底部 -->
  <footer>
    <button class="go" id="go">
      <span class="play"><svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>
      <span><span class="t">开始探索</span><span class="s">进入惠城的关系世界</span></span>
    </button>
    <div class="ops">
      <button><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="2.5"/><circle cx="18" cy="7" r="2.5"/><path d="M7 9.5v4M18 9.5v4M7 17h.01M18 17h.01"/></svg>关系追踪</button>
      <button><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 16l3-4 3 2 4-6"/></svg>情景模拟</button>
      <button><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/></svg>前后对比</button>
    </div>
    <div class="scenes">
      <div class="hd">典型场景<span>更多情景 ›</span></div>
      <div class="grid">
        <div class="it" data-s="base"><div class="thumb" style="background:linear-gradient(135deg,#bae6fd,#7dd3fc)"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1e2b3a"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="7" r="2"/><circle cx="19" cy="7" r="2"/><path d="M7 8l3 3M17 8l-3 3"/></svg></div><div class="lb">基准情景</div></div>
        <div class="it" data-s="delay"><div class="thumb" style="background:linear-gradient(135deg,#fde68a,#fcd34d)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="2"><path d="M3 18l6-9 4 5 3-4 5 8"/></svg></div><div class="lb">项目延期</div></div>
        <div class="it" data-s="commute"><div class="thumb" style="background:linear-gradient(135deg,#ddd6fe,#c4b5fd)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5b21b6" stroke-width="2"><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M2 7h3l2.5 7.5h9L20 10h2"/></svg></div><div class="lb">通勤压力</div></div>
        <div class="it" data-s="weak"><div class="thumb" style="background:linear-gradient(135deg,#fecaca,#fca5a5)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#991b1b" stroke-width="2"><path d="M3 9l2-4h14l2 4M4 9v10h16V9M9 13h6"/></svg></div><div class="lb">消费走弱</div></div>
      </div>
    </div>
  </footer>

  <!-- 详情模态遮罩 -->
  <div id="detailMask"></div>
  <!-- 详情浮卡 -->
  <div id="detail">
    <div class="dh">
      <span class="ic" id="d_ic"></span>
      <span><span class="t" id="d_t"></span><span class="s" id="d_s"></span></span>
      <button class="close" id="d_close">×</button>
    </div>
    <p id="d_p"></p>
    <div class="facts" id="d_facts"></div>
    <div class="ev" id="d_ev"></div>
  </div>

</div>

<script>
const PLATES = {
  tech:{
    t:'高新产业', s:'惠城高新区 · 核心引擎', color:'#2563eb',
    icon:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
    p:'惠城高新区是惠州首家省级高新区，按“1 核 4 组团”布局，由东江湾核心园区与三栋、马安、横沥、汝湖四个联动组团构成，重点发展新一代电子信息、智能装备、新能源新材料、生物医药及生产性服务业。',
    facts:[['高新区总规划面积','67.7 km²'],['2025 高新区产值','632.7 亿元'],['2026 目标产值','800 亿元'],['全区规上工业总产值','937.92 亿、+9.6%']],
    ev:'<b>口径：</b>园区面积、产值与“1 核 4 组团”来自惠城区政府公开资料；2026 年 800 亿为园区年度目标，非政府刚性预测。'
  },
  consume:{
    t:'城市消费', s:'商圈 · 夜市 · 烟火气', color:'#ea580c',
    icon:'<path d="M3 9l2-4h14l2 4M4 9v10h16V9M9 13h6"/>',
    p:'惠城是惠州消费中心，拥有华贸天地、水东街、西湖商圈等核心去处。但作为中心城区，也面临“消费留不住”的结构性问题：高端消费流向深圳、日常消费部分流向东莞、线上订单外流。',
    facts:[['社会消费品零售总额','805.68 亿元'],['社消零增速','+3.7%'],['热门去处','水东街·华贸·西湖'],['消费结构','服务消费为主']],
    ev:'<b>口径：</b>社消零总额及增速来自 2025 年统计公报；“消费外流”为公开资料与调研基础上的结构性判断，具体外流规模为区间估算，非实测值。'
  },
  service:{
    t:'城市服务', s:'金融 · 公服 · 楼宇总部', color:'#0d9488',
    icon:'<path d="M3 21h18M5 21V8l5-3v16M14 21V11l5 3v7"/>',
    p:'惠城第三产业占比达 69%，是全市行政、金融、教育、医疗与商务服务中心。江北 CBD 集聚楼宇总部与生产性服务业，是中心城区最核心的功能。',
    facts:[['第三产业占比','69.0%'],['三产结构','3.4:27.6:69.0'],['核心载体','江北 CBD'],['服务内容','金融·教育·医疗·政务']],
    ev:'<b>口径：</b>三次产业结构来自 2025 年统计公报；功能分区来自公开规划资料。'
  },
  transit:{
    t:'交通枢纽', s:'高铁 · 桥梁 · 融深融湾', color:'#dc2626',
    icon:'<circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M2 7h3l2.5 7.5h9L20 10h2"/>',
    p:'惠城是惠州综合交通枢纽，高铁惠州北站、过江通道与高速路网支撑城市运行，也是融深融湾、对接深圳东莞的关键。',
    facts:[['高铁枢纽','惠州北站（小金口）'],['对外方向','深圳·东莞·广州'],['城市骨架','过江通道·高速'],['定位','融深融湾门户']],
    ev:'<b>口径：</b>交通设施来自公开规划与交通资料；本页不展示具体通勤人数，跨界流动为区间估算（见产业风洞）。'
  },
  culture:{
    t:'文旅生态', s:'西湖 · 山水 · 休闲', color:'#7c3aed',
    icon:'<path d="M3 20l5-8 4 5 3-4 6 7z"/><circle cx="17" cy="6" r="2"/>',
    p:'惠城拥有惠州西湖（5A）、红花湖绿道、祝屋巷、野岛文化社区等文旅休闲资源，是市民日常休闲与外地游客的主要去处。',
    facts:[['核心景区','惠州西湖 5A'],['城市绿道','红花湖'],['文创街区','祝屋巷·野岛'],['功能','休闲·夜游·运动']],
    ev:'<b>口径：</b>景区与去处来自公开资料；各去处实时人气热度见 life.json 与风向标页面。'
  },
  living:{
    t:'城市人居', s:'居住 · 社区 · 城市更新', color:'#16a34a',
    icon:'<path d="M3 12l9-8 9 8M5 10v10h14V10"/>',
    p:'惠城常住人口 159.78 万，居住片区沿江北、桥西、水口、马安、三栋等组团分布，城市更新与社区生活是中心城区的基础功能。',
    facts:[['常住人口','159.78 万人'],['人均可支配收入','63776 元'],['收入增速','+4.5%'],['主要片区','江北·桥西·水口·马安']],
    ev:'<b>口径：</b>人口、居民收入及增速来自 2025 年统计公报。'
  }
};

const stage=document.getElementById('stage');
const detail=document.getElementById('detail');
let current=null;

function showDetail(id){
  const d=PLATES[id]; if(!d) return;
  document.getElementById('d_ic').style.background=d.color;
  document.getElementById('d_ic').innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff">'+d.icon+'</svg>';
  document.getElementById('d_t').textContent=d.t;
  document.getElementById('d_s').textContent=d.s;
  document.getElementById('d_p').textContent=d.p;
  document.getElementById('d_facts').innerHTML=d.facts.map(f=>
    '<div class="fact"><span>'+f[0]+'</span><b>'+f[1]+'</b></div>').join('');
  document.getElementById('d_ev').innerHTML=d.ev;
  detail.classList.add('show');
  document.getElementById('detailMask').classList.add('show');
}
function hideDetail(){
  detail.classList.remove('show');
  document.getElementById('detailMask').classList.remove('show');
}

function focus(id){
  current=id;
  document.querySelectorAll('.plate').forEach(p=>{
    p.classList.toggle('focus', p.dataset.id===id);
  });
  stage.classList.toggle('dim', !!id && id!=='all');
  // 导航高亮
  document.querySelectorAll('#topnav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  document.querySelectorAll('#leftmenu button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  if(id && id!=='all' && PLATES[id]){
    showDetail(id);
  } else hideDetail();
}
function reset(){
  current=null;
  document.querySelectorAll('.plate').forEach(p=>p.classList.remove('focus'));
  stage.classList.remove('dim');
  document.querySelectorAll('#topnav button').forEach(b=>b.classList.toggle('active',b.dataset.id==='all'));
  document.querySelectorAll('#leftmenu button').forEach(b=>b.classList.remove('active'));
  hideDetail();
}

document.querySelectorAll('.plate').forEach(p=>{
  p.addEventListener('click',e=>{
    e.stopPropagation();
    const id=p.dataset.id;
    if(id==='all'){reset();return;}
    focus(current===id?null:id);
  });
});
document.querySelectorAll('#topnav button, #leftmenu button').forEach(b=>{
  b.addEventListener('click',()=>{const id=b.dataset.id; if(id==='all')reset(); else focus(id);});
});
document.getElementById('allhc').addEventListener('click',reset);
document.getElementById('d_close').addEventListener('click',()=>{hideDetail();reset();});
document.getElementById('detailMask').addEventListener('click',()=>{hideDetail();reset();});
document.getElementById('go').addEventListener('click',()=>{
  if(!current) focus('tech');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideDetail();reset();}});
document.getElementById('stageWrap').addEventListener('click',e=>{
  if(e.target.closest('.plate')) return; reset();
});

// 情景模式（仅切换高亮，不伪造数值；真实计算在产业风洞）
document.querySelectorAll('#scen button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#scen button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
});
document.querySelectorAll('.scenes .it').forEach(it=>{
  it.addEventListener('click',()=>{
    const s=it.dataset.s;
    const map={base:'base',delay:'delay',commute:'commute',weak:'weak'};
    const btn=document.querySelector('#scen button[data-s="'+map[s]+'"]');
    if(btn) btn.click();
  });
});

// 标签/聚焦开关
document.getElementById('swLabel').addEventListener('click',function(){
  const on=!this.classList.contains('off');
  this.classList.toggle('off',on);
  document.querySelectorAll('.plate .chip, .plate .core').forEach(c=>{
    c.style.visibility=on?'hidden':'visible';
  });
});
document.getElementById('swFocus').addEventListener('click',function(){
  this.classList.toggle('off');
});

// 手机端汉堡抽屉
const sideLeft=document.querySelector('.side.left');
const overlay=document.getElementById('overlay');
function openDrawer(){sideLeft.classList.add('open');overlay.classList.add('show');}
function closeDrawer(){sideLeft.classList.remove('open');overlay.classList.remove('show');}
document.getElementById('burger').addEventListener('click',openDrawer);
overlay.addEventListener('click',closeDrawer);
document.querySelectorAll('#leftmenu button').forEach(b=>{
  b.addEventListener('click',()=>{if(innerWidth<=900) closeDrawer();});
});

// 鼠标视差（轻微，营造 3D 深度）
const baseimg=document.getElementById('baseimg');
let raf=null;
document.addEventListener('mousemove',e=>{
  if(innerWidth<900) return;
  const dx=(e.clientX/innerWidth-.5), dy=(e.clientY/innerHeight-.5);
  if(raf) cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{
    baseimg.style.transform='translate('+(-dx*10)+'px,'+(-dy*7)+'px) scale(1.02)';
  });
});
</script>
</body>
</html>
