<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看见惠城 · 全息关系版</title>
<meta name="description" content="用关系网络看惠城：产业、企业、投资、交通、文旅、人居与区域协作之间的有证据关系及其变化；已证实/推断/假设分层呈现，变化由动画与高亮凸显。">
<style>
  :root{
    --ink:#1e2b3a; --sub:#64748b; --line:#e2e8f0;
    --blue:#2563eb; --cyan:#0891b2; --teal:#0d9488;
    --red:#dc2626; --purple:#7c3aed; --green:#16a34a; --amber:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
    color:var(--ink); overflow:hidden;
    background:radial-gradient(1100px 680px at 50% 30%, #f8fafc 0%, #f1f5f9 55%, #e9eef4 100%);
  }
  #app{position:relative;width:100%;height:100%}

  /* 顶部 */
  header{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 20px;z-index:30;gap:10px}
  .burger{display:none;align-items:center;justify-content:center;width:38px;height:38px;border:none;background:rgba(255,255,255,.8);border-radius:10px;cursor:pointer;flex-shrink:0}
  .overlay{display:none;position:fixed;inset:0;background:rgba(30,43,58,.35);z-index:65}
  .overlay.show{display:block}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand .logo{width:34px;height:34px}
  .brand h1{font-size:17px;font-weight:800;letter-spacing:.5px}
  .brand .tag{font-size:10px;color:var(--sub);letter-spacing:1.5px}
  nav.top{display:flex;gap:2px;margin-left:12px}
  nav.top button{border:none;background:transparent;cursor:pointer;font:inherit;color:#475569;font-size:13px;font-weight:600;padding:7px 12px;border-radius:18px;transition:.16s}
  nav.top button:hover{background:rgba(255,255,255,.8)}
  nav.top button.active{background:var(--ink);color:#fff;box-shadow:0 5px 14px rgba(30,43,58,.22)}
  .search{margin-left:auto;display:flex;align-items:center;width:220px;height:34px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:18px;padding:0 13px;gap:7px;flex-shrink:0}
  .search input{border:none;background:transparent;outline:none;font:inherit;font-size:12.5px;width:100%}

  /* 指标条 */
  #metrics{position:absolute;top:60px;left:50%;transform:translateX(-50%);display:flex;gap:9px;z-index:25}
  .metric{width:150px;height:56px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);border-radius:12px;box-shadow:0 6px 16px rgba(100,116,139,.12);padding:8px 12px}
  .metric .k{font-size:10.5px;color:var(--sub);white-space:nowrap}
  .metric .v{font-size:18px;font-weight:800;line-height:1.1;margin-top:2px}
  .metric .v small{font-size:10.5px;font-weight:700;margin-left:2px}
  .up{color:#16a34a}.down{color:#dc2626}

  /* 网络舞台 */
  #stageWrap{position:absolute;inset:0;z-index:5}
  #net{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
  #net.drag{cursor:grabbing}
  #netHint{position:absolute;top:124px;left:50%;transform:translateX(-50%);font-size:11px;color:#94a3b8;background:rgba(255,255,255,.7);padding:4px 12px;border-radius:12px;pointer-events:none;z-index:6}

  /* 左栏 */
  .side{position:absolute;z-index:24}
  .side.left{top:128px;left:16px;width:158px}
  .side.right{top:124px;right:16px;bottom:118px;width:288px;display:flex;flex-direction:column}
  .card{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);border-radius:13px;box-shadow:0 6px 16px rgba(100,116,139,.13);padding:11px}
  .card + .card{margin-top:9px}
  .card h3{font-size:12px;font-weight:800;margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .card h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
  .filter button{width:100%;border:none;background:none;cursor:pointer;font:inherit;display:flex;align-items:center;gap:8px;color:#475569;font-size:11.5px;font-weight:600;padding:6px 6px;border-radius:8px;text-align:left}
  .filter button:hover{background:rgba(255,255,255,.8)}
  .filter button.active{color:var(--ink);background:rgba(37,99,235,.08);font-weight:800}
  .filter button .swatch{width:14px;height:14px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .legend .row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:#475569;font-weight:600}
  .legend .ln{width:26px;height:0}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#475569;font-weight:600;margin-top:8px}
  .switch{width:32px;height:18px;border-radius:10px;background:var(--ink);position:relative;cursor:pointer;flex-shrink:0}
  .switch i{position:absolute;right:2px;top:2px;width:14px;height:14px;background:#fff;border-radius:50%}
  .switch.off{background:#cbd5e1}.switch.off i{right:auto;left:2px}

  /* 右侧 AI 情报区 */
  .intel-head{display:flex;align-items:center;gap:9px;padding:11px 13px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.95);border-radius:13px 13px 0 0;box-shadow:0 6px 16px rgba(100,116,139,.13)}
  .ai-avatar{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#1e2b3a,#334155);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .intel-head .t{font-size:13px;font-weight:800}
  .intel-head .s{font-size:10px;color:#16a34a;font-weight:700;display:flex;align-items:center;gap:4px}
  .intel-head .s .pulse-dot{width:6px;height:6px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pd 1.8s infinite}
  @keyframes pd{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
  #intelBody{flex:1;overflow-y:auto;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-top:none;border-radius:0 0 13px 13px;box-shadow:0 6px 16px rgba(100,116,139,.13);padding:12px;display:flex;flex-direction:column;gap:13px}
  #intelBody::-webkit-scrollbar{width:5px}#intelBody::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
  .msg{display:flex;gap:8px;cursor:pointer}
  .msg .ma{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#1e2b3a,#334155);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
  .msg .bubble{background:#f1f5f9;border-radius:3px 12px 12px 12px;padding:9px 11px;flex:1;transition:.16s;border:1px solid transparent}
  .msg:hover .bubble{background:#e8eef5;border-color:#dbe4ee}
  .msg .bubble .tag{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:9px;margin-bottom:6px}
  .msg .bubble .h{font-size:12px;font-weight:800;line-height:1.45}
  .msg .bubble .q{font-size:11px;color:#475569;line-height:1.6;margin-top:5px;padding-top:6px;border-top:1px dashed #d8e0ea}
  .msg .bubble .q b{color:var(--ink)}
  .msg .bubble .go-link{font-size:10.5px;color:var(--blue);font-weight:700;margin-top:6px;display:flex;align-items:center;gap:3px}

  /* 底部时间线 */
  footer{position:absolute;left:0;right:0;bottom:0;height:104px;z-index:30;padding:0 16px}
  .tl-wrap{height:100%;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);border-radius:13px;box-shadow:0 6px 16px rgba(100,116,139,.13);padding:10px 16px;display:flex;flex-direction:column}
  .tl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .tl-head .t{font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}
  .tl-head .t .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .tl-head .s{font-size:10px;color:var(--sub)}
  .tl-track{position:relative;flex:1;display:flex;align-items:center}
  .tl-line{position:absolute;left:0;right:0;top:50%;height:2px;background:#e2e8f0;transform:translateY(-50%)}
  .tl-node{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2}
  .tl-node .n{width:13px;height:13px;border-radius:50%;background:#fff;border:2.5px solid #94a3b8;transition:.16s}
  .tl-node:hover .n{transform:scale(1.25)}
  .tl-node .d{font-size:9.5px;color:var(--sub);font-weight:700;margin-top:5px;white-space:nowrap}
  .tl-node .l{font-size:10px;color:#334155;font-weight:700;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;position:absolute;bottom:24px}
  .tl-node.active .n{border-color:var(--blue);background:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.15)}
  .tl-node.new .n{border-color:var(--green);background:var(--green)}
  .tl-node.edge .n{border-color:var(--amber);background:var(--amber)}

  /* 浮卡 */
  #popMask{position:fixed;inset:0;z-index:70;background:rgba(30,43,58,.3);opacity:0;pointer-events:none;transition:.2s}
  #popMask.show{opacity:1;pointer-events:auto}
  #pop{position:fixed;z-index:75;left:50%;top:50%;width:340px;max-width:92vw;max-height:84vh;overflow-y:auto;background:rgba(255,255,255,.98);border:1px solid #fff;border-radius:16px;box-shadow:0 16px 40px rgba(30,43,58,.28);padding:17px;opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.97);transition:.2s}
  #pop.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #pop .ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  #pop .ph .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  #pop .ph .t{font-size:15px;font-weight:800}
  #pop .ph .s{font-size:10.5px;color:var(--sub)}
  #pop .close{margin-left:auto;border:none;background:#f1f5f9;width:27px;height:27px;border-radius:50%;cursor:pointer;font-size:14px;color:#64748b}
  #pop p{font-size:12px;line-height:1.7;color:#334155}
  #pop .grade-chip{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:9px;margin:8px 0}
  #pop .facts{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  #pop .fact{display:flex;justify-content:space-between;background:#f8fafc;border-radius:9px;padding:7px 11px;font-size:11.5px}
  #pop .fact b{font-size:12px;font-weight:800}
  #pop .src{font-size:10px;color:#94a3b8;line-height:1.6;border-top:1px dashed #e2e8f0;padding-top:9px;word-break:break-all}
  #pop .src a{color:var(--blue)}

  /* 移动端情报浮动按钮 + 抽屉 */
  #intelFab{display:none;position:fixed;right:14px;bottom:112px;z-index:60;align-items:center;gap:6px;background:var(--ink);color:#fff;border:none;border-radius:24px;padding:11px 16px;font:inherit;font-size:12px;font-weight:800;box-shadow:0 10px 24px rgba(30,43,58,.3);cursor:pointer}
  #intelFab .n{width:8px;height:8px;border-radius:50%;background:#4ade80}
  #intelClose{display:none;margin-left:auto;border:none;background:#f1f5f9;width:30px;height:30px;border-radius:50%;font-size:16px;color:#64748b;cursor:pointer}

  /* 手机 */
  @media (max-width:900px){
    nav.top{display:none}
    .side.right{display:flex;position:fixed;top:0;right:0;bottom:0;left:0;width:auto;margin:0;border-radius:0;z-index:80;background:#f8fafc;
      transform:translateX(100%);transition:transform .28s;pointer-events:auto}
    .side.right.open{transform:translateX(0)!important}
    .intel-head{border-radius:0}
    #intelBody{border-radius:0}
    #intelFab{display:flex}
    #intelClose{display:block}
    .burger{display:flex}
    .brand .tag{display:none}.brand h1{font-size:15px}
    .search{width:100px}
    #metrics{top:52px;left:8px;right:8px;transform:none;gap:6px;overflow-x:auto;padding-bottom:2px}
    #metrics::-webkit-scrollbar{display:none}
    .metric{width:132px;flex-shrink:0;height:52px}.metric .v{font-size:16px}
    #netHint{top:112px;font-size:10px}
    .side.left{top:0;left:0;height:100%;width:232px;z-index:70;background:linear-gradient(165deg,#f8fafc,#eef2f7);padding:64px 13px 16px;overflow-y:auto;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(30,43,58,.22)}
    .side.left.open{transform:translateX(0)}
    footer{height:96px;padding:0 8px}
    .tl-node .l{max-width:72px;font-size:9px}
    #pop{width:calc(100vw - 22px)}
  }
</style>
</head>
<body>
<div id="app">
  <div class="overlay" id="overlay"></div>

  <header>
    <button class="burger" id="burger" aria-label="菜单"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e2b3a" stroke-width="2.2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#1e2b3a"/><circle cx="20" cy="11" r="3" fill="#38bdf8"/><circle cx="12" cy="25" r="2.4" fill="#7dd3fc"/><circle cx="28" cy="25" r="2.4" fill="#7dd3fc"/><line x1="20" y1="11" x2="12" y2="25" stroke="#bae6fd" stroke-width="1"/><line x1="20" y1="11" x2="28" y2="25" stroke="#bae6fd" stroke-width="1"/><line x1="12" y1="25" x2="28" y2="25" stroke="#bae6fd" stroke-width="1"/></svg>
      <div><h1>惠城 · 全息关系版</h1><div class="tag">用关系看世界 · 让变化被看见</div></div>
    </div>
    <nav class="top" id="topnav">
      <button data-f="all" class="active">全景</button>
      <button data-f="industry">产业</button>
      <button data-f="investment">投资</button>
      <button data-f="regional">区域</button>
      <button data-f="tourism_consumption">文旅</button>
      <button data-f="transport">交通</button>
    </nav>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="searchInput" placeholder="搜索企业、集群或事件…">
    </div>
  </header>

  <div id="metrics">
    <div class="metric"><div class="k">GDP（亿元）</div><div class="v">1203.33 <small class="up">+4.3%</small></div></div>
    <div class="metric"><div class="k">规上工业总产值（亿元）</div><div class="v">937.92 <small class="up">+9.6%</small></div></div>
    <div class="metric"><div class="k">社消零（亿元）</div><div class="v">805.68 <small class="up">+3.7%</small></div></div>
    <div class="metric"><div class="k">外贸进出口（亿元）</div><div class="v">383.60 <small class="up">+7.1%</small></div></div>
    <div class="metric"><div class="k">常住人口（万人）</div><div class="v">159.78</div></div>
  </div>

  <div id="stageWrap">
    <canvas id="net"></canvas>
    <div id="netHint">拖拽节点可重新布局 · 点击节点看关系 · 点击连线看证据</div>
  </div>

  <!-- 左栏 -->
  <div class="side left">
    <div class="card filter" id="filter">
      <h3><span class="dot"></span>关系图层</h3>
      <button data-f="all" class="active"><span class="swatch" style="background:#1e2b3a"></span>全部关系</button>
      <button data-f="supply_chain"><span class="swatch" style="background:#2563eb"></span>供应链配套</button>
      <button data-f="investment"><span class="swatch" style="background:#0891b2"></span>投资建设</button>
      <button data-f="regional"><span class="swatch" style="background:#7c3aed"></span>区域协作</button>
      <button data-f="transport"><span class="swatch" style="background:#dc2626"></span>交通物流</button>
      <button data-f="tourism_consumption"><span class="swatch" style="background:#d97706"></span>消费文旅</button>
    </div>
    <div class="card legend">
      <h3><span class="dot" style="background:#16a34a"></span>证据分级</h3>
      <div class="row"><span class="ln" style="border-top:2.5px solid #1e2b3a"></span>A 已证实</div>
      <div class="row"><span class="ln" style="border-top:2.5px dashed #64748b"></span>B 证据推断</div>
      <div class="row"><span class="ln" style="border-top:2.5px dotted #94a3b8"></span>C 待验证</div>
      <div class="toggle-row"><span>显示连线标签</span><span class="switch" id="swLab"><i></i></span></div>
      <div class="toggle-row"><span>只看近期变化</span><span class="switch off" id="swChg"><i></i></span></div>
    </div>
  </div>

  <!-- 右栏 AI 情报 -->
  <div class="side right">
    <div class="intel-head">
      <span class="ai-avatar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2"><path d="M12 2a7 7 0 0 1 7 7c0 3-2 4.5-2 7H7c0-2.5-2-4-2-7a7 7 0 0 1 7-7z"/><path d="M9 19h6M10 22h4"/></svg></span>
      <div>
        <div class="t">惠城区产业关系情报</div>
        <div class="s"><span class="pulse-dot"></span>今年重大变化 · 值得讨论</div>
      </div>
      <button id="intelClose" aria-label="关闭">×</button>
    </div>
    <div id="intelBody"></div>
  </div>

  <!-- 底部时间线 -->
  <footer>
    <div class="tl-wrap">
      <div class="tl-head">
        <div class="t"><span class="dot"></span>关系变化时间线 · 2026</div>
        <div class="s">只收录会改变网络结构的事件 · 签约≠投产</div>
      </div>
      <div class="tl-track" id="tlTrack"><div class="tl-line"></div></div>
    </div>
  </footer>

  <div id="popMask"></div>

  <!-- 移动端情报浮动按钮 -->
  <button id="intelFab"><span class="n"></span>产业关系情报</button>
  <div id="pop">
    <div class="ph">
      <span class="ic" id="p_ic"></span>
      <span><span class="t" id="p_t"></span><span class="s" id="p_s"></span></span>
      <button class="close" id="p_close">×</button>
    </div>
    <div id="p_body"></div>
  </div>
</div>

<script>
/* ================= 数据：优先 fetch 三件套，失败用内嵌 fallback ================= */
const DATA_BASE = "data/";
let GRAPH = null;

/* ---- 内嵌 fallback（与 data/relationship-*.json 同源，保证 file:// 可看）---- */
const FALLBACK = {
  nodes:[
    {node_id:"hc",name:"惠城",node_type:"core",layer:"城市核心",town:"主城区",description:"惠州市中心城区，行政/商务/服务核心",stat:"GDP 1203.33亿/+4.3%·常住159.78万",node_status:"active",change_status:"无显著变化",evidence_grade:"A",color:"#1e2b3a",source_ids:["S001"]},
    {node_id:"gxq",name:"惠城高新区",node_type:"anchor",layer:"产业引擎",town:"水口/马安/三栋",description:"省级高新区·1核4组团",stat:"2025产值632.7亿→2026目标800亿",node_status:"active",change_status:"增强",evidence_grade:"A",color:"#2563eb",source_ids:["S001","S004"]},
    {node_id:"dz",name:"电子信息集群",node_type:"cluster",layer:"三大集群",town:"水口/马安",description:"规上工业总产值主体",stat:"胜宏/润众/沃尔核材集聚",node_status:"active",change_status:"增强",evidence_grade:"A",color:"#2563eb",source_ids:["S001","S010"]},
    {node_id:"xcl",name:"新材料集群",node_type:"cluster",layer:"三大集群",town:"水口/小金口",description:"新材料产业集聚区",stat:"金澜/天濠落子",node_status:"active",change_status:"增强",evidence_grade:"A",color:"#0891b2",source_ids:["S006","S007"]},

/* ================= 网络引擎 ================= */
const canvas = document.getElementById("net");
const ctx = canvas.getContext("2d");
let W=0,H=0,DPR=1;
let nodes=[], edges=[], changes=[], sourcesMap={};
let activeFilter="all", showLab=true, onlyChg=false;
let selectedNode=null, selectedEdge=null, hoverNode=null;
let dragNode=null, dragMoved=false;
let mouse={x:0,y:0};
let startTime = performance.now();
let UI=1; // 小屏布局缩放因子

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const r = canvas.getBoundingClientRect();
  W=r.width; H=r.height;
  canvas.width=W*DPR; canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  UI = W<520 ? Math.max(0.66, W/560) : 1;
}
window.addEventListener("resize",resize);

/* 初始位置：按 layer 分组，core 居中，卫星由弹簧自然抱团 */
function initPositions(){
  const cx=W/2, cy=H/2+6;
  const ang = {gxq:-Math.PI*0.72, dz:-Math.PI*0.42, xcl:-Math.PI, ai:-Math.PI*0.15,
               fw:-Math.PI*0.55, jt:Math.PI*0.12, wh:Math.PI*0.55, rj:Math.PI*0.9};
  nodes.forEach(n=>{
    n.vx=0; n.vy=0; n.fixed=false; n.spawn = n.change_status==="新增" ? 0 : 1;
    if(n.node_type==="core"){ n.x=cx; n.y=cy; n.fixed=true; n.spawn=1; }
    else if(n.node_type==="external"){
      n.x = n.node_id==="sz" ? W-90 : W-150;
      n.y = n.node_id==="sz" ? H*0.34 : H*0.62;
      n.fixed=true;
    }
    else if(n.node_type==="anchor"){
      const a=ang[n.node_id] ?? -Math.PI*0.7;
      n.x=cx+Math.cos(a)*200; n.y=cy+Math.sin(a)*160;
    }
    else if(n.node_type==="cluster"){
      const a=ang[n.node_id] ?? Math.random()*Math.PI*2;
      n.x=cx+Math.cos(a)*150+ (Math.random()-.5)*40;
      n.y=cy+Math.sin(a)*120+ (Math.random()-.5)*40;
    }
    else { // enterprise 卫星：先放锚点附近随机
      n.x=cx+(Math.random()-.5)*260; n.y=cy+(Math.random()-.5)*220;
    }
  });
}

function nodeRadius(n){
  let r;
  if(n.node_type==="core") r=30;
  else if(n.node_type==="anchor") r=24;
  else if(n.node_type==="cluster") r=19;
  else if(n.node_type==="external") r=18;
  else r=12; // enterprise
  return r*UI;
}

function edgeVisible(e){
  if(activeFilter!=="all" && e.relation_type!==activeFilter) return false;
  if(onlyChg && e.change_status==="无显著变化") return false;
  return true;
}
function nodeDimmed(n){
  if(!selectedNode) return false;
  // 与选中节点相连才亮
  return !edges.some(e=>edgeVisible(e) &&
    ((e.source_node_id===selectedNode.node_id&&e.target_node_id===n.node_id)||
     (e.target_node_id===selectedNode.node_id&&e.source_node_id===n.node_id)))
    && n.node_id!==selectedNode.node_id;
}

/* 力模拟 */
function simulate(){
  const REP = 5200*UI*UI, SPRING=0.012, DAMP=0.86, CENTER=0.0025;
  // 斥力
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y;
      let d2=dx*dx+dy*dy; if(d2<1) d2=1;
      const d=Math.sqrt(d2);
      const f=REP/d2;
      const fx=f*dx/d, fy=f*dy/d;
      if(!a.fixed){a.vx+=fx;a.vy+=fy;}
      if(!b.fixed){b.vx-=fx;b.vy-=fy;}
    }
  }
  // 弹簧
  edges.forEach(e=>{
    if(!edgeVisible(e)) return;
    const a=nodes.find(n=>n.node_id===e.source_node_id);
    const b=nodes.find(n=>n.node_id===e.target_node_id);
    if(!a||!b) return;
    // 卫星到锚点目标距离短（抱团）
    const target = (b.node_type==="enterprise")? 58*UI : 120*UI;
    let dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-target)*SPRING;
    const fx=f*dx/d, fy=f*dy/d;
    if(!a.fixed){a.vx+=fx;a.vy+=fy;}
    if(!b.fixed){b.vx-=fx;b.vy-=fy;}
  });
  // 归位 + 阻尼
  const cx=W/2, cy=H/2+6;
  nodes.forEach(n=>{
    if(n.fixed){ n.vx=0; n.vy=0; return; }
    n.vx+=(cx-n.x)*CENTER; n.vy+=(cy-n.y)*CENTER;
    n.vx*=DAMP; n.vy*=DAMP;
    n.x+=n.vx; n.y+=n.vy;
    // 边界
    const r=nodeRadius(n);
    n.x=Math.max(r+8,Math.min(W-r-8,n.x));
    n.y=Math.max(r+70,Math.min(H-r-100,n.y));
    // 新节点 spawn
    if(n.spawn<1) n.spawn=Math.min(1,n.spawn+0.03);
  });
}

function edgeLabel(e){
  if(e.metric){
    const v=e.metric.metric_value;
    const u=e.metric.metric_unit==="亿元"?"亿":e.metric.metric_unit;
    return (v<1? v.toFixed(2): v)+u;
  }
  const map={supply_chain:"配套",investment:"投资",regional:"协作",transport:"通道",tourism_consumption:"文旅"};
  return map[e.relation_type]||"";
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const t=performance.now();

  // 边
  edges.forEach(e=>{
    if(!edgeVisible(e)) return;
    const a=nodes.find(n=>n.node_id===e.source_node_id);
    const b=nodes.find(n=>n.node_id===e.target_node_id);
    if(!a||!b) return;
    const dim = nodeDimmed(a)||nodeDimmed(b);
    ctx.save();
    ctx.globalAlpha = dim?0.12:0.9;
    let col = a.color||"#64748b";
    if(e.change_status==="断裂") col="#dc2626";
    ctx.strokeStyle=col; ctx.lineWidth = e.evidence_grade==="A"?2:1.6;
    if(e.evidence_grade==="B") ctx.setLineDash([7,6]);
    if(e.evidence_grade==="C") ctx.setLineDash([2,5]);
    // 新增边：生长动画
    let grow=1;
    if(e.change_status==="新增"){
      grow = Math.min(1, (t-startTime)/1400 + (parseInt(e.edge_id.slice(1))*0.04));
    }
    const ex=a.x+(b.x-a.x)*grow, ey=a.y+(b.y-a.y)*grow;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.setLineDash([]);

    // 变化边的流动点（代表关系活跃/资源流动）
    if(e.change_status==="新增"||e.change_status==="增强"){
      const phase=((t/1400)+parseInt(e.edge_id.slice(1))*0.13)%1;
      const px=a.x+(b.x-a.x)*phase, py=a.y+(b.y-a.y)*phase;
      ctx.fillStyle=col; ctx.globalAlpha=dim?0.1:0.85;
      ctx.beginPath(); ctx.arc(px,py,2.6,0,Math.PI*2); ctx.fill();
    }
    // 断裂符号
    if(e.change_status==="断裂"){
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      ctx.globalAlpha=dim?0.1:0.95;
      ctx.strokeStyle="#dc2626"; ctx.lineWidth=2.4;
      ctx.beginPath();
      ctx.moveTo(mx-6,my-6);ctx.lineTo(mx+6,my+6);
      ctx.moveTo(mx+6,my-6);ctx.lineTo(mx-6,my+6);
      ctx.stroke();
    }
    ctx.restore();

    // 标签 LAB
    if(showLab && grow>=1){
      const mx=a.x+(b.x-a.x)*0.5, my=a.y+(b.y-a.y)*0.5;
      const lab=edgeLabel(e);
      if(lab){
        ctx.font="600 10.5px sans-serif";
        const tw=ctx.measureText(lab).width;
        ctx.globalAlpha=dim?0.1:0.95;
        ctx.fillStyle="rgba(255,255,255,.92)";
        ctx.beginPath();
        ctx.roundRect(mx-tw/2-5,my-8,tw+10,16,8); ctx.fill();
        ctx.fillStyle = e.change_status==="断裂"?"#dc2626":"#334155";
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(lab,mx,my+0.5);
        ctx.globalAlpha=1;
      }
    }
  });

  // 节点
  nodes.forEach(n=>{
    const dim=nodeDimmed(n);
    const r=nodeRadius(n);
    const scale=n.spawn||1;
    ctx.save();
    ctx.translate(n.x,n.y); ctx.scale(scale,scale);
    // 新增/变化脉冲环
    if((n.change_status==="新增"||n.change_status==="增强")&&!dim){
      const ph=(t/1300)%1;
      ctx.globalAlpha=(1-ph)*0.4;
      ctx.strokeStyle=n.color; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(0,0,r+4+ph*12,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.globalAlpha=dim?0.18:1;
    // 主体
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fillStyle="#fff"; ctx.fill();
    ctx.lineWidth = n.node_type==="core"?3:2.2;
    ctx.strokeStyle=n.color; ctx.stroke();
    // 内部小圆点（类型标识）
    ctx.fillStyle=n.color;
    ctx.beginPath(); ctx.arc(0,0,r*0.32,0,Math.PI*2); ctx.fill();
    // pending 卫星：虚线环表示在建
    if(n.node_status==="pending"){
      ctx.setLineDash([3,3]); ctx.strokeStyle=n.color; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(0,0,r+3,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();

    // 名字
    ctx.save();
    ctx.globalAlpha=dim?0.15:1;
    ctx.font=(n.node_type==="enterprise"?"600 10.5px":"700 11.5px")+" sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillStyle="#1e2b3a";
    ctx.fillText(n.name,n.x,n.y+r+4);
    // 新增/退出小标
    if(n.change_status==="新增"&&!dim){
      ctx.font="700 8.5px sans-serif";
      ctx.fillStyle="#16a34a";
      ctx.fillText("●新",n.x,n.y+r+17);
    }
    ctx.restore();
  });
}

function loop(){
  simulate();
  draw();
  requestAnimationFrame(loop);
}

/* ================= 交互 ================= */
function getPos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function hitNode(x,y){
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    const d=Math.hypot(x-n.x,y-n.y);
    if(d<=nodeRadius(n)+3) return n;
  }
  return null;
}
function hitEdge(x,y){
  let best=null, bd=9;
  edges.forEach(e=>{
    if(!edgeVisible(e)) return;
    const a=nodes.find(n=>n.node_id===e.source_node_id);
    const b=nodes.find(n=>n.node_id===e.target_node_id);
    if(!a||!b) return;
    // 点到线段距离
    const dx=b.x-a.x, dy=b.y-a.y;
    const len2=dx*dx+dy*dy;
    let u=len2?((x-a.x)*dx+(y-a.y)*dy)/len2:0;
    u=Math.max(0,Math.min(1,u));
    const px=a.x+u*dx, py=a.y+u*dy;
    const d=Math.hypot(x-px,y-py);
    if(d<bd){bd=d;best=e;}
  });
  return best;
}

canvas.addEventListener("mousedown",e=>{
  const p=getPos(e);
  const n=hitNode(p.x,p.y);
  if(n){
    dragNode=n; dragMoved=false;
    n.fixed=true; canvas.classList.add("drag");
  }
});
canvas.addEventListener("mousemove",e=>{
  const p=getPos(e); mouse=p;
  if(dragNode){
    dragNode.x=p.x; dragNode.y=p.y; dragNode.vx=0; dragNode.vy=0;
    dragMoved=true;
  } else {
    hoverNode=hitNode(p.x,p.y);
    canvas.style.cursor=hoverNode?"pointer":"grab";
  }
});
window.addEventListener("mouseup",e=>{
  if(dragNode){
    const wasCore = dragNode.node_type==="core"||dragNode.node_type==="external";
    if(!wasCore) dragNode.fixed=false;
    if(!dragMoved){ selectNode(dragNode); }
    dragNode=null; canvas.classList.remove("drag");
  }
});
canvas.addEventListener("click",e=>{
  if(dragMoved){dragMoved=false;return;}
  const p=getPos(e);
  const n=hitNode(p.x,p.y);
  if(n){ selectNode(n); return; }
  const ed=hitEdge(p.x,p.y);
  if(ed){ showEdgePop(ed); return; }
  clearSelection();
});
// 触摸
canvas.addEventListener("touchstart",e=>{
  const p=getPos(e); const n=hitNode(p.x,p.y);
  if(n){dragNode=n;dragMoved=false;n.fixed=true;}
},{passive:true});
canvas.addEventListener("touchmove",e=>{
  if(dragNode){const p=getPos(e);dragNode.x=p.x;dragNode.y=p.y;dragMoved=true;e.preventDefault();}
},{passive:false});
canvas.addEventListener("touchend",e=>{
  if(dragNode){
    if(!(dragNode.node_type==="core"||dragNode.node_type==="external")) dragNode.fixed=false;
    if(!dragMoved) selectNode(dragNode);
    dragNode=null;
  }
});

function selectNode(n){
  selectedNode=n; selectedEdge=null;
  showNodePop(n);
}
function clearSelection(){
  selectedNode=null; selectedEdge=null;
  hidePop();
}

/* ================= 浮卡 ================= */
const pop=document.getElementById("pop");
const popMask=document.getElementById("popMask");
function gradeChip(g){
  const m={A:["#16a34a","A 已证实事实"],B:["#d97706","B 证据推断"],C:["#94a3b8","C 待验证假设"]};
  return '<span class="grade-chip" style="background:'+m[g][0]+'22;color:'+m[g][0]+'">'+m[g][1]+'</span>';
}
function showNodePop(n){
  document.getElementById("p_ic").style.background=n.color;
  document.getElementById("p_ic").innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="4"/></svg>';
  document.getElementById("p_t").textContent=n.name;
  document.getElementById("p_s").textContent=n.layer+(n.town&&n.town!=="外部"?" · "+n.town:"");
  const relEdges=edges.filter(e=>
    (e.source_node_id===n.node_id||e.target_node_id===n.node_id));
  let html='<p>'+n.description+'</p>'+gradeChip(n.evidence_grade);
  if(n.stat) html+='<div class="facts"><div class="fact"><span>关键指标</span><b style="font-size:11px">'+n.stat+'</b></div></div>';
  html+='<div class="facts"><div style="font-size:11px;font-weight:800;color:#475569">相连关系（'+relEdges.length+'）</div>';
  relEdges.forEach(e=>{
    const other=e.source_node_id===n.node_id?e.target_node_id:e.source_node_id;
    const on=nodes.find(x=>x.node_id===other);
    html+='<div class="fact" data-e="'+e.edge_id+'" style="cursor:pointer"><span>'+(on?on.name:other)+' · <span style="color:#94a3b8">'+e.relation_type+'</span></span><b style="color:'+(e.evidence_grade==="A"?"#16a34a":(e.evidence_grade==="B"?"#d97706":"#94a3b8"))+'">'+e.evidence_grade+'</b></div>';
  });
  html+='</div>';
  const sid=n.source_ids&&n.source_ids[0];
  if(sid&&sourcesMap[sid]) html+='<div class="src">来源：'+sourcesMap[sid][0]+'<br><a href="'+sourcesMap[sid][1]+'" target="_blank">'+sourcesMap[sid][1]+'</a></div>';
  document.getElementById("p_body").innerHTML=html;
  pop.classList.add("show"); popMask.classList.add("show");
  pop.querySelectorAll("[data-e]").forEach(el=>el.addEventListener("click",()=>{
    const e=edges.find(x=>x.edge_id===el.dataset.e); if(e) showEdgePop(e);
  }));
}
function showEdgePop(e){
  selectedEdge=e;
  const a=nodes.find(n=>n.node_id===e.source_node_id);
  const b=nodes.find(n=>n.node_id===e.target_node_id);
  document.getElementById("p_ic").style.background=a.color;
  document.getElementById("p_ic").innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 12h16M14 6l6 6-6 6"/></svg>';
  document.getElementById("p_t").textContent=(a?a.name:"")+" → "+(b?b.name:"");
  document.getElementById("p_s").textContent=e.relation_type+" · "+e.direction;
  let html='<p>'+e.relation_description+'</p>'+gradeChip(e.evidence_grade);
  const facts=[];
  if(e.metric) facts.push([e.metric.metric_name, e.metric.metric_value+" "+e.metric.metric_unit]);
  facts.push(["置信度",e.confidence],["变化状态",e.change_status],["强度依据",e.strength_basis]);
  if(e.counter_evidence) facts.push(["限制/反证",e.counter_evidence]);
  html+='<div class="facts">'+facts.map(f=>'<div class="fact"><span>'+f[0]+'</span><b style="font-size:11px;text-align:right;max-width:60%">'+f[1]+'</b></div>').join("")+'</div>';
  const sids=e.source_ids||[];
  let srcHtml="";
  sids.forEach(s=>{ if(sourcesMap[s]) srcHtml+='<div style="margin-bottom:5px">'+sourcesMap[s][0]+'<br><a href="'+sourcesMap[s][1]+'" target="_blank">'+sourcesMap[s][1]+'</a></div>'; });
  if(srcHtml) html+='<div class="src">来源：<br>'+srcHtml+'</div>';
  document.getElementById("p_body").innerHTML=html;
  pop.classList.add("show"); popMask.classList.add("show");
}
function hidePop(){pop.classList.remove("show");popMask.classList.remove("show");}
document.getElementById("p_close").addEventListener("click",()=>{hidePop();clearSelection();});
popMask.addEventListener("click",()=>{hidePop();clearSelection();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){hidePop();clearSelection();}});

/* ================= 筛选/开关 ================= */
function setFilter(f){
  activeFilter=f;
  document.querySelectorAll("#filter button,#topnav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.f===f);
  });
  clearSelection();
}
document.querySelectorAll("#filter button,#topnav button").forEach(b=>{
  b.addEventListener("click",()=>setFilter(b.dataset.f));
});
document.getElementById("swLab").addEventListener("click",function(){
  showLab=!showLab; this.classList.toggle("off",!showLab);
});
document.getElementById("swChg").addEventListener("click",function(){

});

/* ================= 右侧 AI 情报区 ================= */
const tagMeta={
  new_entity:["#16a34a","新主体接入"], new_edge:["#2563eb","新连接形成"],
  strengthen:["#d97706","关系增强"], break:["#dc2626","连接断裂"]
};
function buildIntel(){
  const body=document.getElementById("intelBody");
  // 按时间倒序
  const sorted=[...changes].sort((a,b)=>b.event_date.localeCompare(a.event_date));
  body.innerHTML=sorted.map(c=>{
    const tm=tagMeta[c.change_type]||["#64748b","变化"];
    return '<div class="msg" data-c="'+c.change_id+'">'+
      '<span class="ma"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2"><path d="M12 3l2 5 5 .5-4 3.5 1.5 5L12 14l-4.5 3 1.5-5-4-3.5L10 8z"/></svg></span>'+
      '<div class="bubble">'+
        '<span class="tag" style="background:'+tm[0]+'1e;color:'+tm[0]+'">'+tm[1]+' · '+c.event_date.slice(5)+'</span>'+
        '<div class="h">'+c.title+'</div>'+
        '<div class="q"><b>值得讨论：</b>'+(c.topic||c.uncertainty)+'</div>'+
        '<div class="go-link">在网络中定位 →</div>'+
      '</div></div>';
  }).join("");
  body.querySelectorAll(".msg").forEach(m=>{
    m.addEventListener("click",()=>{
      const c=changes.find(x=>x.change_id===m.dataset.c);
      if(!c) return;
      // 高亮首个节点 + 边
      const firstNode=c.involved_node_ids[0];
      const n=nodes.find(x=>x.node_id===firstNode);
      if(n){ selectNode(n); }
      setTLActive(c.change_id);
    });
  });
}

/* ================= 底部时间线 ================= */
function buildTL(){
  const track=document.getElementById("tlTrack");
  const sorted=[...changes].sort((a,b)=>a.event_date.localeCompare(b.event_date));
  const nodesHtml=sorted.map(c=>{
    const cls=c.change_type==="new_entity"?"new":"edge";
    return '<div class="tl-node '+cls+'" data-c="'+c.change_id+'">'+
      '<span class="l">'+c.title.replace(/（.*$/,"")+'</span>'+
      '<span class="n"></span>'+
      '<span class="d">'+c.event_date.slice(5)+'</span></div>';
  }).join("");
  track.innerHTML='<div class="tl-line"></div>'+nodesHtml;
  track.querySelectorAll(".tl-node").forEach(el=>{
    el.addEventListener("click",()=>{
      const c=changes.find(x=>x.change_id===el.dataset.c);
      if(c){
        const n=nodes.find(x=>x.node_id===c.involved_node_ids[0]);
        if(n) selectNode(n);
        setTLActive(c.change_id);
      }
    });
  });
}
function setTLActive(cid){
  document.querySelectorAll(".tl-node").forEach(el=>{
    el.classList.toggle("active",el.dataset.c===cid);
  });
}

document.getElementById("searchInput").addEventListener("input",function(){
  const q=this.value.trim();
  if(!q){clearSelection();return;}

/* ================= 启动 ================= */
function applyData(data){
  // 兼容：fetch 三件套合并
  nodes = data.nodes.map(n=>({...n, color:n.color||typeColor(n)}));
  edges = data.edges;
  changes = data.changes||[];
  sourcesMap = data.sources||{};
  resize();
  initPositions();
  buildIntel();
  buildTL();
  loop();
}
function typeColor(n){
  const m={core:"#1e2b3a",anchor:"#2563eb",cluster:"#2563eb",enterprise:"#2563eb",infrastructure:"#dc2626",external:"#64748b"};
  return m[n.node_type]||"#64748b";
}
async function boot(){
  resize();
  try{
    const [ev,ch] = await Promise.all([
      fetch(DATA_BASE+"relationship-evidence-v1.json").then(r=>{if(!r.ok)throw 0;return r.json();}),
      fetch(DATA_BASE+"relationship-changes-v1.json").then(r=>{if(!r.ok)throw 0;return r.json();})
    ]);
    // evidence 节点没有 color，按 layer 补
    const layerColor={"城市核心":"#1e2b3a","产业引擎":"#2563eb","三大集群":"#2563eb","新兴产业":"#7c3aed","城市功能":"#0d9488","外部":"#64748b"};
    ev.nodes.forEach(n=>{
      if(n.layer==="卫星·新材料") n.color="#0891b2";
      else if(n.layer==="卫星·电子信息") n.color="#2563eb";
      else if(n.layer==="卫星·AI") n.color="#7c3aed";
      else n.color=layerColor[n.layer]||"#2563eb";
    });
    // 城市功能细分
    const cf={jt:"#dc2626",wh:"#9333ea",rj:"#16a34a",fw:"#0d9488"};
    ev.nodes.forEach(n=>{ if(cf[n.node_id]) n.color=cf[n.node_id]; });
    // sources 表
    const src=await fetch(DATA_BASE+"relationship-sources-v1.json").then(r=>r.json());
    const sm={};
    src.sources.forEach(s=>{ sm[s.source_id]=[s.title,s.url]; });
    applyData({nodes:ev.nodes, edges:ev.edges, changes:ch.changes, sources:sm});
  }catch(e){
    applyData(FALLBACK);
  }
}
boot();
