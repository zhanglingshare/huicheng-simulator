<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>惠城产业风洞 · 未来</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#e6edf3;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.nav{position:sticky;top:0;z-index:50;display:flex;gap:5px;align-items:center;padding:9px 14px;background:rgba(8,11,18,.95);border-bottom:1px solid #1b2434;backdrop-filter:blur(8px);overflow-x:auto}
.nav b{font-size:14px;margin-right:6px;letter-spacing:.5px;flex:none}
.nav a{background:#131c2b;color:#93a4bd;border:1px solid #22304a;padding:6px 12px;border-radius:20px;font-size:12.5px;text-decoration:none;white-space:nowrap;flex:none}
.nav a.on{background:#1d4ed8;border-color:#3b82f6;color:#fff;font-weight:600}
.nav .sp{margin-left:auto;font-size:11.5px;color:#64748b;flex:none}
.wrap{max-width:800px;margin:auto;padding:16px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:.5px}
.sub{color:#8fa3bf;font-size:13px;margin:0 0 16px}
.card{background:#0e1523;border:1px solid #1c2739;border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 12px}
svg{display:block;width:100%;height:auto}
.btn{background:#1d4ed8;color:#fff;border:0;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
@media(max-width:700px){.result{grid-template-columns:1fr}}
.stat{background:#0a0f1a;border:1px solid #1c2739;border-radius:10px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:800;color:#fbbf24}
.stat .l{font-size:11px;color:#6b7280;margin-top:2px}
.prob{font-size:32px;font-weight:800;text-align:center;margin:10px 0}
</style></head><body>

<div class="nav">
  <b>惠城产业风洞</b>
  <a href="index.html">① 今日话题</a>
  <a href="network.html">② 建构世界</a>
  <a href="who.html">③ 基本面</a>
  <a href="choices.html">④ 五条路</a>
  <a href="future.html" class="on">⑤ 未来</a>
  <span class="sp">蒙特卡洛 · 10000次</span>
</div>

<div class="wrap">
  <h1>把未来扔一万遍</h1>
  <p class="sub">未来不是一个数，是一堆可能。把每条路的不确定性扔进去，随机跑一万遍，看落在哪。</p>

  <div style="text-align:center;margin-bottom:14px">
    <button class="btn" id="bGo">🎲 扔一万遍</button>
  </div>

  <div id="out" style="display:none">
    <div class="prob" id="prob"></div>
    <div style="text-align:center;font-size:12px;color:#6b7280;margin-top:-8px;margin-bottom:10px">达到1500亿的概率</div>
    <div class="result">
      <div class="stat"><div class="v" id="p10">—</div><div class="l">最差的10种情况</div></div>
      <div class="stat"><div class="v" id="p50">—</div><div class="l">一半一半（最可能）</div></div>
      <div class="stat"><div class="v" id="p90">—</div><div class="l">最好的10种情况</div></div>
    </div>

    <div class="card">
      <h2>一万次里，落在哪？</h2>
      <svg viewBox="0 0 700 180" id="chart"></svg>
      <div id="chart-note" style="font-size:12px;color:#8fa3bf;margin-top:8px;text-align:center"></div>
    </div>

    <div class="card">
      <h2>哪件事最影响结果</h2>
      <div id="sens" style="font-size:13px;line-height:2;color:#cbd5e1"></div>
    </div>
  </div>

  <div style="font-size:11px;color:#5b6b82;text-align:center;margin-top:10px">
    每条路的不确定度：高新区±50亿、制造业±60亿、服务业±40亿、城市更新±40亿、融深±50亿。整体再受外部冲击±8%。
  </div>
</div>

<script>
// 简单正态分布（Box-Muller）
function randn(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

function run(){
  const base=632.7;
  const paths=[
    {mu:250,sd:50},
    {mu:200,sd:60},
    {mu:120,sd:40},
    {mu:80,sd:40},
    {mu:60,sd:50}
  ];
  const N=10000;
  const results=[];
  for(let i=0;i<N;i++){
    let total=base;
    for(const p of paths){
      let v=p.mu+randn()*p.sd;
      if(v<0)v=0;
      total+=v;
    }
    total*=1+randn()*0.08;
    results.push(total);
  }
  results.sort((a,b)=>a-b);
  const p10=results[1000], p50=results[5000], p90=results[9000];
  const hit=results.filter(x=>x>=1500).length/N*100;

  document.getElementById('prob').innerHTML=
    `<span style="color:#f87171">${hit.toFixed(1)}%</span> <span style="font-size:14px;color:#8fa3bf">概率达到1500亿</span>`;
  document.getElementById('p10').textContent=Math.round(p10)+'亿';
  document.getElementById('p50').textContent=Math.round(p50)+'亿';
  document.getElementById('p90').textContent=Math.round(p90)+'亿';

  // 画直方图（增强版）
  const bins=40;
  const min=Math.floor(p10*0.85), max=Math.ceil(p90*1.15);
  const counts=new Array(bins).fill(0);
  results.forEach(r=>{
    const b=Math.min(bins-1,Math.max(0,Math.floor((r-min)/(max-min)*bins)));
    counts[b]++;
  });
  const maxC=Math.max(...counts);
  const W=660, H=120, left=10, bottom=140;
  let svg='';

  // 背景网格线
  for(let g=0;g<=4;g++){
    const y=bottom-H/4*g;
    svg+=`<line x1="${left}" y1="${y}" x2="${left+W}" y2="${y}" stroke="#1c2739" stroke-width="0.5"/>`;
  }

  // 超目标区域红色阴影
  const tx=(1500-min)/(max-min)*W+left;
  if(tx<left+W){
    svg+=`<rect x="${tx}" y="20" width="${left+W-tx}" height="${H}" fill="#f87171" opacity="0.08"/>`;
  }

  // 柱子
  for(let i=0;i<bins;i++){
    const h=counts[i]/maxC*H;
    const x=left+i*W/bins;
    const v=min+(max-min)*(i+0.5)/bins;
    const color=v>=1500?'#f87171':'#3b82f6';
    svg+=`<rect x="${x+1}" y="${bottom-h}" width="${W/bins-2}" height="${h}" fill="${color}" opacity="0.75" rx="1"/>`;
  }

  // 目标线
  svg+=`<line x1="${tx}" y1="15" x2="${tx}" y2="${bottom}" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3"/>`;
  svg+=`<text x="${tx}" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">目标 1500亿</text>`;

  // P10/P50/P90 竖线+标注
  const marks=[
    {v:p10,label:'最差10%',c:'#6b7280'},
    {v:p50,label:'一半一半',c:'#3b82f6'},
    {v:p90,label:'最好10%',c:'#34d399'}
  ];
  marks.forEach(m=>{
    const mx=(m.v-min)/(max-min)*W+left;
    svg+=`<line x1="${mx}" y1="${bottom-H-5}" x2="${mx}" y2="${bottom}" stroke="${m.c}" stroke-width="1.5"/>`;
    svg+=`<text x="${mx}" y="${bottom-H-10}" text-anchor="middle" font-size="10" fill="${m.c}" font-weight="600">${Math.round(m.v)}亿</text>`;
    svg+=`<text x="${mx}" y="${bottom-H-22}" text-anchor="middle" font-size="9" fill="${m.c}">${m.label}</text>`;
  });

  // 横轴
  svg+=`<line x1="${left}" y1="${bottom}" x2="${left+W}" y2="${bottom}" stroke="#1c2739" stroke-width="2"/>`;
  // 横轴刻度
  for(let t=Math.ceil(min/200)*200;t<=max;t+=200){
    const tx2=(t-min)/(max-min)*W+left;
    svg+=`<text x="${tx2}" y="${bottom+16}" text-anchor="middle" font-size="10" fill="#5b6b82">${t}</text>`;
  }
  svg+=`<text x="${left+W/2}" y="${bottom+32}" text-anchor="middle" font-size="10" fill="#6b7280">2030年高新区产值（亿元）</text>`;

  document.getElementById('chart').innerHTML=svg;

  // 图下结论
  document.getElementById('chart-note').innerHTML=
    `一万次里，<b style="color:#f87171">${hit.toFixed(0)}次</b>超过了1500亿，`+
    `<b style="color:#3b82f6">${(100-hit).toFixed(0)}次</b>没到。`+
    `最可能落在 <b style="color:#fbbf24">${Math.round(p50)}亿</b> 附近。`;

  // 敏感性
  document.getElementById('sens').innerHTML=
    `🥇 <b style="color:#f87171">制造业集群招商能不能落地</b>——波动最大，招到和招不到差60亿<br>`+
    `🥈 <b style="color:#fbbf24">高新区项目能不能按时投产</b>——晚一年就差50亿<br>`+
    `🥉 <b style="color:#3b82f6">深圳那边接不接得住</b>——最不可控，但影响最小`;

  document.getElementById('out').style.display='block';
}

document.getElementById('bGo').onclick=run;
</script>
</body></html>
