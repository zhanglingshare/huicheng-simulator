<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>惠城产业风洞 · 今日话题</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#e6edf3;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.nav{position:sticky;top:0;z-index:50;display:flex;gap:5px;align-items:center;padding:9px 14px;background:rgba(8,11,18,.95);border-bottom:1px solid #1b2434;backdrop-filter:blur(8px);overflow-x:auto}
.nav b{font-size:14px;margin-right:6px;letter-spacing:.5px;flex:none}
.nav a{background:#131c2b;color:#93a4bd;border:1px solid #22304a;padding:6px 12px;border-radius:20px;font-size:12.5px;text-decoration:none;white-space:nowrap;flex:none}
.nav a.on{background:#1d4ed8;border-color:#3b82f6;color:#fff;font-weight:600}
.nav .sp{margin-left:auto;font-size:11.5px;color:#64748b;flex:none}
.wrap{max-width:720px;margin:auto;padding:16px}
h1{font-size:22px;margin:0 0 2px;letter-spacing:.5px}
.sub{color:#8fa3bf;font-size:13px;margin:0 0 14px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.cat{background:#131c2b;color:#93a4bd;border:1px solid #22304a;padding:5px 14px;border-radius:16px;font-size:12.5px;cursor:pointer;transition:.2s}
.cat.on{background:#1d4ed8;border-color:#3b82f6;color:#fff;font-weight:600}
.refresh{background:#f59e0b;color:#1a1206;border:0;padding:6px 16px;border-radius:16px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:auto}
.refresh:active{transform:scale(.96)}
.scan-info{font-size:11px;color:#5b6b82;margin-bottom:12px}
.topic{background:#0e1523;border:1px solid #1c2739;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;transition:.2s;animation:fd .4s ease-out}
.topic:hover{border-color:#3b82f6;background:#121d31}
.topic .rank{font-size:18px;font-weight:800;color:#fbbf24;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.topic .body{flex:1;min-width:0}
.topic .t{font-size:14px;font-weight:600;margin-bottom:3px}
.topic .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:#7d8fa8;flex-wrap:wrap}
.topic .heat{height:4px;width:60px;background:#16233a;border-radius:2px;overflow:hidden;display:inline-block}
.topic .heat i{display:block;height:100%;border-radius:2px}
.topic .src{background:#1a2337;padding:1px 6px;border-radius:4px;font-size:10.5px}
.topic .cat-tag{font-size:10.5px;padding:1px 6px;border-radius:4px}
.cat-ind{border-left:3px solid #3b82f6}
.cat-life{border-left:3px solid #f97316}
.cat-city{border-left:3px solid #6b7280}
.next{text-align:center;margin-top:18px}
.next a{background:#1d4ed8;color:#fff;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:600;display:inline-block}
.disc{margin-top:14px;font-size:11px;color:#5b6b82;text-align:center}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .6s linear infinite}
</style></head><body>

<div class="nav">
  <b>惠城产业风洞</b>
  <a href="index.html" class="on">① 今日话题</a>

  <a href="future.html">⑥ 未来</a>
  <span class="sp">情报雷达 · 公开来源</span>
</div>

<div class="wrap">
  <h1>今日惠城区话题</h1>
  <p class="sub">扫一遍公开渠道，按热度排。不是情感分析，是话题雷达。</p>

  <div class="toolbar">
    <button class="cat on" data-c="all">全部</button>
    <button class="cat" data-c="ind">🔵 产业</button>
    <button class="cat" data-c="life">🟠 民生</button>
    <button class="cat" data-c="city">⚪ 城市</button>
    <button class="refresh" id="btnScan">🔄 重新扫描</button>
  </div>
  <div class="scan-info" id="scanInfo">上次扫描：刚刚 · 覆盖15个公开来源</div>

  <div id="topicList"></div>

  <div class="next"><a href="network.html">下一步：看世界怎么运转 →</a></div>
  <div class="disc">数据来源：政府工作报告、直通车、本地媒体、上市公司公告、公开生活平台。当前为预设话题池，后端实时接口接入后自动替换。</div>
</div>

<script>
const TOPICS=[
  {t:"高新区冲千亿，2026目标820亿",h:92,c:"ind",src:"政府工作报告",d:"632.7亿→2027破千亿，2030目标1500亿"},
  {t:"利元亨锂电设备订单放量",h:78,c:"ind",src:"上市公司公告",d:"2025营收30.77亿，新能源装备龙头"},
  {t:"智能家电72家，5家小巨人",h:65,c:"ind",src:"园区公开资料",d:"雷士、西顿、正牌科电、登辉等集聚"},
  {t:"AI与机器人产值120亿",h:58,c:"ind",src:"政府工作报告",d:"新赛道布局，孤岛还是引擎待验"},
  {t:"先进科技封装设备增速91%",h:52,c:"ind",src:"企业公开数据",d:"2024产值超10亿，高速增长"},
  {t:"深惠城际延期至2029年底",h:85,c:"ind",src:"城际建设公告",d:"原计划2026通车，跨城通勤再等三年"},
  {t:"江北生产性服务业139.5亿",h:60,c:"ind",src:"统计公报",d:"金融、商务、软件信息占服务业近半"},
  {t:"天宝创能新能源配套成长",h:45,c:"ind",src:"企业公开资料",d:"电源/新能源配套企业"},
  {t:"文昌/明达学校开学，新增8000学位",h:88,c:"life",src:"政府工作报告",d:"2026年9月投入使用，文昌1740/明达2520"},
  {t:"过江通道早晚高峰拥堵",h:95,c:"life",src:"政府直通车",d:"水口到江北35分钟→50分钟，学校周边投诉集中"},
  {t:"二妇幼江北新院500床启用",h:62,c:"life",src:"医院公告",d:"2026年1月启用，江北医疗补强"},
  {t:"马安下良保障房入住",h:48,c:"life",src:"住建公开",d:"青年新市民安居，就业驿站配套"},
  {t:"学位仍紧张，学区争议",h:75,c:"life",src:"直通车/媒体",d:"新增学位但人口流入更快，容德改托育等案例"},
  {t:"横沥汝湖远郊公交班次少",h:38,c:"life",src:"直通车",d:"边远镇街公交低频，通勤不便"},
  {t:"免费学前一年试点",h:42,c:"life",src:"政府工作报告",d:"公办园720位，学前教育普惠"},
  {t:"水口工业区工人居住条件",h:40,c:"life",src:"媒体报道",d:"本地工人城中村居住，配套待提升"},
  {t:"水东街改造后人流回升",h:55,c:"city",src:"本地媒体",d:"老城商业更新，夜间经济"},
  {t:"西湖文旅节假日拥堵",h:50,c:"city",src:"文旅公开",d:"传统景区承载压力，停车难"},
  {t:"江北CBD写字楼空置率",h:46,c:"city",src:"商业地产公开",d:"服务业集聚但商务楼宇供给偏多"},
  {t:"桥西老城商圈更新",h:44,c:"city",src:"城市更新公告",d:"水东街、西湖文旅联动"},
  {t:"融深融湾接深圳外溢",h:58,c:"city",src:"政府工作报告",d:"深惠城际未通，产业承接待提速"},
  {t:"惠州学院学院城建设",h:35,c:"city",src:"高校公开",d:"技能工程师供给侧"},
  {t:"小金口枢纽进展",h:52,c:"city",src:"交通公告",d:"莞惠城际北延线已通，深惠城际在建"}
];

let curCat="all";
function render(){
  let list=curCat==="all"?TOPICS:TOPICS.filter(x=>x.c===curCat);
  list=list.map(x=>({...x,hs:x.h+Math.random()*8-4})).sort((a,b)=>b.hs-a.hs);
  const el=document.getElementById("topicList");
  el.innerHTML=list.map((x,i)=>{
    const catCls=x.c==="ind"?"cat-ind":x.c==="life"?"cat-life":"cat-city";
    const catName=x.c==="ind"?"产业":x.c==="life"?"民生":"城市";
    const heatColor=x.hs>=80?"#f87171":x.hs>=60?"#fbbf24":"#34d399";
    return `<div class="topic ${catCls}">
      <div class="rank">${i+1}</div>
      <div class="body">
        <div class="t">${x.t}</div>
        <div class="meta">
          <span class="heat"><i style="width:${Math.min(100,x.hs)}%;background:${heatColor}"></i></span>
          <span>${Math.round(x.hs)}°</span>
          <span class="src">${x.src}</span>
          <span class="cat-tag" style="background:${x.c==='ind'?'#1e3a5f':x.c==='life'?'#3d2817':'#2a2f3a'};color:${x.c==='ind'?'#60a5fa':x.c==='life'?'#fb923c':'#9ca3af'}">${catName}</span>
        </div>
        <div style="font-size:12px;color:#8fa3bf;margin-top:4px">${x.d}</div>
      </div>
    </div>`;
  }).join("");
}

document.querySelectorAll(".cat").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    curCat=b.dataset.c;
    render();
  };
});

document.getElementById("btnScan").onclick=function(){
  this.innerHTML='<span class="spin">🔄</span> 扫描中…';
  document.getElementById("scanInfo").textContent="正在扫描公开来源…";
  setTimeout(()=>{
    this.innerHTML="🔄 重新扫描";
    const now=new Date();
    document.getElementById("scanInfo").textContent=`上次扫描：${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} · 覆盖15个公开来源 · 话题已更新`;
    render();
  },800);
};

render();
</script>
</body></html>
