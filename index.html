    {url:"https://api.vvhan.com/api/hotlist/bili",name:"B站热门"},
    {url:"https://api.vvhan.com/api/hotlist/weixin",name:"微信热搜"},
    {url:"https://api.vvhan.com/api/hotlist/thepaper",name:"澎湃"},
    {url:"https://api.vvhan.com/api/hotlist/people",name:"人民日报"},
    {url:"https://api.vvhan.com/api/hotlist/wangyi",name:"网易新闻"},
    {url:"https://api.vvhan.com/api/hotlist/sina",name:"新浪"},
    {url:"https://api.vvhan.com/api/hotlist/huanqiu",name:"环球网"}
  ];
  for(const api of apis){
    try{
      const r=await fetch(api.url);
      const j=await r.json();
      if(j.data&&Array.isArray(j.data)){
        j.data.forEach((it,i)=>{
          const title=it.title||it.word||"";
          if(KW.some(k=>title.includes(k))){
            liveTopics.push({
              t:title,
              h:Math.max(60, 95-i*1.5),
              c:"city",
              src:api.name+"·实时",
              url:it.url||it.mobileUrl||"",
              d:`来自${api.name}实时榜第${i+1}位`,
              why:"热搜在榜——这是正在被讨论的事。",
              live:true
            });
          }
        });
      }
    }catch(e){/* 静默失败，用本地池 */}
  }
}

function allTopics(){return [...liveTopics, ...LOCAL, ...FOOD, ...FUN, ...WARM];}

function render(){
  let list=curCat==="all"?allTopics():allTopics().filter(x=>x.c===curCat);
  list=list.map(x=>({...x,hs:x.h+Math.random()*4-2})).sort((a,b)=>b.hs-a.hs);
  const grads={ind:"linear-gradient(135deg,#1e3a8a,#0f1a2e)",life:"linear-gradient(135deg,#7c2d12,#1a0f0f)",city:"linear-gradient(135deg,#374151,#0f1a2e)",food:"linear-gradient(135deg,#7f1d1d,#1a0f0f)",fun:"linear-gradient(135deg,#064e3b,#0f1a2e)",warm:"linear-gradient(135deg,#78350f,#1a1206)"};
  const catName={ind:"产业",life:"民生",city:"城市",food:"好吃",fun:"好玩",warm:"八卦"};
  const el=document.getElementById("topicList");
  el.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px";
  el.innerHTML=list.map((x)=>{
    const liveBadge=x.live?'<span style="background:#dc2626;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:5px">实时</span>':'';
    const likes=(localStorage.getItem("like_"+x.t)||Math.floor(Math.random()*50+10));
    return `<div class="tcard" data-t="${x.t}" style="background:${grads[x.c]||grads.city};border-radius:12px;padding:14px;cursor:pointer">
      <div style="font-size:11px;color:#94a3b8">${catName[x.c]||"城市"}${liveBadge} · ${x.src||""}</div>
      <div style="font-size:16px;font-weight:800;color:#fff;margin:8px 0 4px;line-height:1.4">${x.t}</div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:26px;font-weight:900;color:${x.hs>=85?'#f87171':x.hs>=70?'#fbbf24':'#34d399'}">${Math.round(x.hs)}<span style="font-size:12px;font-weight:400">°</span></div>
        <div style="display:flex;gap:10px;font-size:13px">
          <span class="likeBtn" onclick="event.stopPropagation();like(this,'${x.t}')">👍 <b class="ln">${likes}</b></span>
        </div>
      </div>
      <div class="detail" style="font-size:11.5px;color:#cbd5e1;margin-top:8px;display:none">${x.d}<br><span style="color:#fbbf24">→ ${x.why}</span></div>
    </div>`;
  }).join("");
  document.querySelectorAll("#topicList .tcard").forEach(c=>{
    c.onclick=()=>{const d=c.querySelector(".detail");d.style.display=d.style.display==="none"?"block":"none";};
  });
}
function like(el,t){
  let n=parseInt(el.querySelector(".ln").textContent)+1;
  el.querySelector(".ln").textContent=n;
  localStorage.setItem("like_"+t,n);
  el.style.transform="scale(1.2)";
  setTimeout(()=>el.style.transform="",200);
}

document.querySelectorAll(".cat").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    curCat=b.dataset.c;
    render();
  };
});

document.getElementById("btnScan").onclick=async function(){
  this.innerHTML='<span class="pulse">⏳</span> 扫描中…';
  document.getElementById("scanInfo").textContent="雷达旋转中，正在拉取12个公开渠道…";
  document.getElementById("scanline").classList.add("fast");
  await fetchLive();
  this.innerHTML="🔄 重新扫描";
  document.getElementById("scanline").classList.remove("fast");
  const now=new Date();
  const liveN=liveTopics.length;
  document.getElementById("scanInfo").textContent=`上次扫描：${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} · 实时热搜${liveN}条 + 话题${LOCAL.length}条 + 好吃${FOOD.length}·好玩${FUN.length}·八卦${WARM.length}`;
  render();
};

// 首屏自动拉一次
(async()=>{
  await fetchLive();
  const now=new Date();
  document.getElementById("scanInfo").textContent=`上次扫描：${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} · 实时热搜${liveTopics.length}条 + 话题${LOCAL.length}条 + 好吃${FOOD.length}·好玩${FUN.length}`;
  render();
})();

</script>
