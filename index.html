<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>惠城服务世界 · 今日话题</title>
<script src="model.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#060914;color:#e6edf3;
  font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;
  position:relative;
}
/* === 背景：点阵网格 + 青蓝光晕 + 底部紫光晕 === */
body::before{
  content:"";position:fixed;inset:0;z-index:-3;
  background-image:radial-gradient(circle,rgba(34,211,238,.10) 1px,transparent 1.2px);
  background-size:26px 26px;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 500px at 50% -8%, rgba(34,211,238,.18), transparent 65%),
    radial-gradient(800px 500px at 50% 110%, rgba(139,92,246,.12), transparent 60%);
}
/* 顶部导航 */
.nav{
  position:sticky;top:0;z-index:50;
  display:flex;gap:6px;align-items:center;
  padding:10px 14px;
  background:rgba(6,9,20,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(34,211,238,.12);
  overflow-x:auto;
}
.nav b{font-size:13px;margin-right:8px;letter-spacing:1px;flex:none;color:#22d3ee;font-weight:800}
.nav a{
  background:rgba(255,255,255,.04);color:#93a4bd;
  border:1px solid rgba(255,255,255,.08);
  padding:6px 12px;border-radius:20px;font-size:12.5px;text-decoration:none;white-space:nowrap;flex:none;
  transition:.2s;
}
.nav a.on{background:rgba(34,211,238,.15);border-color:#22d3ee;color:#22d3ee;font-weight:700}
.nav .sp{margin-left:auto;font-size:11px;color:#64748b;flex:none}

.wrap{max-width:760px;margin:auto;padding:20px 16px 40px}

/* 品牌行 + 日期 */
.brand-row{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:8px 2px 16px;
}
.brand-row .b{font-size:13px;font-weight:800;letter-spacing:2px;color:#22d3ee}
.brand-row .b small{color:#93a4bd;font-weight:500;letter-spacing:0;margin-left:6px;font-size:12px}
.brand-row .date{font-size:12px;color:#7d8fa8;font-variant-numeric:tabular-nums}

/* 通用玻璃卡 */
.glass{
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}

/* 今日头条 */
.top1{
  padding:18px 18px 16px;margin-bottom:14px;
  border-left:3px solid #ef4444;
  position:relative;overflow:hidden;
  cursor:pointer;
}
.top1 .badge{
  display:inline-block;background:#ef4444;color:#fff;
  font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:4px;
  letter-spacing:1px;margin-bottom:10px;
}
.top1 .t{font-size:19px;font-weight:800;line-height:1.45;margin-bottom:8px;color:#fff}
.top1 .meta{font-size:12px;color:#8fa3bf;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top1 .meta .src{background:rgba(255,255,255,.06);padding:1px 8px;border-radius:4px}

/* 时间胶囊预测卡 */
.capsule{padding:18px;margin-bottom:14px}
.capsule-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.gauge{flex:none;width:104px;height:104px;position:relative}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .pct{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.gauge .pct b{font-size:22px;font-weight:800;color:#22d3ee;line-height:1;font-variant-numeric:tabular-nums}
.gauge .pct span{font-size:9.5px;color:#7d8fa8;margin-top:3px;letter-spacing:.5px}
.capsule-info{flex:1;min-width:0}
.capsule-info .q{font-size:15px;font-weight:800;color:#fff;line-height:1.4;margin-bottom:4px}
.capsule-info .sub{font-size:12px;color:#94a3b8;line-height:1.5}
.capsule-info .sub b{color:#fbbf24;font-variant-numeric:tabular-nums}
.vote-btns{display:flex;gap:8px}
.vote-btns button{
  flex:1;background:rgba(255,255,255,.04);border:1px solid;
  border-radius:10px;padding:10px 6px;cursor:pointer;font-size:13px;font-weight:700;
  transition:.15s;color:inherit;
}
.vote-btns button:active{transform:scale(.97)}
.vote-btns button:disabled{cursor:default;opacity:.6}
.vote-sure{color:#34d399;border-color:#34d399!important;background:rgba(52,211,153,.1)!important}
.vote-risky{color:#f87171;border-color:#f87171!important;background:rgba(248,113,113,.1)!important}
.vote-wait{color:#94a3b8;border-color:#94a3b8!important;background:rgba(148,163,184,.08)!important}
.vote-out{margin-top:12px;font-size:12.5px;color:#cbd5e1;line-height:1.7}
.seal{
  display:none;margin-top:12px;padding:10px 12px;border-radius:10px;
  background:linear-gradient(90deg,rgba(251,191,36,.12),rgba(251,191,36,.04));
  border:1px solid rgba(251,191,36,.45);
  font-size:12px;color:#fde68a;line-height:1.6;
}
.seal.on{display:block}
.seal b{color:#fff}
.dist-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 4px;background:rgba(255,255,255,.06)}
.dist-bar i{display:block;height:100%}
.dist-label{display:flex;justify-content:space-between;font-size:10.5px;color:#7d8fa8;gap:8px;flex-wrap:wrap}

/* 分类工具栏 */
.toolbar{display:flex;gap:8px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
.cat{
  background:rgba(255,255,255,.04);color:#93a4bd;
  border:1px solid rgba(255,255,255,.08);
  padding:6px 14px;border-radius:16px;font-size:12.5px;cursor:pointer;transition:.2s;
}
.cat.on{background:rgba(34,211,238,.15);border-color:#22d3ee;color:#22d3ee;font-weight:700}
.refresh{
  background:rgba(34,211,238,.12);color:#22d3ee;border:1px solid rgba(34,211,238,.4);
  padding:6px 14px;border-radius:16px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:auto;
}
.scan-info{font-size:11px;color:#5b6b82;margin-bottom:12px}

/* 话题流 */
#topicList{display:flex;flex-direction:column;gap:10px}
.tcard{
  padding:14px 16px;cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;
  transition:.2s;
  animation:fd .4s ease-out;
}
.tcard:hover{border-color:rgba(34,211,238,.35)}
.tcard .bar{width:3px;align-self:stretch;border-radius:2px;flex:none}
.tcard .body{flex:1;min-width:0}
.tcard .tags{display:flex;gap:6px;align-items:center;font-size:10.5px;color:#7d8fa8;margin-bottom:6px;flex-wrap:wrap}
.tcard .tags .cn{color:#94a3b8}
.tcard .tags .live{background:#dc2626;color:#fff;padding:1px 5px;border-radius:3px;font-size:9px}
.tcard .t{font-size:15px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:4px}
.tcard .rel{font-size:12px;color:#67e8f9;line-height:1.5;margin-bottom:8px}
.tcard .foot{display:flex;align-items:center;justify-content:space-between}
.tier{font-size:11px;font-weight:700;border-radius:6px;padding:2px 9px;border:1px solid}
.likeBtn{font-size:12px;color:#7d8fa8;cursor:pointer;background:none;border:none}
.detail{display:none;font-size:12px;color:#cbd5e1;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.1)}
.tcard.open .detail{display:block}
.detail a{color:#67e8f9;text-decoration:underline}

/* 下一步 & 底部 */
.next{text-align:center;margin-top:22px}
.next a{
  background:linear-gradient(135deg,#22d3ee,#0ea5e9);color:#060914;
  padding:11px 26px;border-radius:10px;text-decoration:none;font-weight:800;display:inline-block;
}
.disc{margin-top:16px;font-size:11px;color:#5b6b82;text-align:center;line-height:1.6}

/* 点赞/分享 */
.likebar{
  display:flex;justify-content:center;gap:24px;
  margin:22px auto 0;padding:10px 20px;max-width:340px;
  background:rgba(15,23,42,.8);border:1px solid rgba(34,211,238,.25);border-radius:24px;
}
.likebar button{background:none;border:none;color:#e2e8f0;font-size:13.5px;cursor:pointer}
.likebar button:active{transform:scale(1.1)}

@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.pulse{animation:pulse 1.5s ease-in-out infinite}

@media (min-width:640px){
  .wrap{padding-top:28px}
  .top1 .t{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

  <div id="topicList"></div>

</div>

<div class="likebar">
  <button onclick="likePage()">👍 <span id="pcount">0</span> 有用</button>

<script>
// 日期
(function(){
  const d=new Date();
  const wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById("today").textContent=`${d.getMonth()+1}月${d.getDate()}日 · ${wk}`;
})();

let curCat="all";
let allData=[];
let hotMeta={};

// 本地话题池（兜底）
const LOCAL=[
  {t:"过江通道早晚高峰拥堵",h:95,c:"life",src:"政府直通车",d:"水口到江北35分钟→50分钟",why:"这不是修路能解决的——它是产业和城之间唯一的那根筋。"},
  {t:"高新区冲千亿，2026目标820亿",h:92,c:"ind",src:"政府工作报告",d:"632.7亿→2027破千亿，2030目标1500亿",why:"压在几个关键项目投产节点上，不是匀速涨。"},
  {t:"深惠城际延期至2029年底",h:85,c:"ind",src:"城际建设公告",d:"原计划2026通车，跨城通勤再等三年",why:"惠城融深的一条腿，慢了三年。"},
  {t:"文昌/明达学校开学，新增8000学位",h:88,c:"life",src:"政府工作报告",d:"2026年9月投入使用",why:"学位在补，但人口流入更快。"},
  {t:"利元亨锂电设备订单放量",h:78,c:"ind",src:"上市公司公告",d:"2025营收30.77亿",why:"龙头疼一下整个装备集群抖。"},
  {t:"江北生产性服务业139.5亿",h:60,c:"ind",src:"统计公报",d:"金融、商务、软件信息占服务业近半",why:"和制造业的连接被高估了。"},
  {t:"水东街改造后人流回升",h:55,c:"city",src:"本地媒体",d:"老城商业更新，夜间经济",why:"老城在活，但活的是消费不是产业。"},
  {t:"江北CBD写字楼空置率",h:46,c:"city",src:"商业地产公开",d:"服务业集聚但商务楼宇供给偏多",why:"楼多了，人呢？"},
  {t:"AI与机器人产值120亿",h:58,c:"ind",src:"政府工作报告",d:"新赛道布局，孤岛还是引擎待验",why:"现在还像个孤岛。"}
];
const FOOD=[
  {t:"横沥汤粉",h:94,c:"food",src:"本地招牌",d:"猪骨汤熬得鲜甜，粉滑肉香",why:"一碗汤粉，是惠城人一天的开始。"},
  {t:"梅菜扣肉",h:90,c:"food",src:"惠州名菜",d:"国家地理标志，肥而不腻",why:"咸香里是惠州人待客的实在。"},
  {t:"东江盐焗鸡",h:86,c:"food",src:"东江经典",d:"皮爽肉嫩、骨都有味",why:"一只鸡，撑起东江菜的名头。"}
];
const FUN=[
  {t:"惠州西湖",h:96,c:"fun",src:"国家5A景区",d:"苏东坡寓惠，免费开放",why:"半城山色半城湖，是惠城人的骄傲。"},
  {t:"红花湖绿道",h:90,c:"fun",src:"天然氧吧",d:"18公里环湖绿道",why:"家门口的绿道，藏着健康生活。"},
  {t:"水东街",h:88,c:"fun",src:"历史文化街区",d:"千年骑楼老街，越夜越热闹",why:"老街新活力，留住了惠城的根。"}
];
const WARM=[
  {t:"东江两岸的晨跑身影",h:86,c:"warm",src:"城市温度",d:"清晨滨江绿道，跑步的、遛弯的",why:"最暖的八卦，是身边认真生活的人。"},
  {t:"水东街又一家新店开张",h:80,c:"warm",src:"烟火气",d:"咖啡馆、小馆子一家接一家",why:"有人愿意开店，就有人愿意来。"}
];

const catMap={industry:"ind",livelihood:"life",city:"city",food:"food",fun:"fun",gossip:"warm"};
async function loadHot(){
  let j;
  for(let a=0;a<3;a++){
    try{
      const r=await fetch("hot.json?ts="+Date.now());
      if(!r.ok) throw new Error("http "+r.status);
      j=await r.json(); break;
    }catch(e){ if(a===2) throw e; await new Promise(s=>setTimeout(s,500)); }
  }
  hotMeta=j;
  allData=j.items.map(it=>({
    t:it.title, c:catMap[it.cat]||"city",
    src:it.source, url:it.url, d:it.summary, live:it.live,
    tier:it.tier, srcLevel:it.srcLevel
  }));
}
function allTopics(){return allData.length?allData:LOCAL.concat(FOOD,FUN,WARM);}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const relMap={
  ind:"高新区又落地新项目——未来几年你周边的就业、房租可能跟着动",
  life:"家门口的医疗/教育资源在加码，和你家有关",
  city:"你常走的这条路/这个片区，正在悄悄升级",
  food:"本地人排队、外地人专门来吃——你多久没去了？",
  fun:"周末又多一个可以去晃的地方",
  warm:"邻里间的这点小事，就是惠城的烟火气"
};
const catName={ind:"产业",life:"民生",city:"城市",food:"好吃",fun:"好玩",warm:"暖闻"};
const tierColor={"高":"#f87171","较高":"#fbbf24","中":"#34d399"};
const barColor={ind:"#3b82f6",life:"#f97316",city:"#94a3b8",food:"#ef4444",fun:"#10b981",warm:"#fbbf24"};

function render(){
  const list=curCat==="all"?allTopics():allTopics().filter(x=>x.c===curCat);
  // 头条
  if(allTopics().length){
    const top=allTopics()[0];
    document.getElementById("topTitle").textContent=top.t;
    document.getElementById("topMeta").innerHTML=
      `<span class="src">${esc(top.srcLevel||"")}</span><span>${esc(top.src||"")}</span><span>关注·${esc(top.tier||"高")}</span>`;
  }
  // 列表
  const el=document.getElementById("topicList");
  el.innerHTML=list.map(x=>{
    const liveBadge=x.live?'<span class="live">实时</span>':'';
    const likes=localStorage.getItem("like_"+x.t)??0;
    const tc=tierColor[x.tier]||"#34d399";
    const bc=barColor[x.c]||"#94a3b8";
    const rel=relMap[x.c]||relMap.city;
    return `<div class="tcard glass" data-t="${esc(x.t)}">
      <div class="bar" style="background:${bc}"></div>
      <div class="body">
        <div class="tags"><span class="cn">${catName[x.c]||"城市"}</span>${liveBadge}<span>· ${esc(x.src||"")}</span></div>
        <div class="t">${esc(x.t)}</div>
        <div class="rel">💡 ${esc(rel)}</div>
        <div class="foot">
          <span class="tier" style="color:${tc};border-color:${tc}44;background:${tc}11">关注 · ${esc(x.tier||"中")}</span>
          <button class="likeBtn" onclick="event.stopPropagation();like(this)">👍 <b class="ln">${likes}</b></button>
        </div>
        <div class="detail">${esc(x.d||"")}${x.url?`<div style="margin-top:8px"><a href="${esc(x.url)}" target="_blank" rel="noopener nofollow">查看原始报道 ↗</a></div>`:""}</div>
      </div>
    </div>`;
  }).join("");
  if(!list.length){
    el.innerHTML='<div class="glass" style="padding:26px;text-align:center;color:#5b6b82">今日话题快照暂不可用，可点「重新扫描」重试。</div>';
  }
  document.querySelectorAll("#topicList .tcard").forEach(c=>{
    c.onclick=()=>{
      const d=c.querySelector(".detail");
      d.style.display=d.style.display==="none"?"block":"none";
    };
  });
}
function like(el){
  let n=parseInt(el.querySelector(".ln").textContent||"0")+1;
  el.querySelector(".ln").textContent=n;
  el.style.transform="scale(1.2)";
  setTimeout(()=>el.style.transform="",200);
}
document.querySelectorAll(".cat").forEach(b=>{
  b.onclick=()=>{

function scanText(){
  return `每日自动刷新 · 上次更新 ${hotMeta.updated||"—"} · 共${allTopics().length}个话题 · 按关注档排序`;
}
document.getElementById("btnScan").onclick=async function(){
  this.innerHTML='<span class="pulse">⏳</span> 扫描中…';
  document.getElementById("scanInfo").textContent="雷达旋转中，正在读取当日话题快照…";
  try{
    await loadHot();
    this.innerHTML="🔄 重新扫描";
    document.getElementById("scanInfo").textContent=scanText();
  }catch(e){
    this.innerHTML="🔄 重新扫描";
    document.getElementById("scanInfo").textContent="扫描失败：快照暂不可用；下方兜底话题不受影响。";
  }
  render();
};

// 投票逻辑（时间胶囊）
(function(){
  const KEY="huicheng_judge_v1";
  const opts=[
    {k:"sure",label:"我看稳了",cls:"vote-sure",mood:"你比模型乐观",color:"#34d399"},
    {k:"risky",label:"有点悬",cls:"vote-risky",mood:"你比模型悲观",color:"#f87171"},
    {k:"wait",label:"不好说",cls:"vote-wait",mood:"你和模型一样谨慎",color:"#94a3b8"}
  ];
  let d=JSON.parse(localStorage.getItem(KEY)||'{"sure":0,"risky":0,"wait":0}');
  const voted=localStorage.getItem(KEY+"_done");

  function render(){
    const total=opts.reduce((s,o)=>s+d[o.k],0);
    document.getElementById("voteBar").innerHTML=opts.map(o=>{
      const dis=voted?'disabled':'';
      return `<button class="${o.cls}" ${dis} onclick="judge('${o.k}')">${o.label}</button>`;
    }).join("");

    if(voted){
      const my=opts.find(o=>d[o.k]>0)||opts[0];
      const now=new Date();
      const sealDate=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,"0")}.${String(now.getDate()).padStart(2,"0")}`;
      document.getElementById("voteOut").innerHTML=
        `你这一票投给了「<b style="color:${my.color}">${my.label}</b>」——${my.mood}。`;
      document.getElementById("sealText").innerHTML=
        `🔒 已封存 · <b>${sealDate}</b>　|　2030年回来开奖，看看你的判断准不准。`;
      let barHtml="",labHtml="";
      opts.forEach(o=>{
        const pct=total?Math.round(d[o.k]/total*100):0;
        barHtml+=`<i style="width:${pct}%;background:${o.color}"></i>`;
        labHtml+=`<span style="color:${o.color}">${o.label} ${pct}%</span>`;
      });
      document.getElementById("distBar").innerHTML=barHtml;
      document.getElementById("distLabel").innerHTML=labHtml;
      document.getElementById("seal").classList.add("on");
    }
  }
  window.judge=function(k){
    if(localStorage.getItem(KEY+"_done"))return;
    d[k]++;localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+"_done","1");
    render();
  };
  render();
})();

// 首屏初始化
(async()=>{
  let hotOk=true;
  try{ await loadHot(); }catch(e){ hotOk=false; hotMeta={}; allData=[]; }
  document.getElementById("scanInfo").textContent=
    hotOk?scanText():"今日快照暂不可用，显示内置话题池；仿真结果不受影响。";
  render();
  try{
    const b=HT.run(42,4000,HT.DEFAULT_PATHS);
    document.getElementById("baseHit").textContent=b.hit.toFixed(0)+"%";
    document.getElementById("baseP50").textContent=Math.round(b.p50);
    const C=276.5;
    const off=C*(1-b.hit/100);
    const arc=document.getElementById("gaugeArc");
    arc.style.transition="stroke-dashoffset 1.2s ease-out";
    requestAnimationFrame(()=>{arc.style.strokeDashoffset=off;});
  }catch(e){}
})();
</script>

<script>
// 点赞/分享
(function(){
  var k="like_"+location.pathname;
  var n=parseInt(localStorage.getItem(k)||"0");
  document.getElementById("pcount").textContent=n;
  window.likePage=function(){n++;localStorage.setItem(k,n);document.getElementById("pcount").textContent=n;};
  window.sharePage=function(){
    if(navigator.share && !/MicroMessenger/i.test(navigator.userAgent)){
      navigator.share({title:document.title,url:location.href}).catch(()=>{});
    }
    navigator.clipboard && navigator.clipboard.writeText(location.href);
  };
})();
</script>
