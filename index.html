function drawSign(){
  const d=new Date();
  const seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  const s=SIGNS[seed%SIGNS.length];
  document.getElementById("signBody").innerHTML=`<div style="font-size:32px">${s.e}</div><b style="color:#60a5fa">${s.t}</b><div style="font-size:13px;color:#cbd5e1;margin-top:6px">${s.d}</div>`;
}
drawSign();

const KW=["惠州","惠城","仲恺","大亚湾","惠阳","博罗","惠东","龙门","东江湾","水口","马安","江北CBD","深惠","粤海","TCL","德赛","亿纬锂能","龙光","隆生"];

async function fetchLive(){
  liveTopics=[];
  const apis=[
    {url:"https://api.vvhan.com/api/hotlist/wbHot",name:"微博热搜"},
    {url:"https://api.vvhan.com/api/hotlist/baiduRD",name:"百度热搜"},
    {url:"https://api.vvhan.com/api/hotlist/zhihuHot",name:"知乎热榜"},
    {url:"https://api.vvhan.com/api/hotlist/douyinHot",name:"抖音热点"},
    {url:"https://api.vvhan.com/api/hotlist/toutiao",name:"今日头条"},
    {url:"https://api.vvhan.com/api/hotlist/bili",name:"B站热门"},
    {url:"https://api.vvhan.com/api/hotlist/weixin",name:"微信热搜"},
    {url:"https://api.vvhan.com/api/hotlist/thepaper",name:"澎湃"},
    {url:"https://api.vvhan.com/api/hotlist/people",name:"人民日报"},
    {url:"https://api.vvhan.com/api/hotlist/wangyi",name:"网易新闻"},
    {url:"https://api.vvhan.com/api/hotlist/sina",name:"新浪"},
    {url:"https://api.vvhan.com/api/hotlist/huanqiu",name:"环球网"}
  ];
  for(const api of apis){
    try{
      const r=await fetch(api.url);
      const j=await r.json();
      if(j.data&&Array.isArray(j.data)){
        j.data.forEach((it,i)=>{
          const title=it.title||it.word||"";
          if(KW.some(k=>title.includes(k))){
            liveTopics.push({
              t:title,
              h:Math.max(60, 95-i*1.5),
              c:"city",
              src:api.name+"·实时",
              url:it.url||it.mobileUrl||"",
              d:`来自${api.name}实时榜第${i+1}位`,
              why:"热搜在榜——这是正在被讨论的事。",
              live:true
            });
          }
        });
      }
    }catch(e){/* 静默失败，用本地池 */}
  }
}

function allTopics(){return [...liveTopics, ...LOCAL, ...FOOD, ...FUN, ...WARM];}

function render(){
  let list=curCat==="all"?allTopics():allTopics().filter(x=>x.c===curCat);
  list=list.map(x=>({...x,hs:x.h+Math.random()*4-2})).sort((a,b)=>b.hs-a.hs);
  const el=document.getElementById("topicList");
  el.innerHTML=list.map((x,i)=>{
    const catCls={ind:"cat-ind",life:"cat-life",city:"cat-city",food:"cat-food",fun:"cat-fun",warm:"cat-fun"}[x.c]||"cat-city";
    const catName={ind:"产业",life:"民生",city:"城市",food:"好吃",fun:"好玩",warm:"八卦"}[x.c]||"城市";
    const heatColor=x.hs>=80?"#f87171":x.hs>=60?"#fbbf24":"#34d399";
    const tagBg={ind:"#1e3a5f",life:"#3d2817",city:"#2a2f3a",food:"#3f1414",fun:"#0c2a1e",warm:"#3a2a10"}[x.c];
    const tagFg={ind:"#60a5fa",life:"#fb923c",city:"#9ca3af",food:"#f87171",fun:"#34d399",warm:"#fbbf24"}[x.c];
    const liveBadge=x.live?'<span style="background:#dc2626;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle">实时</span>':'';
    if(i===0){
      return `<div class="top1" onclick="this.classList.toggle('open')">
        <span class="badge">🔥 今日最热</span>${liveBadge}
        <div class="t">${x.t}</div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="heatnum">${Math.round(x.hs)}°</span>
          <span style="flex:1;height:6px;background:#16233a;border-radius:3px;overflow:hidden"><i style="display:block;height:100%;width:${x.hs}%;background:linear-gradient(90deg,#f87171,#fbbf24)"></i></span>
          <span class="src">${x.src}</span>
        </div>
        <div class="detail" style="font-size:12.5px;color:#cbd5e1;margin-top:8px">${x.d}<br><span style="color:#fbbf24">→ ${x.why}</span></div>
      </div>`;
    }
    return `<div class="topic ${catCls}" style="animation-delay:${i*50}ms" onclick="this.classList.toggle('open')">
      <div class="rank">${i+1}</div>
      <div class="body">
        <div class="t">${x.t}${liveBadge}</div>
        <div class="meta">
          <span class="heat"><i style="width:${Math.min(100,x.hs)}%;background:${heatColor}"></i></span>
          <span>${Math.round(x.hs)}°</span>
          <span class="src">${x.src}</span>
          <span class="cat-tag" style="background:${tagBg};color:${tagFg}">${catName}</span>
        </div>
        <div class="detail">${x.d}<br><span style="color:#fbbf24">→ ${x.why}</span></div>
      </div>
    </div>`;
  }).join("");
}

document.querySelectorAll(".cat").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    curCat=b.dataset.c;
    render();
  };
});

document.getElementById("btnScan").onclick=async function(){
  this.innerHTML='<span class="pulse">⏳</span> 扫描中…';
  document.getElementById("scanInfo").textContent="雷达旋转中，正在拉取12个公开渠道…";
  document.getElementById("scanline").classList.add("fast");
  await fetchLive();
  this.innerHTML="🔄 重新扫描";
  document.getElementById("scanline").classList.remove("fast");
  const now=new Date();
  const liveN=liveTopics.length;
  document.getElementById("scanInfo").textContent=`上次扫描：${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} · 实时热搜${liveN}条 + 话题${LOCAL.length}条 + 好吃${FOOD.length}·好玩${FUN.length}·八卦${WARM.length}`;
  render();
};

  render();
})();
