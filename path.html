<style>

</style></head><body>

<div class="wrap">
  <h1>哪条路真管用</h1>
  <p class="sub">五条路都摆在桌上，但不是每条都真能拉动结果。跑一万次，看哪条路和最终结果绑得最紧。</p>

  <div class="card">
    <h2>影响系数从大到小</h2>
    <div style="height:220px"><canvas id="chart"></canvas></div>
    <div style="font-size:11px;color:#5b6b82;margin-top:6px">系数越接近1，这条路对最终结果影响越大。最上面那条就是命门。</div>
  </div>

  <div class="card">
    <h2>一句话</h2>
    <div id="conclusion" style="font-size:14px;line-height:1.9;color:#cbd5e1"></div>
  </div>

  <div class="next"><a href="index.html">回到首页 →</a></div>
</div>

<script>
function randn(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

// 五条路参数（和第五页一致）
const paths=[
  {mu:500, sd:100},
  {mu:200, sd:60},
  {mu:100, sd:40},
  {mu:100, sd:40},
  {mu:50, sd:30},
  {mu:30, sd:30}
];
const pNames=['新投产项目','三大集群','AI机器人','服务业带动','融深融湾'];
const pColors=['#3b82f6','#8b5cf6','#06b6d4','#fbbf24','#f87171'];

const N=10000;
const results=[];
const pathContribs=[[],[],[],[],[]];
for(let i=0;i<N;i++){
  let total=632.7;
  paths.forEach((p,j)=>{
    let v=p.mu+randn()*p.sd;
    if(v<0)v=0;
    total+=v;
    if(j<5)pathContribs[j].push(v);
  });
  total*=1+randn()*0.08;
  results.push(total);
}

function corr(xs,ys){
  const n=xs.length;
  const mx=xs.reduce((a,b)=>a+b,0)/n;
  const my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){
    num+=(xs[i]-mx)*(ys[i]-my);
    dx+=(xs[i]-mx)**2;
    dy+=(ys[i]-my)**2;
  }
  return num/Math.sqrt(dx*dy);
}
const coefs=pathContribs.map(c=>Math.abs(corr(c,results)));

// 画图
new Chart(document.getElementById('chart').getContext('2d'),{
  type:'bar',
  data:{labels:pNames,datasets:[{
    data:coefs,
    backgroundColor:pColors,
    borderRadius:4
  }]},
  options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},
      tooltip:{callbacks:{label:(item)=>'影响系数 '+item.parsed.x.toFixed(2)}}
    },
    scales:{
      x:{ticks:{color:'#6b7280',callback:v=>v.toFixed(1)},grid:{color:'#1c2739'},max:1},
      y:{ticks:{color:'#93a4bd',font:{size:12}},grid:{display:false}}
    }
  }
});

const maxIdx=coefs.indexOf(Math.max(...coefs));
document.getElementById('conclusion').innerHTML=
  `绑得最紧的是<b style="color:${pColors[maxIdx]}">${pNames[maxIdx]}</b>，系数${coefs[maxIdx].toFixed(2)}。`+
  `意思是：这条路上上下下动一点，最终结果就跟着动。其他几条路，系数低不少——它们在转，但没怎么传动。`+
  `资源有限的时候，先保系数最高的那条。`;
</script>
