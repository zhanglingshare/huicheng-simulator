<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>惠城基础盘 · 结构透镜</title>
<meta name="description" content="用图表看惠城基础经济：住房、医疗、教育、公用事业与本地就业，数字未公开就留白。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A84FF'/%3E%3Ccircle cx='8' cy='12' r='2.4' fill='white'/%3E%3Ccircle cx='16' cy='8' r='2.4' fill='white' opacity='.85'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='white' opacity='.7'/%3E%3Cpath d='M8 12 L16 8 M8 12 L16 16' stroke='white' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="lens.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <a class="back" href="../index.html" aria-label="返回主站">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="brand"><b>惠城结构透镜</b><span>STRUCTURE LENS</span></div>
    <div class="spacer"></div>
    <div class="tabs">
      <a href="capability.html">能力底盘</a>
      <a class="on" href="foundation.html">基础盘</a>
    </div>
  </div>
</div>

<div class="wrap">

  <header class="hero">
    <h1>惠城基础盘</h1>
    <div class="meta"><span class="chip" id="chip-asof"></span></div>
  </header>

  <!-- KPI 大数字 -->
  <section class="section">
    <div class="kpi-grid" id="kpiGrid"></div>
  </section>

  <!-- 保障房 + 人口城镇化 -->
  <section class="section">
    <div class="chart-grid">
      <div class="chart">
        <h3>保障房（已公开套数）</h3>
        <div class="chart-box short" id="cHouse"></div>
      </div>
      <div class="chart">
        <h3>人口与城镇化</h3>
        <div class="ring-row" style="margin-top:8px">
          <div class="ring-card" id="ringUrban" style="padding:6px">
            <div class="chart-box short" id="cUrban" style="height:180px"></div>
          </div>
          <div class="ring-card">
            <span class="big" id="popTotal"></span>
            <span class="lb">常住人口（万）</span>
          </div>
        </div>
      </div>
    </div>
    <p class="chain-note" id="housePending"></p>
  </section>

  <!-- 医疗 -->
  <section class="section">
    <div class="chart">
      <h3>市一院三期（规划）</h3>
      <div class="ring-row" style="margin-top:12px">
        <div class="ring-card"><span class="big" id="medBeds"></span><span class="lb">规划床位（床）</span></div>
        <div class="ring-card"><span class="big" id="medArea"></span><span class="lb">总建筑面积（㎡）</span></div>
      </div>
      <div class="frow" style="margin-top:12px">
        <span style="color:var(--t3)">现状开放床位</span>
        <span class="na" style="color:var(--t4);font-style:italic">暂未公开</span>
      </div>
    </div>
  </section>

  <!-- 项目阶段 -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">01</span><h2>项目所处阶段</h2></div>
    <div class="stage-flow" id="stageFlow"></div>
  </section>

  <!-- 留白清单 -->
  <section class="section">
    <div class="blank">
      <b>暂未公开（不估算）：</b>
      <span id="blankList" style="color:var(--t3)"></span>
    </div>
  </section>

  <section class="src">
    <h3>公开来源</h3>
    <ul id="srcList"></ul>
    <p class="disclaim" id="disclaim"></p>
  </section>

</div>

<script src="../echarts.min.js"></script>
<script src="lens-data.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const AXIS='#828A96';
const charts=[];
function mk(id,opt){const c=echarts.init(document.getElementById(id));c.setOption(opt);charts.push(c);return c;}

$('#chip-asof').textContent=LENS_META.asof;

/* KPI 卡 */
$('#kpiGrid').insertAdjacentHTML('beforeend',KPI.map(k=>`
  <div class="kpi">
    <div class="kk">${k.k}</div>
    <div class="vv">${k.v}<span class="uu">${k.unit}</span></div>
    <div class="yy ${k.state}">${k.yoy}</div>
  </div>`).join(''));

/* 保障房柱状 */
mk('cHouse',{
  grid:{left:30,right:16,top:30,bottom:24},
  xAxis:{type:'category',data:HOUSE_BARS.map(d=>d.name),axisLine:{lineStyle:{color:'rgba(255,255,255,.15)'}},
    axisTick:{show:false},axisLabel:{color:AXIS,fontSize:10.5,interval:0}},
  yAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(255,255,255,.07)'}},
    axisLabel:{color:AXIS,fontSize:10}},
  series:[{type:'bar',barWidth:46,data:HOUSE_BARS.map(d=>({value:d.v,
      itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,
        [{offset:0,color:'#6FB2FF'},{offset:1,color:'#0A84FF'}]),borderRadius:[5,5,0,0]}})),
    label:{show:true,position:'top',color:'#F2F4F7',fontSize:12,formatter:'{c} 套'}}]
});

/* 城镇化环形 */
mk('cUrban',{
  series:[{type:'pie',radius:['64%','82%'],center:['50%','50%'],avoidLabelOverlap:false,
    label:{show:false},
    data:[
      {value:POP.urban,name:'城镇化',itemStyle:{color:'#63E6BE'}},
      {value:+(100-POP.urban).toFixed(2),itemStyle:{color:'rgba(255,255,255,.1)'}}]}],
  graphic:[{type:'text',left:'center',top:'center',
    style:{text:POP.urban+'%',fill:'#F2F4F7',fontSize:20,fontWeight:700,fontFamily:'SF Mono'}}]
});
$('#popTotal').textContent=POP.total;

/* 医疗 */
$('#medBeds').textContent=MED.beds;
$('#medArea').textContent=MED.area.toLocaleString();

/* 阶段流程 */
$('#stageFlow').insertAdjacentHTML('beforeend',STAGES.map(s=>`
  <div class="stage">
    <span class="badge ${s.code}">${s.stage}</span>
    <span class="snm">${s.name}</span>
  </div>`).join(''));

/* 留白 */
$('#blankList').textContent=BLANKS.join('　·　');
$('#housePending').textContent=HOUSE_PENDING;

/* 来源 */
$('#srcList').insertAdjacentHTML('beforeend',LENS_SOURCES.map(s=>
  `<li><a href="${s.url}" target="_blank" rel="noopener"><i>${s.id}</i><span>${s.label}</span></a></li>`).join(''));
$('#disclaim').textContent=LENS_META.note+' 数字未公开的一律留白，不估算、不补全。';

window.addEventListener('resize',()=>charts.forEach(c=>c.resize()));
})();
</script>
</body>
</html>
