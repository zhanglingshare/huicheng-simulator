<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>惠城基础盘 · 结构透镜</title>
<meta name="description" content="看维系惠城日常的基础经济：住房、医疗、教育、公用事业与本地就业，每个项目标在哪个街道、处在哪一阶段，数字未公开就留白。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A84FF'/%3E%3Ccircle cx='8' cy='12' r='2.4' fill='white'/%3E%3Ccircle cx='16' cy='8' r='2.4' fill='white' opacity='.85'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='white' opacity='.7'/%3E%3Cpath d='M8 12 L16 8 M8 12 L16 16' stroke='white' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="lens.css">
</head>
<body>

<!-- ===== 顶部 ===== -->
<div class="topbar">
  <div class="topbar-in">
    <a class="back" href="../index.html" aria-label="返回主站">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="brand">
      <b>惠城结构透镜</b>
      <span>STRUCTURE LENS</span>
    </div>
    <div class="spacer"></div>
    <div class="tabs">
      <a href="capability.html">能力底盘</a>
      <a class="on" href="foundation.html">基础盘</a>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- ===== 页头 ===== -->
  <header class="hero">
    <h1>维系日常的<br>那部分，最实在</h1>
    <p>住房、医疗、教育、公用事业、本地就业——这些不抢眼，却连着每个人的日子。每个项目标清楚在哪个街道、处在哪一阶段；数字没公开，就老实留白。</p>
    <div class="meta">
      <span class="chip" id="chip-asof"></span>
      <span class="chip" id="chip-checked"></span>
    </div>
  </header>

  <!-- ===== 01 基础盘项目 ===== -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">01</span><h2>五块基础盘</h2></div>
    <p class="sec-sub">阶段标签区分已投用、在建与规划公示；不同阶段的项目不合并计数。</p>
    <div class="found-grid" id="foundGrid"></div>
  </section>

  <!-- ===== 留白说明 ===== -->
  <section class="section">
    <div class="blank">
      <b>为什么有些地方是空的？</b><br>
      标注「暂未公开」的，是官方公示正文里确实没有给出的数字（如套数、学位、投资规模）。结构透镜只显影真实存在的信息，不估算、不补全；等后续公示或官方发布后再填上。
    </div>
  </section>

  <!-- ===== 来源 ===== -->
  <section class="src">
    <h3>公开来源（点击可核对原文）</h3>
    <ul id="srcList"></ul>
    <p class="disclaim" id="disclaim"></p>
  </section>

</div>

<script src="lens-data.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);

/* 线性图标（stroke 风格） */
const ICONS={
  house:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/><path d="M9.5 19v-5h5v5"/>',
  med:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8.5v7M8.5 12h7"/>',
  edu:'<path d="M3 8.5 12 5l9 3.5-9 3.5z"/><path d="M7 10.5V16c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-5.5"/>',
  util:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  job:'<rect x="4" y="7" width="16" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M4 12.5h16"/>'
};

$('#chip-asof').textContent='数据期次：'+LENS_META.asof;
$('#chip-checked').textContent='核验：'+LENS_META.checked;

/* 基础盘卡 */
const foundGrid=$('#foundGrid');
FOUNDATIONS.forEach(f=>{
  const rows=f.rows.map(r=>{
    const val=(r.v===null)
      ? '<span class="na">暂未公开</span>'
      : `<span>${r.v}</span>`;
    return `<div class="frow"><span>${r.k}</span>${val}</div>`;
  }).join('');
  foundGrid.insertAdjacentHTML('beforeend',`
  <article class="found">
    <div class="found-head">
      <span class="found-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[f.ico]}</svg>
      </span>
      <span>
        <span class="found-name">${f.name}</span>
        <span class="found-place">${f.place}</span>
      </span>
      <span class="found-state ${f.state}">${f.stateLabel}</span>
    </div>
    <div class="found-rows">${rows}</div>
  </article>`);
});

/* 来源 */
const srcList=$('#srcList');
LENS_SOURCES.forEach(s=>{
  srcList.insertAdjacentHTML('beforeend',
    `<li><a href="${s.url}" target="_blank" rel="noopener"><i>${s.id}</i><span>${s.label}</span></a></li>`);
});
$('#disclaim').textContent=LENS_META.note+' 基础经济连着就业与生计，是区域能力的一部分；本页只呈现可核对的项目状态，不替人给结论。';
})();
</script>
</body>
</html>
